# billing-server/api/openapi.yaml
# 결제 서버가 받는 요청과 돌려주는 응답의 목록(OpenAPI, #560). 손으로 쓴다.
#
# 코드와 어긋나지 않게 테스트가 둘을 본다(internal/httpapi).
#   - 라우터의 주소와 이 파일의 주소가 서로 빠짐없이 같다(spec_test.go)
#   - HTTP 테스트가 받은 응답은 모두 이 파일의 모양과 상태 코드에 맞는다(serve 를 지나는 요청)
# 주소, 요청, 응답의 모양을 바꾸면 이 파일을 함께 고치고, 저장소 루트에서 docs/api/billing.openapi.json 을 다시 뽑는다
# (uv run --no-project python tools/export_openapi.py billing).
#
# 크레딧의 양은 숫자가 아니라 글자다("80", "-20"). 원(price)은 숫자다. 시각은 UTC 의 RFC 3339 다.
# 누가 부르는지(x-audience)는 뽑는 도구가 주소의 모양으로 붙인다(/service/ 는 서버끼리, /webhooks/ 는 결제 대행사).
openapi: 3.0.3
info:
  title: AI TRPG 결제 서버
  version: 0.1.0
  description: 크레딧의 지갑과 원장, 주문과 결제, 출석, 그리고 게임 서버와 인증 서버가 부르는 홀드, 가격, 환영 크레딧, 결제 자격.
servers:
  - url: /
tags:
  - name: health
  - name: wallet
  - name: orders
  - name: attendance
  - name: webhooks
  - name: service

paths:
  /health:
    get:
      tags: [health]
      summary: 프로세스가 살아 있다. DB 를 보지 않는다
      operationId: health
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "500": { $ref: "#/components/responses/ServerError" }
    head:
      tags: [health]
      summary: GET 과 같다. 본문이 없다
      operationId: healthHead
      responses:
        "200":
          description: 살아 있다
        "500":
          description: 서버 쪽의 문제다
  /health/ready:
    get:
      tags: [health]
      summary: DB 가 3초 안에 답하면 200, 아니면 503
      operationId: ready
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "500": { $ref: "#/components/responses/ServerError" }
        "503":
          description: DB 에 닿지 않는다. 이유는 싣지 않는다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
    head:
      tags: [health]
      summary: GET 과 같다. 본문이 없다
      operationId: readyHead
      responses:
        "200":
          description: 요청을 받을 수 있다
        "500":
          description: 서버 쪽의 문제다
        "503":
          description: DB 에 닿지 않는다

  /api/v1/billing/me:
    get:
      tags: [wallet]
      summary: 토큰의 주인(인증 서버의 public_id)
      operationId: getMe
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 토큰의 주인
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id]
                properties:
                  user_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/wallet:
    get:
      tags: [wallet]
      summary: 지금 쓸 수 있는 크레딧. 지갑이 없으면 모두 "0" 이다
      operationId: getWallet
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 산 것(골드), 무료(실버), 둘의 합, 무료 중 가장 먼저 사라지는 것
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/wallet/entries:
    get:
      tags: [wallet]
      summary: 원장. 최근 것부터
      operationId: listWalletEntries
      security: [{ bearer: [] }]
      parameters:
        - name: before
          in: query
          description: 이 번호보다 앞선 줄만 읽는다. 앞 응답의 next_before 를 그대로 넣는다
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: limit
          in: query
          description: 한 번에 읽는 줄 수(1~100, 기본 20)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 원장의 한 쪽
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/products:
    get:
      tags: [orders]
      summary: 파는 상품
      operationId: listProducts
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 상품의 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/orders:
    post:
      tags: [orders]
      summary: 주문을 만든다. 같은 Idempotency-Key 로 다시 보내면 먼저 만든 주문을 200 으로 돌려준다
      operationId: createOrder
      security: [{ bearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 같은 주문을 두 번 만들지 않게 하는 열쇠. 화면이 주문마다 새로 짓는다
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, example: credits-1000 }
      responses:
        "201":
          description: 새로 만들었다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: 같은 열쇠로 이미 만든 주문이다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PaymentForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [orders]
      summary: 토큰의 주인의 주문. 만든 시각이 늦은 것부터
      operationId: listOrders
      security: [{ bearer: [] }]
      parameters:
        - name: before
          in: query
          description: 이 주문보다 앞선 것만 읽는다. 앞 응답의 next_before 를 그대로 넣는다
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: 한 번에 읽는 주문 수(1~50, 기본 20)
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 주문의 한 쪽
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orders, next_before]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_before:
                    type: string
                    format: uuid
                    nullable: true
                    description: 더 읽을 것이 없으면 null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/orders/{id}:
    get:
      tags: [orders]
      summary: 토큰의 주인의 주문 하나. 남의 주문이나 모양이 틀린 번호는 404
      operationId: getOrder
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 주문
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/orders/{id}/confirm:
    post:
      tags: [orders]
      summary: 결제의 승인을 요청한다. 결과가 났으면 200, 아직 모르면 202. 본문의 status 가 지금의 상태다
      operationId: confirmOrder
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_key]
              properties:
                payment_key:
                  type: string
                  description: 결제창이 준 결제 대행사의 결제 번호
      responses:
        "200":
          description: 승인 또는 거절이 끝났다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "202":
          description: 결제 대행사의 답을 아직 모른다(confirming). 웹훅이나 대사가 마저 끝낸다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PaymentForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/orders/{id}/refund:
    post:
      tags: [orders]
      summary: 청약철회. 치른 지 7일 안이고 그 주문의 크레딧이 하나도 줄지 않았으면 전액을 취소한다
      operationId: refundOrder
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 취소가 끝났다(refunded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "202":
          description: 결제 대행사의 답을 아직 모른다(refunding). 대사가 같은 취소를 다시 보낸다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PaymentForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            청약철회를 할 수 없다. code 가 까닭이다.
            refund.window_closed(7일이 지났다), refund.credits_used(크레딧을 썼거나 홀드로 묶었다),
            refund.not_paid(치른 주문이 아니다), refund.busy(같은 주문의 다른 요청과 엇갈렸다. 다시 보낸다),
            refund.refused(결제 대행사가 거절했다. 크레딧은 돌아와 있다)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/attendance:
    get:
      tags: [attendance]
      summary: 오늘의 출석. 본인인증 전이면 verified 가 false
      operationId: getAttendance
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 오늘 받았는지, 주기의 며칠째인지, 오늘의 양, 상자를 여는 날인지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [attendance]
      summary: 오늘의 출석 보상을 받는다
      operationId: claimAttendance
      security: [{ bearer: [] }]
      responses:
        "201":
          description: 받은 보상
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 본인인증 전이다(attendance.verification_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 오늘 이미 받았다(attendance.already_claimed). 한국 자정에 다시 받는다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/attendance/rewards:
    get:
      tags: [attendance]
      summary: 하루 양과 보물 상자의 확률. 로그인 없이 누구나 본다
      operationId: getAttendanceRewards
      responses:
        "200":
          description: 보상표
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rewards" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/webhooks/payment:
    post:
      tags: [webhooks]
      summary: 결제 대행사의 알림. 결과를 모르던 주문을 마저 끝낸다
      operationId: paymentWebhook
      security: [{ paymentSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, payment_key]
              properties:
                order_id: { type: string, format: uuid }
                payment_key: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Received" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 서명이 없거나 맞지 않다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503":
          description: 지금은 처리할 수 없다. 결제 대행사가 다시 보낸다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/billing/webhooks/toss:
    post:
      tags: [webhooks]
      summary: 토스페이먼츠의 결제 상태 알림(PAYMENT_STATUS_CHANGED). PAYMENT_PROVIDER=toss 일 때만 있다
      description: 서명이 없는 알림이다. 결과는 믿지 않고 토스페이먼츠에 다시 묻는다. 다른 종류의 알림도 200 이다.
      operationId: tossWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 토스페이먼츠가 정한 모양(eventType, createdAt, data)
      responses:
        "200": { $ref: "#/components/responses/Received" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503":
          description: 토스페이먼츠에 묻지 못했다. 토스페이먼츠가 다시 보낸다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/billing/service/holds:
    post:
      tags: [service]
      summary: (게임, chat 서버) 사용자의 크레딧을 먼저 빼 둔다. 같은 이름표로 다시 부르면 먼저 건 홀드를 200 으로 돌려준다
      description: 서버마다 쓸 수 있는 가격표 이름의 머리가 있다(게임 narration, chat 의 chat 과 story). 다른 머리의 이름은 없는 가격표와 같은 400 price.unknown 이다
      operationId: placeHold
      security: [{ serviceSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reference, price_code]
              properties:
                user_id: { type: string, format: uuid }
                reference:
                  type: string
                  description: "부르는 서버가 지은 이름표(영문자, 숫자, 점, 밑줄, 쌍점, 붙임표로 된 8~200자)"
                price_code: { type: string, example: narration.standard }
      responses:
        "201":
          description: 새로 걸었다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "200":
          description: 같은 이름표로 이미 건 홀드다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "402":
          description: 크레딧이 모자란다. credit.insufficient 또는 credit.gold_required(프리미엄은 골드로만)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ServiceConflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/service/holds/capture:
    post:
      tags: [service]
      summary: (게임, chat 서버) 홀드를 확정한다. 크레딧은 돌아오지 않는다. 그 서버가 건 홀드만
      operationId: captureHold
      security: [{ serviceSignature: [] }]
      requestBody: { $ref: "#/components/requestBodies/HoldReference" }
      responses: &settleResponses
        "200":
          description: 끝난 뒤의 홀드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "404":
          description: 그 이름표의 홀드가 없다(hold.not_found). 402 로 걸리지 않은 것도 여기다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ServiceConflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/service/holds/release:
    post:
      tags: [service]
      summary: (게임, chat 서버) 홀드를 돌려준다. 크레딧이 뺐던 자리로 돌아간다. 그 서버가 건 홀드만
      operationId: releaseHold
      security: [{ serviceSignature: [] }]
      requestBody: { $ref: "#/components/requestBodies/HoldReference" }
      responses: *settleResponses

  /api/v1/billing/service/holds/extend:
    post:
      tags: [service]
      summary: (게임, chat 서버) 홀드의 만료 시각을 지금부터 그 서버의 만료 시간(HOLD_TTL, chat 서버는 CHAT_HOLD_TTL) 뒤로 민다. 끝난 홀드면 409
      operationId: extendHold
      security: [{ serviceSignature: [] }]
      requestBody: { $ref: "#/components/requestBodies/HoldReference" }
      responses: *settleResponses

  /api/v1/billing/service/prices:
    get:
      tags: [service]
      summary: (게임, chat 서버) 가격표의 지금 값과 다음에 바뀔 값. 부르는 서버의 머리의 줄만. If-None-Match 가 지금의 ETag 와 같으면 304
      operationId: listPrices
      security: [{ serviceSignature: [] }]
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: 가격 목록
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceList" }
        "304":
          description: 바뀌지 않았다
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/service/grants/welcome:
    post:
      tags: [service]
      summary: (인증 서버) 본인인증을 마친 사용자에게 환영 크레딧을 준다. 한 사용자에 한 번
      operationId: grantWelcome
      security: [{ serviceSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "201":
          description: 줬다(granted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Welcome" }
        "200":
          description: 이미 줬다(already_granted) 또는 주지 않게 해 두었다(disabled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Welcome" }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/service/eligibility:
    post:
      tags: [service]
      summary: (인증 서버) 사용자의 결제 자격(성년이 되는 날, 보호자 동의)을 받아 적는다. 가진 것보다 높은 버전만 받는다
      operationId: recordEligibility
      security: [{ serviceSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, version, legal_adult_from, guardian_consent]
              properties:
                user_id: { type: string, format: uuid }
                version: { type: integer, format: int64, minimum: 1 }
                legal_adult_from:
                  type: string
                  format: date
                  nullable: true
                  description: 민법의 성년이 되는 날(만 19세 생일). 본인인증 전이면 null
                guardian_consent: { type: boolean }
      responses:
        "200":
          description: 적었다(applied) 또는 가진 것이 더 새것이라 적지 않았다(stale)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [applied, stale] }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/billing/service/users/{id}/withdrawal:
    post:
      tags: [service]
      summary: (인증 서버) 사용자의 탈퇴를 반영한다. 걸린 홀드를 돌려주고, 남은 크레딧을 소멸로 적고, 결제 자격을 지운다
      description: |
        인증 서버가 유예(7일)가 지난 계정을 비운 뒤 알린다(docs/architecture/withdrawal.md). 200 과 processed 를 받을 때까지 다시 보낸다.
        몇 번을 받아도 결과가 같다. 이미 반영한 사용자와 이 서버가 모르는 사용자도 200 이다
      operationId: processWithdrawal
      security: [{ serviceSignature: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 탈퇴한 사용자(인증 서버의 public_id)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [withdrawn_at]
              properties:
                withdrawn_at:
                  type: string
                  format: date-time
                  description: 인증 서버가 계정을 비운 시각
      responses:
        "200":
          description: 반영했다. 이미 했거나 할 것이 없었던 것도 같다
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [processed] }
        "400": { $ref: "#/components/responses/ServiceBadRequest" }
        "401": { $ref: "#/components/responses/ServiceUnauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 인증 서버가 발급한 access 토큰. 대상(aud)에 ai-trpg-billing 이 있어야 한다
    serviceSignature:
      type: apiKey
      in: header
      name: X-Service-Signature
      description: 서버끼리의 서명(t=<초>,v1=<HMAC>). 게임 서버는 GAME_SERVER_SECRET, chat 서버는 CHAT_SERVER_SECRET, 인증 서버는 AUTH_SERVER_SECRET 으로 서명한다. 서버마다 열리는 주소가 다르다
    paymentSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: 결제 대행사의 알림에 붙은 본문의 서명(PG_WEBHOOK_SECRET)

  parameters:
    OrderID:
      name: id
      in: path
      required: true
      description: 주문 번호. 모양이 틀리면 없는 주문과 같은 404 다
      schema: { type: string }

  requestBodies:
    HoldReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reference]
            properties:
              reference: { type: string }

  responses:
    StatusOK:
      description: 괜찮다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Status" }
    Received:
      description: 받았다
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [received]
            properties:
              received: { type: boolean }
    BadRequest:
      description: 요청의 값이 틀렸다. detail 이 무엇을 고칠지 말한다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 그런 것이 없다. 남의 것도 같은 답이다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 지금의 상태와 맞지 않는다(다른 내용으로 같은 열쇠를 썼다, 만료됐다 등). 같은 요청을 다시 보내도 같다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentForbidden:
      description: 결제할 수 없다. payment.verification_required(본인인증으로) 또는 payment.guardian_consent_required(보호자 동의로)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 토큰이 없거나 받아들일 수 없다. 이유는 싣지 않는다
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: 지금은 끝내지 못했다. 같은 요청을 다시 보낸다(DB 의 시간 제한, 요청의 마감, 공개키를 구할 수 없음)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: 서버 쪽의 문제다. 이유는 싣지 않는다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceBadRequest:
      description: |
        요청을 받을 수 없다. code 가 까닭이다.
        service.bad_request(본문을 읽지 못했다), hold.invalid_request, price.unknown, price.not_for_sale,
        eligibility.invalid_request, withdrawal.invalid_request. 환영 크레딧의 user_id 가 없을 때는 code 가 없다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnauthorized:
      description: 서명이 없거나 맞지 않다(service.bad_signature). 비밀과 시계를 확인한다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceConflict:
      description: hold.reference_reused, hold.already_captured, hold.already_released
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          description: 사람이 읽는 글. 바뀔 수 있다
        code:
          type: string
          description: 화면과 서버가 갈래를 나누는 오류의 이름(price.unknown 같은 것). 한번 정하면 바꾸지 않는다. 필요한 곳에만 있다

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    Amount:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: 크레딧의 양. 정확한 값을 지키려고 숫자가 아니라 글자다
      example: "80"

    Wallet:
      type: object
      additionalProperties: false
      required: [paid, free, total, next_expiry]
      properties:
        paid: { $ref: "#/components/schemas/Amount" }
        free: { $ref: "#/components/schemas/Amount" }
        total: { $ref: "#/components/schemas/Amount" }
        next_expiry:
          type: object
          nullable: true
          description: 무료 크레딧 가운데 가장 먼저 사라지는 것. 없으면 null
          additionalProperties: false
          required: [amount, expires_at]
          properties:
            amount: { $ref: "#/components/schemas/Amount" }
            expires_at: { type: string, format: date-time }

    Entries:
      type: object
      additionalProperties: false
      required: [entries, next_before]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        next_before:
          type: string
          nullable: true
          description: 다음 쪽을 읽을 때 before 에 넣는다. 더 읽을 것이 없으면 null
    Entry:
      type: object
      additionalProperties: false
      required: [id, operation_id, kind, reason, amount, order_id, hold_id, hold_status, created_at]
      properties:
        id:
          type: string
          description: 줄의 번호. 64비트 정수라 글자다
        operation_id: { type: string, format: uuid }
        kind: { type: string, enum: [paid, free] }
        reason:
          type: string
          enum: [deposit, grant, spend, expire, hold, release, regroup, refund, unrefund, forfeit]
        amount: { $ref: "#/components/schemas/Amount" }
        order_id: { type: string, format: uuid, nullable: true }
        hold_id: { type: string, format: uuid, nullable: true }
        hold_status:
          type: string
          enum: [held, captured, released]
          nullable: true
        created_at: { type: string, format: date-time }

    Product:
      type: object
      additionalProperties: false
      required: [id, name, price, credits]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer, format: int64, description: 원 }
        credits: { $ref: "#/components/schemas/Amount" }

    Order:
      type: object
      additionalProperties: false
      required:
        [id, product_id, price, credits, status, failure_code, created_at, expires_at, paid_at,
         refundable, refundable_until, refunded_at, refund_blocked]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string }
        price: { type: integer, format: int64, description: 원 }
        credits: { $ref: "#/components/schemas/Amount" }
        status:
          type: string
          enum: [pending, confirming, paid, failed, expired, refunding, refunded]
        failure_code:
          type: string
          nullable: true
          description: 결제가 거절된 까닭(결제 대행사의 코드). failed 가 아니면 null
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 이때까지 치르지 않으면 expired 가 된다
        paid_at: { type: string, format: date-time, nullable: true }
        refundable:
          type: boolean
          description: 지금 청약철회를 할 수 있는가
        refundable_until: { type: string, format: date-time, nullable: true }
        refunded_at: { type: string, format: date-time, nullable: true }
        refund_blocked:
          type: string
          enum: [window_closed, credits_used]
          nullable: true
          description: 치른 주문인데 청약철회할 수 없는 까닭. 할 수 있거나 치른 주문이 아니면 null

    AttendanceStatus:
      type: object
      additionalProperties: false
      required: [today, verified, claimed, cycle_day, cycle_length, silver, chest]
      properties:
        today: { type: string, format: date, description: 한국 날짜 }
        verified: { type: boolean, description: 본인인증을 마쳤는가. 아니면 받을 수 없다 }
        claimed: { type: boolean }
        cycle_day: { type: integer, description: 오늘 받으면 주기의 며칠째인가(1부터) }
        cycle_length: { type: integer }
        silver: { $ref: "#/components/schemas/Amount" }
        chest: { type: boolean, description: 오늘 보물 상자를 여는 날인가 }
    AttendanceClaim:
      type: object
      additionalProperties: false
      required: [day, cycle_day, silver, chest, expires_at]
      properties:
        day: { type: string, format: date }
        cycle_day: { type: integer }
        silver: { $ref: "#/components/schemas/Amount" }
        chest:
          type: object
          nullable: true
          description: 상자를 연 날이면 그 결과. 아니면 null
          additionalProperties: false
          required: [table, outcome, name, silver]
          properties:
            table: { type: string, description: 확률표의 판 }
            outcome: { type: string }
            name: { type: string }
            silver: { $ref: "#/components/schemas/Amount" }
        expires_at:
          type: string
          format: date-time
          description: 받은 실버가 사라지는 때
    Rewards:
      type: object
      additionalProperties: false
      required: [cycle, chest]
      properties:
        cycle:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, silver, chest]
            properties:
              day: { type: integer }
              silver: { $ref: "#/components/schemas/Amount" }
              chest: { type: boolean }
        chest:
          type: object
          additionalProperties: false
          required: [table, scale, outcomes, expected_silver]
          properties:
            table: { type: string }
            scale: { type: integer, description: 확률의 분모 }
            outcomes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [outcome, name, silver, chance, percent]
                properties:
                  outcome: { type: string }
                  name: { type: string }
                  silver: { $ref: "#/components/schemas/Amount" }
                  chance: { type: integer, description: scale 가운데 몇 }
                  percent: { type: string, example: "5.0" }
            expected_silver: { $ref: "#/components/schemas/Amount" }

    Hold:
      type: object
      additionalProperties: false
      required:
        [id, user_id, reference, price_code, amount, status, created_at, expires_at, settled_at, release_reason]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reference: { type: string }
        price_code: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        status: { type: string, enum: [held, captured, released] }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 이때까지 확정하거나 연장하지 않으면 결제 서버가 돌려준다
        settled_at: { type: string, format: date-time, nullable: true }
        release_reason:
          type: string
          enum: [requested, expired, withdrawn]
          nullable: true

    PriceList:
      type: object
      additionalProperties: false
      required: [prices]
      properties:
        prices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, credits, since, tier, promo, next]
            properties:
              code: { type: string, example: narration.standard }
              credits:
                allOf: [{ $ref: "#/components/schemas/Amount" }]
                nullable: true
                description: 지금의 값. 판매를 멈췄으면 null
              since: { type: string, format: date-time, nullable: true }
              tier:
                type: string
                enum: [basic, standard, premium]
                nullable: true
              promo: { type: boolean }
              next:
                type: object
                nullable: true
                description: 예약된 다음 값. 없으면 null
                additionalProperties: false
                required: [credits, tier, promo, effective_at]
                properties:
                  credits:
                    allOf: [{ $ref: "#/components/schemas/Amount" }]
                    nullable: true
                  tier:
                    type: string
                    enum: [basic, standard, premium]
                    nullable: true
                  promo: { type: boolean }
                  effective_at: { type: string, format: date-time }

    Welcome:
      type: object
      additionalProperties: false
      required: [status, granted, expires_at]
      properties:
        status: { type: string, enum: [granted, already_granted, disabled] }
        granted: { $ref: "#/components/schemas/Amount" }
        expires_at: { type: string, format: date-time, nullable: true }

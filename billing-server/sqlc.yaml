            go_type: time.Time
          - column: coupons.silver
            go_type: github.com/epqlffltm/ai-trpg/billing-server/internal/credit.Amount
          - column: coupon_redemptions.silver
            go_type: github.com/epqlffltm/ai-trpg/billing-server/internal/credit.Amount
          # 멈춘 시각. 멈추지 않았으면 nil 이다
          - column: coupons.stopped_at
            go_type:
              import: time
              type: Time
              pointer: true
            nullable: true
          # 실버의 기한(날 수)과 전체 한도. 비우면 기본값과 한도 없음이다
          - column: coupons.silver_days
            go_type:

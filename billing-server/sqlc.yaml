        omit_unused_structs: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          # 값은 credit.Amount 로 받는다. NULL(판매를 멈춤)이면 nil 이다
          - column: price_versions.amount
            go_type:
              import: github.com/epqlffltm/ai-trpg/billing-server/internal/credit

# ruff.toml
# 파이썬 서버들(auth-server, trpg-server, notification-server)이 함께 쓰는 ruff 규칙이다.
#
# 서버마다 pyproject.toml 의 [tool.ruff] 에서 이 파일을 이어받는다(extend). 규칙을 바꿀 때는 여기 한 곳만 고친다.
# 서버마다 다른 것(자기 패키지의 이름, 빼는 폴더)만 서버의 설정에 적는다.
# 저장소 루트에서 돌려도 이 규칙을 따른다. 서버 폴더 안의 파일은 그 서버의 설정이 이 파일을 이어받는다.

line-length = 120
target-version = "py313"

[lint]
# E, W: 모양 / F: 쓰지 않는 이름, 정의되지 않은 이름 / I: import 순서
# B: 흔한 실수 / UP: 옛 문법 / SIM: 더 단순하게 쓸 수 있는 코드
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[format]
quote-style = "single"

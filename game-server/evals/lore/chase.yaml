# game-server/evals/lore/chase.yaml
#
# 로어북 검색의 평가 데이터. 시나리오 하나(열일곱 행성 추격전)의 로어북 항목과, 정답을 붙인 질의들이다.
# 공개 저장소에 올라가는 개그 설정이다.
#
# entries: 로어북 항목. 실제 항목과 같은 제한을 지킨다(이름 100자, 키워드 5개·각 30자, 내용 500자).
# queries: 라운드 하나의 장면과 선언, 그리고 이 장면에서 AI 에게 주고 싶은 항목의 이름(expected).
#   set:  언제 더한 질의인가. 처음 40개는 v1 이다. 질의를 늘리면 새 이름(v2 …)을 붙인다.
#         예전 결과와 견줄 때는 같은 set 만 골라 돌린다(--set v1).
#   kind: name(이름이나 키워드가 나온다), meaning(이름 없이 뜻으로만), distractor(낱말은 같지만 뜻이 다르다),
#         none(관련된 항목이 없다). distractor 와 none 은 expected 가 비어 있다.
#   moves: 선언한 캐릭터와 글. 플레이어 캐릭터(카이, 모모)는 로어북에 없다.
#
# 정답은 "이 장면이면 나는 이 항목을 AI 에게 주고 싶다"이다. 검색이 어떻게 도는지가 아니라 GM 의 감각으로 붙인다.

title: 열일곱 행성 추격전

entries:
  - name: 리엔
    keywords: [엘프, 폭주족, 우두머리]
    content: 엘프 폭주족의 우두머리. 은빛 머리를 휘날리며 바이크 은빛 유성호를 몬다. 속도 위반 딱지가 삼백 장이 넘는다. 겁이 없지만 고양이만은 무서워한다.
  - name: 토르빈
    keywords: [드워프, 망치, 정비공]
    content: 드워프 정비공. 키는 작지만 바이크 엔진을 맨손으로 고친다. 무엇이든 망치로 두드려 해결하려 한다. 톨게이트 차단기를 벌써 일곱 번 부쉈다.
  - name: 비올레타
    keywords: [악역영애, 영애, 부채]
    content: 금빛 리무진을 타고 다니는 귀족 영애. 부채를 접으며 웃는 것이 버릇이다. 사실은 은하 경찰의 정보원이지만 아무도 모른다.
  - name: 은빛 유성호
    keywords: [바이크, 유성호]
    content: 리엔의 개조 바이크. 행성 사이를 하루 만에 달린다. 연료 대신 별빛을 먹는다는 소문이 있다. 계기판에 고양이 스티커가 붙어 있다.
  - name: 금빛 리무진
    keywords: [리무진]
    content: 비올레타의 차. 차체가 순금으로 덮여 있어 매우 무겁다. 느리지만 어떤 충돌에도 흠집이 나지 않는다. 뒷좌석에 홍차 세트가 있다.
  - name: 은하 경찰
    keywords: [경찰, 사이렌]
    content: 열일곱 행성의 고속도로를 지키는 경찰. 사이렌 소리가 너무 커서 오는 것을 모두가 미리 안다. 폭주족 단속 실적은 늘 꼴찌다.
  - name: 그레고르 경감
    keywords: [경감, 그레고르]
    content: 은하 경찰의 지휘관. 콧수염을 매만지며 작전을 짠다. 리엔을 잡는 것이 평생의 꿈이지만 바이크 멀미가 있다.
  - name: 우주 고속도로
    keywords: [고속도로, 차선]
    content: 열일곱 행성을 잇는 투명한 도로. 차선이 별자리 모양으로 그려져 있다. 밤에는 도로 전체가 은은하게 빛난다.
  - name: 세 번째 행성의 톨게이트
    keywords: [톨게이트, 차단기, 통행료]
    content: 고속도로에서 가장 붐비는 요금소. 통행료는 노래 한 소절로도 낼 수 있다. 차단기는 드워프 때문에 늘 새것이다.
  - name: 열일곱째 행성
    keywords: [얼음 행성, 열일곱째]
    content: 고속도로의 끝에 있는 얼음 행성. 땅이 미끄러워 바이크가 제자리에서 돈다. 전설의 결승선이 이곳에 있다.
  - name: 별빛 주유소
    keywords: [주유소, 휴게소]
    content: 다섯 번째 행성의 휴게소. 연료와 함께 따뜻한 수프를 판다. 주인이 은퇴한 폭주족이라 경찰에게는 길을 알려 주지 않는다.
  - name: 마르타
    keywords: [수프 아줌마]
    content: 별빛 주유소의 주인. 젊은 시절 엘프 폭주족의 첫 우두머리였다. 주걱을 휘두르면 경찰도 물러선다.
  - name: 드워프 정비조합
    keywords: [정비조합, 조합]
    content: 토르빈이 속한 드워프들의 모임. 고친 바이크마다 망치 모양 도장을 찍는다. 조합원은 수리비로 맥주만 받는다.
  - name: 홍차
    keywords: [찻잔]
    content: 비올레타가 늘 마시는 차. 차가 식으면 기분이 나빠져 리무진의 속도를 높이라고 명령한다.
  - name: 사이렌 대소동
    keywords: [대소동]
    content: 작년에 경찰 사이렌 백 개가 한꺼번에 고장 나 고속도로가 멈춘 사건. 그 뒤로 사이렌 소리만 들려도 사람들이 길을 비킨다.
  - name: 별자리 지도
    keywords: [지도, 별자리]
    content: 고속도로의 지름길이 그려진 지도. 리엔이 가슴 주머니에 넣고 다닌다. 비올레타가 몰래 노리고 있다.
  - name: 결승선
    keywords: [결승선, 우승]
    content: 열일곱째 행성 꼭대기에 있는 결승선. 먼저 지나간 사람은 소원 하나를 빌 수 있다는 전설이 있다.
  - name: 미르
    keywords: [고양이]
    content: 별빛 주유소에 사는 검은 고양이. 리엔이 유일하게 두려워하는 존재다. 바이크 좌석에서 낮잠 자는 것을 좋아한다.
  - name: 블랙홀 터널
    keywords: [블랙홀, 터널]
    content: 아홉 번째 행성 근처의 지름길. 들어가면 시간이 거꾸로 흘러 출발하기 전으로 돌아올 수 있다. 경찰이 이 길을 막아 두었다.
  - name: 운석 지대
    keywords: [운석]
    content: 열한 번째 행성 앞의 위험한 구간. 하늘에서 작은 돌이 비처럼 떨어진다. 금빛 리무진만 이곳을 무사히 지날 수 있다.
  - name: 우주 해적 선장
    keywords: [해적, 선장]
    content: 고속도로 옆 소행성에 사는 해적. 통행료를 두 번 받으려 한다. 노래를 잘 부르는 사람에게는 약하다.
  - name: 폭주족의 맹세
    keywords: [맹세]
    content: 엘프 폭주족의 세 가지 규칙. 동료를 두고 가지 않는다. 신호등은 무시해도 횡단보도는 지킨다. 고양이에게는 길을 양보한다.
  - name: 경찰 순찰선
    keywords: [순찰선]
    content: 은하 경찰의 원반 모양 비행선. 빠르지만 방향을 바꾸는 것이 느려서 굽은 길에서 늘 놓친다.
  - name: 은하 고속도로법
    keywords: [법, 속도 제한]
    content: 고속도로의 법. 속도 제한은 빛의 속도의 절반이다. 어기면 벌금 대신 노래를 불러야 한다.
  - name: 세바스찬
    keywords: [집사]
    content: 금빛 리무진의 운전사이자 비올레타의 집사. 말이 없고 늘 흰 장갑을 낀다. 홍차가 식지 않게 하는 것이 그의 유일한 임무다.
  - name: 두 번째 행성 시장
    keywords: [시장]
    content: 온갖 부품을 파는 행성의 장터. 드워프들이 엔진을 사고 해적들이 훔친 물건을 판다. 흥정은 노래 대결로 한다.
  - name: 쿵쾅이
    keywords: [엔진]
    content: 토르빈이 직접 만든 엔진. 소리가 너무 커서 이름이 쿵쾅이다. 망치로 세 번 두드려야 시동이 걸린다.
  - name: 별빛 연료
    keywords: [연료]
    content: 바이크를 달리게 하는 반짝이는 연료. 밤에만 모을 수 있다. 주유소에서 비싸게 팔린다.
  - name: 경적의 가락
    keywords: [경적]
    content: 엘프 폭주족이 동료를 부를 때 울리는 경적의 가락. 짧게 세 번, 길게 한 번. 경찰도 이 가락을 외우려고 애쓴다.
  - name: 얼음 결정
    keywords: [결정]
    content: 열일곱째 행성에서만 나는 얼음 조각. 손에 쥐면 앞날의 장면이 잠깐 보인다고 한다.

queries:
  # --- 이름이나 키워드가 나온다 ---
  - id: q01
    set: v1
    kind: name
    scene: 세 번째 행성의 톨게이트 앞에 차들이 길게 줄을 섰다.
    moves:
      - {character: 카이, content: 통행료 대신 노래를 부르겠다고 한다.}
    expected: [세 번째 행성의 톨게이트]
  - id: q02
    set: v1
    kind: name
    scene: 토르빈이 연장을 들고 다가온다.
    moves:
      - {character: 모모, content: 토르빈에게 바이크 수리를 부탁한다.}
    expected: [토르빈]
  - id: q03
    set: v1
    kind: name
    scene: 사이렌이 울리고 순찰선이 하늘에 나타났다.
    moves:
      - {character: 카이, content: 골목으로 숨는다.}
    expected: [은하 경찰, 경찰 순찰선]
  - id: q04
    set: v1
    kind: name
    scene: 그레고르 경감이 콧수염을 매만진다.
    moves:
      - {character: 모모, content: 경감에게 지름길을 묻는다.}
    expected: [그레고르 경감]
  - id: q05
    set: v1
    kind: name
    scene: 비올레타가 웃으며 손짓한다.
    moves:
      - {character: 카이, content: 비올레타의 리무진에 올라탄다.}
    expected: [비올레타, 금빛 리무진]
  - id: q06
    set: v1
    kind: name
    scene: 별빛 주유소에 도착했다.
    moves:
      - {character: 모모, content: 연료를 가득 채운다.}
    expected: [별빛 주유소, 별빛 연료]
  - id: q07
    set: v1
    kind: name
    scene: 마르타가 주걱을 들고 가게 앞에 선다.
    moves:
      - {character: 카이, content: 수프를 한 그릇 주문한다.}
    expected: [마르타]
  - id: q08
    set: v1
    kind: name
    scene: 블랙홀 터널의 입구가 보인다.
    moves:
      - {character: 모모, content: 망설이지 않고 안으로 뛰어든다.}
    expected: [블랙홀 터널]
  - id: q09
    set: v1
    kind: name
    scene: 우주 해적 선장이 길을 막아선다.
    moves:
      - {character: 카이, content: 선장에게 노래 대결을 신청한다.}
    expected: [우주 해적 선장]
  - id: q10
    set: v1
    kind: name
    scene: 세바스찬이 흰 장갑을 고쳐 낀다.
    moves:
      - {character: 모모, content: 따뜻한 홍차를 한 잔 달라고 한다.}
    expected: [세바스찬, 홍차]
  - id: q11
    set: v1
    kind: name
    scene: 쿵쾅이가 털털거리다 멈춰 버렸다.
    moves:
      - {character: 카이, content: 옆구리를 세 번 두드려 본다.}
    expected: [쿵쾅이]
  - id: q12
    set: v1
    kind: name
    scene: 미르가 바이크 좌석에서 낮잠을 자고 있다.
    moves:
      - {character: 모모, content: 깨우지 않으려고 살금살금 지나간다.}
    expected: [미르]

  # --- 이름 없이 뜻으로만 ---
  - id: q13
    set: v1
    kind: meaning
    scene: 수염 난 작은 기술자가 부서진 차를 두드려 고치고 있다.
    moves:
      - {character: 카이, content: 고쳐 주면 얼마냐고 묻는다.}
    expected: [토르빈]
  - id: q14
    set: v1
    kind: meaning
    scene: 은빛 머리의 라이더가 딱지 뭉치를 찢어 버린다.
    moves:
      - {character: 모모, content: 저 사람이 누구냐고 수군거린다.}
    expected: [리엔]
  - id: q15
    set: v1
    kind: meaning
    scene: 순금으로 덮인 무거운 차가 느릿느릿 지나간다.
    moves:
      - {character: 카이, content: 차 옆으로 따라붙는다.}
    expected: [금빛 리무진]
  - id: q16
    set: v1
    kind: meaning
    scene: 하늘에서 작은 돌들이 비처럼 쏟아진다.
    moves:
      - {character: 모모, content: 머리를 감싸고 달린다.}
    expected: [운석 지대]
  - id: q17
    set: v1
    kind: meaning
    scene: 사방이 하얗게 얼어붙은 땅이다. 바퀴가 미끄러져 제자리에서 돈다.
    moves:
      - {character: 카이, content: 발로 땅을 짚어 균형을 잡는다.}
    expected: [열일곱째 행성]
  - id: q18
    set: v1
    kind: meaning
    scene: 출발하기 전으로 되돌아갈 수 있는 길이 있다는 소문을 들었다.
    moves:
      - {character: 모모, content: 그 길이 어디 있는지 수소문한다.}
    expected: [블랙홀 터널]
  - id: q19
    set: v1
    kind: meaning
    scene: 따뜻한 국물 냄새가 나는 쉼터가 길가에 보인다.
    moves:
      - {character: 카이, content: 잠깐 쉬어 가자고 한다.}
    expected: [별빛 주유소]
  - id: q20
    set: v1
    kind: meaning
    scene: 빛의 절반보다 빠르게 달리고 있다.
    moves:
      - {character: 모모, content: 이렇게 달려도 괜찮은지 걱정한다.}
    expected: [은하 고속도로법]
  - id: q21
    set: v1
    kind: meaning
    scene: 귀족 아가씨가 찻물이 식었다며 운전사를 다그친다.
    moves:
      - {character: 카이, content: 창밖에서 그 모습을 지켜본다.}
    expected: [비올레타, 홍차, 세바스찬]
  - id: q22
    set: v1
    kind: meaning
    scene: 멀리서 짧게 세 번, 길게 한 번 울리는 소리가 들린다.
    moves:
      - {character: 모모, content: 같은 가락으로 대답한다.}
    expected: [경적의 가락]
  - id: q23
    set: v1
    kind: meaning
    scene: 지름길이 그려진 낡은 종이가 바닥에 떨어져 있다.
    moves:
      - {character: 카이, content: 종이를 주워 펼쳐 본다.}
    expected: [별자리 지도]
  - id: q24
    set: v1
    kind: meaning
    scene: 부품 값을 노래 대결로 깎는 장터에 내렸다.
    moves:
      - {character: 모모, content: 목을 풀며 흥정을 준비한다.}
    expected: [두 번째 행성 시장]
  - id: q25
    set: v1
    kind: meaning
    scene: 먼저 지나가면 소원을 빌 수 있다는 곳이 눈앞에 보인다.
    moves:
      - {character: 카이, content: 마지막 힘을 짜내 달린다.}
    expected: [결승선]
  - id: q26
    set: v1
    kind: meaning
    scene: 쥐면 앞날이 잠깐 보인다는 차가운 조각을 주웠다.
    moves:

# game-server/evals/memory/chase_log.yaml
#
# 지난 일(앞 라운드의 기억) 검색의 평가 데이터. 열일곱 행성 추격전을 20 라운드 동안 플레이한 가짜 기록과,
# 정답을 붙인 질의들이다. 공개 저장소에 올라가는 개그 설정이다.
#
# people: 로어북의 인물 항목(이름과 키워드). 장면에 나온 인물을 찾는 데만 쓴다. 플레이어 캐릭터(카이, 모모)는 없다.
# rounds: 라운드마다 장면(그 라운드를 여는 GM 의 서술)과 플레이어들이 한 말. 1 라운드의 장면은 도입부다.
#   라운드 N 의 기억 = N 에 한 말 + N+1 의 장면(서버와 같다, app/memory/texts.py).
# queries: 서술하는 라운드(round)의 장면과 선언, 그리고 이 장면에서 AI 에게 주고 싶은 기억(expected, 라운드 번호).
#   정답은 그 라운드의 지난 기록(round-3 ~ round-1 라운드)보다 앞의 기억이어야 한다. 아니면 읽을 때 잡는다.
#   kind: name(인물이 나온다), meaning(인물 없이 뜻으로만), distractor(인물의 키워드가 나오지만 그 인물이 아니다),
#         none(관련된 기억이 없다). distractor 와 none 은 expected 가 비어 있다.
#
# 정답은 "이 장면이면 나는 이 지난 일을 AI 에게 알려 주고 싶다"이다. 검색이 어떻게 도는지가 아니라 GM 의 감각으로 붙인다.

title: 열일곱 행성 추격전 20 라운드

people:
  - name: 비올레타
    keywords: [악역영애, 부채]
  - name: 그레고르 경감
    keywords: [경감, 그레고르]
  - name: 마르타
    keywords: [수프 아줌마]
  - name: 리엔
    keywords: [엘프 우두머리]
  - name: 토르빈
    keywords: [드워프 정비공]

rounds:
  - number: 1
    scene: 열일곱 행성 추격전이 시작된다. 우주 고속도로의 출발선에 엘프 폭주족의 바이크들과 금빛 리무진 한 대가 나란히 섰다.
    lines:
      - '카이: 출발 신호와 함께 액셀을 끝까지 당긴다.'
      - '모모: 옆에 선 리무진의 창문을 두드린다.'
  - number: 2
    scene: 은빛 바이크들이 튀어 나갔다. 리무진의 창문이 내려가고 악역영애가 부채 너머로 모모를 내려다보았다.
    lines:
      - '카이: 리엔 옆에 붙어 달린다.'
      - '모모: 악역영애에게 같이 가자고 웃는다.'
  - number: 3
    scene: 리엔이 고개를 끄덕이며 길을 열어 주었다. 악역영애는 부채를 접으며 홍차 한 잔을 창밖으로 건넸다. 둘은 동맹이 되었다.
    lines:
      - '카이: 세 번째 행성의 톨게이트로 향한다.'
      - '모모: 홍차를 받아 마신다.'
  - number: 4
    scene: 톨게이트의 차단기가 내려와 있었다. 통행료는 노래 한 소절이라고 적혀 있었다.
    lines:
      - '카이: 토르빈에게 차단기를 부숴 달라고 한다.'
      - '모모: 노래를 부른다.'
  - number: 5
    scene: 토르빈의 망치가 차단기를 박살 냈다. 모모의 노래는 음이 하나도 맞지 않았다. 요금소 직원이 귀를 막았다.
    lines:
      - '카이: 부서진 차단기 사이로 빠져나간다.'
      - '모모: 직원에게 사과한다.'
  - number: 6
    scene: 뒤에서 사이렌이 울렸다. 그레고르 경감이 콧수염을 매만지며 확성기를 들었다.
    lines:
      - '카이: 경찰을 따돌리려 운석 지대로 꺾는다.'
      - '모모: 경감에게 손을 흔든다.'
  - number: 7
    scene: 운석이 비처럼 쏟아졌다. 경감의 순찰선이 운석에 긁혀 연기를 뿜었다.
    lines:
      - '카이: 운석 사이를 지그재그로 빠져나간다.'
      - '모모: 연료계를 본다.'
  - number: 8
    scene: 연료가 바닥을 보였다. 멀리 별빛 주유소의 간판이 깜빡였다.
    lines:
      - '카이: 주유소에 들른다.'
      - '모모: 수프를 주문한다.'
  - number: 9
    scene: 수프 아줌마 마르타가 주걱을 들고 나왔다. 경찰이 오자 주걱을 휘둘러 순찰선을 쫓아냈다. 마르타는 낡은 지도를 내밀었다.
    lines:
      - '카이: 지도를 받는다.'
      - '모모: 수프를 한 그릇 더 달라고 한다.'
  - number: 10
    scene: 지도에는 블랙홀 터널로 가는 지름길이 그려져 있었다. 두 번째 그릇의 수프는 더 따뜻했다.
    lines:
      - '카이: 블랙홀 터널로 방향을 튼다.'
      - '모모: 악역영애에게 지름길을 알려 준다.'
  - number: 11
    scene: 악역영애가 부채를 접으며 고맙다고 웃었다. 그런데 리무진 안에서 경찰 무전기의 불빛이 몰래 깜빡였다.
    lines:
      - '카이: 리무진을 의심하며 거리를 둔다.'
      - '모모: 못 본 척한다.'
  - number: 12
    scene: 터널 입구에서 그레고르 경감의 순찰선들이 길을 막고 있었다. 악역영애가 경감에게 지름길을 알려 준 것이었다. 동맹은 깨졌다.
    lines:
      - '카이: 순찰선 사이를 뚫고 나간다.'
      - '모모: 악역영애에게 왜 배신했냐고 소리친다.'
  - number: 13
    scene: 바이크가 순찰선 사이를 빠져나갔다. 악역영애는 대답 없이 부채로 얼굴을 가렸다.
    lines:
      - '카이: 터널 안으로 들어간다.'
      - '모모: 뒤를 돌아보지 않는다.'
  - number: 14
    scene: 블랙홀 터널 안에서는 시간이 거꾸로 흘렀다. 카이의 수염이 잠깐 자랐다가 사라졌다.
    lines:
      - '카이: 출구의 빛을 향해 달린다.'
      - '모모: 손목시계를 확인한다.'
  - number: 15
    scene: 터널을 나오자 두 번째 행성의 시장이 펼쳐졌다. 상인들이 별빛 연료를 팔고 있었다.
    lines:
      - '카이: 연료를 산다.'
      - '모모: 값을 깎는다.'
  - number: 16
    scene: 모모가 연료 값을 반으로 깎았다. 상인이 울상을 지었다. 시장 구석에서 토르빈이 엔진을 고치고 있었다.
    lines:
      - '카이: 토르빈에게 엔진 점검을 부탁한다.'
      - '모모: 토르빈에게 맥주를 사 준다.'
  - number: 17
    scene: 토르빈이 맥주를 받고 엔진을 망치로 세 번 두드렸다. 꺼져 가던 엔진이 다시 살아났다.
    lines:
      - '카이: 열일곱째 행성으로 출발한다.'
      - '모모: 지도를 편다.'
  - number: 18
    scene: 얼음 행성이 보였다. 땅이 미끄러워 바이크가 제자리에서 빙글빙글 돌았다.
    lines:
      - '카이: 속도를 줄인다.'
      - '모모: 얼음 위를 걸어 본다.'
  - number: 19
    scene: 모모가 미끄러져 엉덩방아를 찧었다. 멀리 결승선이 빛났다. 그 옆에 금빛 리무진이 서 있었다.
    lines:
      - '카이: 결승선으로 달린다.'
      - '모모: 리무진을 노려본다.'
  - number: 20
    scene: 결승선 앞에서 리무진의 문이 천천히 열렸다.
    lines:
      - '카이: 바이크에서 내린다.'
      - '모모: 리무진 앞을 막아선다.'

queries:
  # 인물이 나온다. 같은 인물의 일이 여럿이면 지금의 태도를 정한 일(배신)이 필요하다
  - id: n1
    kind: name
    round: 21
    scene: 리무진에서 악역영애가 내려 부채를 펼친다.
    moves:
      - {character: 모모, content: 악역영애에게 다가간다.}
    expected: [11]
  - id: n2
    kind: name
    round: 21
    scene: 주유소 간판 아래에서 수프 아줌마가 손을 흔든다.
    expected: [8]
  - id: n3
    kind: name
    round: 21
    scene: 그레고르 경감이 확성기로 멈추라고 외친다.
    expected: [11, 6]
  - id: n4
    kind: name
    round: 20
    scene: 토르빈이 다시 망치를 든다.
    moves:
      - {character: 카이, content: 토르빈에게 손을 흔든다.}
    expected: [16, 4]
  - id: n5
    kind: name
    round: 9
    scene: 악역영애가 홍차를 한 잔 더 권한다.
    expected: [2]
  - id: n6
    kind: name
    round: 14
    scene: 그레고르 경감의 순찰선이 다시 따라붙는다.
    expected: [6]
  - id: n7
    kind: name
    round: 21
    scene: 리엔이 출발선에서처럼 고개를 끄덕인다.
    expected: [2]

  # 인물 없이 뜻으로만
  - id: m1
    kind: meaning
    round: 21
    scene: 부서진 차단기 조각이 아직도 우주를 떠다닌다.
    expected: [4]
  - id: m2
    kind: meaning
    round: 21
    scene: 시간이 거꾸로 흐르는 느낌이 다시 든다.
    expected: [13]
  - id: m3
    kind: meaning
    round: 21
    scene: 카이가 연료를 넣으며 값을 깎던 일을 떠올린다.
    expected: [15]
  - id: m4
    kind: meaning
    round: 20
    scene: 운석 하나가 순찰선 옆을 스친다.
    expected: [6]
  - id: m5
    kind: meaning
    round: 21
    scene: 모모가 노래를 흥얼거리자 모두가 귀를 막는다.
    expected: [4]
  - id: m6
    kind: meaning
    round: 18
    scene: 따뜻한 수프 생각이 난다.
    expected: [9, 8]

  # 인물의 키워드가 나오지만 그 인물이 아니다
  - id: d1
    kind: distractor
    round: 21
    scene: 모모가 종이를 접어 만든 부채로 땀을 식힌다.
    expected: []
  - id: d2
    kind: distractor
    round: 21
    scene: 카이가 경감 계급장을 단 장난감 인형을 줍는다.
    expected: []

  # 관련된 지난 일이 없다
  - id: x1
    kind: none
    round: 21
    scene: 결승선 너머로 처음 보는 행성이 떠오른다.
    expected: []
  - id: x2
    kind: none
    round: 21
    scene: 카이가 크게 하품을 한다.
    expected: []
  - id: x3
    kind: none
    round: 12
    scene: 엔진에서 이상한 소리가 난다.
    expected: []

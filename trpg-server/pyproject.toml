[project]
name = "trpg-server"
version = "0.1.0"
description = "Game service for an AI-driven TRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-core",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "catalog-core",
    "conversation-core",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "server-core[redis]",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

# 공용 코드. 저장소 안의 경로에서 받는다(docs/architecture/shared-code.md 의 "정한 것").
#   ai-core     : AI 를 부르는 것(provider, 창구, 스트리밍, 원가, 재시도 예산, 임베더)
#   server-core : FastAPI 서버들의 공통부(토큰 검증, 관측, 서명, 뒤에서 도는 일의 틀, #589)
#   catalog-core: chat, story, trpg 가 함께 쓰는 모델 목록의 표(쿼리, 찾기, 원본 파일 들여오기)
#   conversation-core: chat, story 와 함께 쓰는 기록 파일 쓰기(conversation_core.transcripts). 표준 라이브러리만 쓴다
# 고친 것이 바로 보이게 editable 로 깐다. 이미지에는 설치된 모양으로 담는다(Dockerfile 의 uv sync --no-editable).
# CI 는 이 줄을 읽어 공용 코드가 바뀐 PR 에서 이 서버를 검사한다(.github/scripts/changed-servers.sh)
[tool.uv.sources]
ai-core = { path = "../shared/ai-core", editable = true }
server-core = { path = "../shared/server-core", editable = true }
catalog-core = { path = "../shared/catalog-core", editable = true }
conversation-core = { path = "../shared/conversation-core", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyright[nodejs]==1.1.408",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
# 테스트 전체가 이벤트 루프 하나에서 돈다. DB 연결은 만든 루프에 묶이므로, 연결 풀(엔진)을 테스트끼리 함께 쓰려면
# 루프도 하나여야 한다(tests/conftest.py 의 engine). 테스트마다 새 연결을 맺지 않는다(#223)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 실패한 테스트의 기록을 짧게 찍는다. 기본(long)은 실패한 함수가 받은 인자의 값까지 찍는다.
# DB 에 연결하다 실패하면 그 인자가 비밀번호가 든 접속 주소다
addopts = "--tb=short"
# 맞서는 굴림(#254)을 템플릿 그대로의 룰북으로 보는 테스트. 나머지는 고정 난이도의 룰북을 쓴다(tests/conftest.py)
markers = ["opposed: 막는 규칙을 빼지 않은 룰북을 쓴다"]

[tool.coverage.run]
# 서버의 코드만 잰다. 테스트, 평가 도구(evals), 손으로 돌리는 스크립트는 뺀다
source = ["app"]

[tool.coverage.report]
# 한 줄도 없는 파일(__init__.py)은 표에서 뺀다
skip_empty = true

[tool.pyright]
# 서버의 코드와 테스트를 본다. 테스트는 결과가 있다고 단언한 뒤 읽는 일이 많아 None 의 검사 셋만 끈다.
# tests/legacy_migrations 는 지운 옛 마이그레이션을 그대로 둔 사본이라 보지 않는다(고치지 않는다)
include = ["app", "tests"]
exclude = ["tests/legacy_migrations"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportOptionalMemberAccess = false, reportOptionalSubscript = false, reportOptionalOperand = false },
]

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 인증 서버와 같다
extend = "../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["app"]

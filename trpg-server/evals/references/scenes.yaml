# trpg-server/evals/references/scenes.yaml
#
# 참고 자료 검색(#482, #1338)의 평가 데이터. 한국어 장면과, 그 장면이면 서술자에게 주고 싶은 자료의 줄(key)이다.
# 자료는 공용 패키지에 실린 데이터 파일들이다(reference_core/data/srd51.json, wikipedia.json). DB 에 넣는 것과 같다.
#
# scenes: 라운드 하나의 장면과 선언, 그리고 정답(expected).
#   set:  언제 더한 장면인가. v1 은 SRD 만 있을 때 만든 것, v2 는 위키백과(사물, 건축, 탈것, 생물, 지형)를 넣으며 더한 것이다.
#         장면을 늘리면 새 이름(v3 …)을 붙인다. 한 번 붙인 정답은 고치지 않는다(전과 견줄 수 있게).
#   kind: named(그것을 한국어로 부른다), meaning(이름 없이 생김새나 쓰임으로만), none(자료에 맞는 것이 없다).
#         none 은 expected 가 비어 있다.
#   expected: 맞다고 보는 줄의 key 들. 그중 하나라도 고르면 맞힌 것이다(드래곤처럼 비슷한 줄이 여럿이다).
#             SRD 는 "monsters/…", "equipment/…", 위키백과는 "ko/<문서 제목>", "en/<문서 제목>" 이다.
#   moves: 선언한 캐릭터와 글.
#
# 정답은 "이 장면이면 나는 이 줄을 AI 에게 주고 싶다"이다. 검색이 어떻게 도는지가 아니라 GM 의 감각으로 붙인다.
# 읽을 때 key 가 자료에 있는지 본다. 테스트가 늘 이 파일을 읽어 보므로 실수는 CI 에서 걸린다.

story: 어두운 숲과 폐허를 떠도는 모험가들의 이야기. 마법은 드물고 괴물은 흔하다.

scenes:
  - name: torch-cave
    set: v1
    kind: named
    scene: 동굴 입구는 칠흑같이 어둡다. 안쪽에서 물 떨어지는 소리가 울린다.
    moves:
      - [엘프, 횃불에 불을 붙여 높이 들고 동굴 안으로 들어간다.]
    expected: [equipment/torch]
  - name: goblin-ambush
    set: v1
    kind: named
    scene: 덤불 사이로 작고 초록빛 얼굴들이 번뜩인다. 녹슨 언월도가 햇빛을 받는다.
    moves:
      - [드워프, 고블린 무리를 향해 도끼를 휘두른다.]
    expected: [monsters/goblin, monsters/hobgoblin]
  - name: lich-phylactery
    set: v1
    kind: named
    scene: 해골 같은 마법사가 무너진 왕좌에 앉아 있다. 눈구멍에 푸른 불꽃이 탄다.
    moves:
      - [엘프, 리치가 영혼을 숨겨 둔 그릇을 찾아 방을 뒤진다.]
    expected: [monsters/lich]
  - name: bag-of-holding
    set: v1
    kind: meaning
    scene: 상인이 낡은 가죽 주머니를 내민다. 손바닥만 한데 안이 끝없이 깊어 보인다.
    moves:
      - [드워프, 주머니에 망치와 방패와 침낭을 차례로 밀어 넣어 본다.]
    expected: [magic-items/bag-of-holding]
  - name: sailing-ship
    set: v1
    kind: named
    scene: 항구에는 돛대 셋을 단 범선이 닻을 올리고 있다. 선원들이 밧줄을 당긴다.
    moves:
      - [엘프, 범선에 올라 선장에게 뱃삯을 건넨다.]
    expected: [equipment/sailing-ship, equipment/galley, equipment/longship]
  - name: wolf-howl
    set: v1
    kind: named
    scene: 달 아래 숲에서 늑대 울음이 이어진다. 회색 그림자가 나무 사이를 오간다.
    moves:
      - [드워프, 모닥불을 키우고 늑대 떼를 향해 불붙은 나뭇가지를 흔든다.]
    expected: [monsters/wolf, monsters/dire-wolf]
  - name: climbing-rope
    set: v1
    kind: named
    scene: 절벽은 까마득하다. 위쪽 바위틈에 튼튼해 보이는 나무뿌리가 걸려 있다.
    moves:
      - [엘프, 밧줄 끝에 갈고리를 묶어 바위틈으로 던진다.]
    expected: [equipment/rope-hempen-50-feet, equipment/rope-silk-50-feet, equipment/grappling-hook]
  - name: red-dragon
    set: v1
    kind: named
    scene: 산이 흔들리고 붉은 비늘의 용이 날개를 펼친다. 동굴 안에 금화가 산처럼 쌓여 있다.
    moves:
      - [드워프, 방패를 들어 붉은 용의 불길을 막으려 한다.]
    expected: [monsters/adult-red-dragon, monsters/ancient-red-dragon, monsters/young-red-dragon, monsters/red-dragon-wyrmling]
  - name: skeletons-rise
    set: v1
    kind: named
    scene: 무덤의 흙이 갈라지고 뼈만 남은 병사들이 녹슨 창을 들고 일어선다.
    moves:
      - [엘프, 해골 병사의 다리를 노려 활을 쏜다.]
    expected: [monsters/skeleton]
  - name: mimic-chest
    set: v1
    kind: meaning
    scene: 방 한가운데 보물 상자가 놓여 있다. 가까이 가자 뚜껑의 나뭇결이 숨을 쉬듯 움직인다.
    moves:
      - [드워프, 상자 뚜껑을 열려고 손을 뻗는다.]
    expected: [monsters/mimic]
  - name: gelatinous-cube
    set: v1
    kind: meaning
    scene: 복도 끝에서 투명한 젤리 덩어리가 천천히 밀려온다. 그 안에 해골과 동전이 떠 있다.
    moves:
      - [엘프, 뒤로 물러서며 덩어리 속에 떠 있는 열쇠를 노려본다.]
    expected: [monsters/gelatinous-cube]
  - name: healing-potion
    set: v1
    kind: named
    scene: 싸움이 끝나고 드워프가 피를 흘리며 주저앉는다.
    moves:
      - [엘프, 붉은 치유 물약의 마개를 따서 드워프의 입에 흘려 넣는다.]
    expected: [magic-items/potion-of-healing]
  - name: invisibility-ring
    set: v1
    kind: meaning
    scene: 경비병 둘이 성문을 지킨다. 엘프의 손가락에 낀 반지가 차갑게 빛난다.
    moves:
      - [엘프, 반지를 돌려 몸을 보이지 않게 하고 경비병 사이를 지나간다.]
    expected: [magic-items/ring-of-invisibility]
  - name: owlbear
    set: v1
    kind: meaning
    scene: 부엉이의 머리에 곰의 몸을 한 짐승이 덤불을 헤치고 나온다. 날카로운 울음이 숲을 찢는다.
    moves:
      - [드워프, 짐승의 앞발을 피하며 옆으로 구른다.]
    expected: [monsters/owlbear]
  - name: medusa-gaze
    set: v1
    kind: meaning
    scene: 정원에는 겁에 질린 표정의 석상들이 서 있다. 머리카락 대신 뱀이 꿈틀대는 여인이 그 사이를 걷는다.
    moves:
      - [엘프, 눈을 감고 방패에 비친 모습으로만 여인을 살핀다.]
    expected: [monsters/medusa]
  - name: rats-swarm
    set: v1
    kind: named
    scene: 하수도 바닥이 꿈틀댄다. 수백 마리의 쥐가 한 덩어리가 되어 몰려온다.
    moves:
      - [드워프, 횃불을 휘둘러 쥐 떼를 쫓는다.]
    expected: [monsters/swarm-of-rats, monsters/rat, equipment/torch]
  - name: market-haggle
    set: v1
    kind: none
    scene: 시장에는 사과와 생선 냄새가 뒤섞여 있다. 상인이 큰 소리로 값을 부른다.
    moves:
      - [엘프, 사과 한 바구니의 값을 깎아 달라고 웃으며 흥정한다.]
    expected: []
  - name: letter-tears
    set: v1
    kind: none
    scene: 여관 방의 촛불 아래 오래된 편지가 펼쳐져 있다.
    moves:
      - [드워프, 고향의 어머니가 보낸 편지를 읽다가 조용히 눈물을 훔친다.]
    expected: []
  - name: council-vote
    set: v1
    kind: none
    scene: 마을 회관에 촌장과 원로들이 모였다. 다리를 새로 놓을지 표결을 앞두고 있다.
    moves:
      - [엘프, 다리를 놓으면 장사가 잘될 거라고 원로들을 설득한다.]
    expected: []
  - name: song-at-inn
    set: v1
    kind: none
    scene: 여관 1층에서 음유시인이 류트를 조율한다. 손님들이 잔을 부딪친다.
    moves:
      - [드워프, 술잔을 들고 고향의 노래를 따라 부른다.]
    expected: []

  # --- v2: 위키백과 ---
  - name: galleon-harbor
    set: v2
    kind: named
    scene: 만 안쪽에 갤리온 한 척이 닻을 내렸다. 고물 쪽 갑판이 성벽처럼 높다.
    moves:
      - [엘프, 갤리온의 뱃전에 걸린 줄사다리를 타고 오른다.]
    expected: [ko/갈레온, ko/카라카, ko/범선]
  - name: portcullis-drop
    set: v2
    kind: named
    scene: 성문 위에서 쇠사슬 감기는 소리가 난다. 문 안쪽 홈을 따라 무언가 내려오기 시작한다.
    moves:
      - [드워프, 내리닫이 쇠창살이 다 내려오기 전에 그 아래로 몸을 날린다.]
    expected: [en/Portcullis, en/Gate]
  - name: battering-ram
    set: v2
    kind: meaning
    scene: 적병들이 지붕을 씌운 수레를 밀고 온다. 수레 안에는 쇠사슬에 매단 커다란 통나무가 흔들린다.
    moves:
      - [엘프, 통나무가 문을 치기 전에 수레의 덮개에 불화살을 쏜다.]
    expected: [en/Battering ram, equipment/ram-portable]
  - name: oil-lamp
    set: v2
    kind: named
    scene: 지하 서고에는 창이 없다. 책상 위에 기름이 반쯤 남은 등잔이 놓여 있다.
    moves:
      - [엘프, 등잔에 불을 붙이고 심지를 돋운다.]
    expected: [ko/호롱, ko/양초, equipment/lamp]
  - name: trebuchet-siege
    set: v2
    kind: named
    scene: 언덕 위에 거대한 트레뷰셋이 서 있다. 평형추가 들려 올라가며 나무가 삐걱인다.
    moves:
      - [드워프, 트레뷰셋의 평형추를 매단 밧줄을 도끼로 끊으러 달린다.]
    expected: [ko/트레뷰셋, ko/투석기]
  - name: moat-drawbridge
    set: v2
    kind: named
    scene: 성을 두른 해자에 검은 물이 고여 있다. 건너편의 도개교는 들려 있다.
    moves:
      - [엘프, 해자를 헤엄쳐 건너 도개교를 내리는 사슬을 찾는다.]
    expected: [ko/해자, ko/도개교]
  - name: roadside-inn
    set: v2
    kind: named
    scene: 비가 쏟아지는 길가에 여관 간판이 흔들린다. 안에서 웃음소리와 고기 굽는 냄새가 새어 나온다.
    moves:
      - [드워프, 여관에 들어가 주인에게 방 하나와 뜨거운 국을 청한다.]
    expected: [ko/여관, ko/선술집]
  - name: village-forge
    set: v2
    kind: meaning
    scene: 마을 끝 오두막에서 쇠 두드리는 소리가 울린다. 화덕의 불이 붉게 일렁이고 쇠붙이가 모루 위에서 튄다.
    moves:
      - [엘프, 부러진 칼날을 내밀며 다시 벼려 달라고 한다.]
    expected: [ko/대장간, ko/모루, ko/풀무]
  - name: mead-feast
    set: v2
    kind: named
    scene: 긴 탁자에 구운 멧돼지와 빵이 놓였다. 뿔잔마다 황금빛 벌꿀술이 넘친다.
    moves:
      - [드워프, 벌꿀술을 단숨에 비우고 잔을 탁자에 내려친다.]
    expected: [ko/꿀술]
  - name: halberd-guard
    set: v2
    kind: named
    scene: 성문 앞에 미늘창을 든 경비병 둘이 서 있다. 도끼날 위의 창끝이 햇빛에 번쩍인다.
    moves:
      - [엘프, 경비병의 미늘창 갈고리에 걸리지 않게 거리를 두고 말을 건다.]
    expected: [en/Halberd, equipment/halberd]
  - name: crossbow-ambush
    set: v2
    kind: named
    scene: 바위 뒤에서 석궁의 시위 당기는 소리가 들린다.
    moves:
      - [드워프, 방패를 들어 석궁의 화살을 막으며 바위 쪽으로 돌진한다.]
    expected: [ko/석궁, equipment/crossbow-light, equipment/crossbow-heavy]
  - name: mandrake-root
    set: v2
    kind: named
    scene: 늪가의 그늘에 넓은 잎이 땅에 붙어 자란다. 약초꾼은 이것이 맨드레이크라고 속삭인다.
    moves:
      - [엘프, 귀를 막고 맨드레이크의 뿌리를 조심스레 뽑는다.]
    expected: [ko/맨드레이크]
  - name: sinking-marsh
    set: v2
    kind: meaning
    scene: 발을 디딜 때마다 진흙이 무릎까지 빨아들인다. 갈대 사이로 고인 물에서 썩은 냄새가 올라온다.
    moves:
      - [드워프, 지팡이로 앞의 땅을 찔러 보며 한 걸음씩 나아간다.]
    expected: [ko/늪]
  - name: hourglass-trial
    set: v2
    kind: named
    scene: 마법사가 탁자 위에 모래시계를 뒤집어 놓는다. 고운 모래가 가늘게 흘러내린다.
    moves:
      - [엘프, 모래시계의 모래가 다 떨어지기 전에 수수께끼의 답을 말하려 애쓴다.]
    expected: [ko/모래시계, equipment/hourglass]
  - name: lighthouse-storm
    set: v2
    kind: meaning
    scene: 폭풍 속에서 배가 기운다. 멀리 바위섬 위 높은 탑 꼭대기에서 불빛이 돌며 바닷길을 비춘다.
    moves:
      - [엘프, 키를 꺾어 탑의 불빛을 향해 배를 몬다.]
    expected: [ko/등대, en/Beacon]
  - name: apology
    set: v2
    kind: none
    scene: 모닥불 곁에 동료 둘이 말없이 앉아 있다. 어제의 다툼이 아직 둘 사이에 남아 있다.
    moves:
      - [드워프, 고개를 숙이고 어제 한 말을 사과한다.]
    expected: []

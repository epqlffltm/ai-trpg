[project]
name = "auth-server"
version = "0.1.0"
description = "Authentication service for an AI-driven TRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.2",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pybreaker>=1.4.1",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "openapi-core>=0.23.1",
    "pyright[nodejs]==1.1.408",
    "ruff>=0.16.10",
]

[tool.pyright]
# Django 를 쓰지 않는 파일만 본다. pyright 는 Django 가 실행할 때 만드는 것(모델의 objects, 칸의 값,
# transaction.atomic 등)을 알아보지 못해 그 파일들은 소음뿐이다. 이 파일에 Django 를 들이면 여기서 뺀다
include = [
    "accounts/attendance_rules.py",
    "accounts/backoff.py",
    "accounts/badge_rules.py",
    "accounts/reserved.py",
    "accounts/service_client.py",
    "accounts/service_signature.py",
    "config/db_limits.py",
    "observability/context.py",
    "observability/db_spans.py",
    "observability/formatter.py",
    "observability/heartbeat.py",
    "observability/http_spans.py",
    "observability/identifiers.py",
    "observability/idle_rounds.py",
    "observability/jobs.py",
    "observability/metrics.py",
    "observability/middleware.py",
    "observability/redaction.py",
    "observability/request_metrics.py",
    "observability/request_spans.py",
    "observability/setup.py",
    "observability/spans.py",
    "observability/tracing.py",
    "scripts/export_jwt_public_key.py",
    "scripts/generate_jwt_key.py",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 게임 서버와 같다
extend = "../ruff.toml"
# Django 가 만든 마이그레이션은 손으로 쓴 코드가 아니다. 만든 그대로 둔다
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "observability"]

[tool.coverage.run]
# 우리가 쓴 코드만 잰다. 테스트와 Django 가 만든 마이그레이션은 뺀다
source = ["accounts", "config", "observability"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# 한 줄도 없는 파일(__init__.py)은 표에서 뺀다
skip_empty = true

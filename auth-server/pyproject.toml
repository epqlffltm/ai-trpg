[project]
name = "auth-server"
version = "0.1.0"
description = "Authentication service for an AI-driven TRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 게임 서버와 같다
extend = "../ruff.toml"
# Django 가 만든 마이그레이션은 손으로 쓴 코드가 아니다. 만든 그대로 둔다
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "observability"]

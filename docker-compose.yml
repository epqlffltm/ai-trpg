# docker-compose.yml
# 로컬 개발용 공용 인프라(PostgreSQL, Redis).
# 인증 서버와 게임 서버가 같은 인스턴스를 쓰므로 어느 서버 폴더에도 두지 않고 루트에 둔다.
# 서버 자체(Django, FastAPI)는 아직 여기 없다. 개발 중에는 호스트에서 직접 실행한다.
#
#   docker compose up -d          # 시작
#   docker compose ps             # healthy 가 될 때까지 확인
#   docker compose down           # 정지 (-v 를 붙이면 볼륨까지 지워져 데이터가 날아간다)

services:
  db:
    # pgvector 가 포함된 이미지. 인증 서버는 벡터를 쓰지 않지만
    # 게임 서버가 같은 인스턴스를 쓰므로 처음부터 맞춰 둔다
    image: pgvector/pgvector:pg17
    environment:
      # 관리용 슈퍼유저. 서버는 이 계정으로 접속하지 않는다
      POSTGRES_USER: ${POSTGRES_USER:-trpg}
      # 기본값을 두지 않는다. .env 에 없으면 compose 가 기동을 거부한다
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-trpg}
      # 인증 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?.env 에 AUTH_DB_PASSWORD 를 설정하세요}
      # 게임 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?.env 에 GAME_DB_PASSWORD 를 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 서버별 계정과 스키마를 만드는 초기화 스크립트.
      # 볼륨이 비어 있는 첫 기동 때만 실행된다. 읽기 전용으로 붙인다
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # 서버를 호스트에서 실행하므로 포트를 연다.
    # 127.0.0.1 로 묶어 같은 네트워크의 다른 기기에서는 접속할 수 없게 한다.
    # Windows 에서 Hyper-V 가 5432 를 예약한 경우 .env 의 POSTGRES_PORT 만 바꾼다
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # 컨테이너 시작 시점과 접속 가능 시점은 다르다. 접속을 받을 때 healthy 가 된다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trpg} -d ${POSTGRES_DB:-trpg}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF 를 켠다. 로그인 시도 횟수와 IP 차단 기록이 들어갈 자리다.
    # 재시작으로 데이터가 사라지면 차단이 풀리고 시도 횟수가 처음부터 다시 세어진다.
    # (폐기한 refresh 토큰은 Redis 가 아니라 PostgreSQL 에 기록한다)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:

# docker-compose.yml
# 공용 인프라(PostgreSQL, Redis, 그림 저장소)와 서버들. 서버마다 폴더가 따로라 어느 서버 폴더에도 두지 않고 루트에 둔다.
#
# 개발 중에는 인프라만 띄우고 서버는 PC 에서 직접 실행한다. 서버들은 app 프로필에 묶여 있어서 이 명령으로는 뜨지 않는다.
#
#   docker compose up -d          # DB 와 Redis, DB 의 백업, 그림 저장소만 시작
#   docker compose ps             # healthy 가 될 때까지 확인
#   docker compose down           # 정지 (-v 를 붙이면 볼륨까지 지워져 데이터가 날아간다)
#
# 서버들까지 컨테이너로 띄울 때는 프로필을 붙인다. 이미지를 만들고, 마이그레이션을 한 번씩 돌린 뒤 서버를 띄운다.
# 바깥에서는 프록시(nginx) 하나로 들어온다: http://127.0.0.1:8080/api/v1/<서버>/...
# 인증 서버만 관리자 화면 때문에 127.0.0.1:8000 을 함께 연다. PC 에서 직접 띄운 인증 서버와 포트가 겹치므로 그것을 먼저 끈다.
#
#   docker compose --profile app up -d --build
#   docker compose --profile app ps -a      # 마이그레이션은 Exited (0), 서버·프록시·워커 셋은 healthy, cron 은 Up 이면 된다
#   docker compose --profile app down
#
# 로그와 메트릭을 모아 볼 때(#25)는 프로필 observability 를 더한다. Alloy, Loki, Prometheus, Grafana 가 뜬다(아래의 "로그와 메트릭 모으기").
#
#   docker compose --profile app --profile observability up -d --build
#
# 서버의 설정은 각 서버 폴더의 .env 를 그대로 넘긴다(env_file). 그 안의 주소는 PC 에서 직접 띄울 때의 것(127.0.0.1)이라
# 컨테이너에서는 닿지 않는다. 주소만 아래의 environment 가 컨테이너의 이름(db, redis, auth-server 등)으로 덮어쓴다.
# DB 주소는 이 파일이 읽는 루트 .env 의 비밀번호로 만든다. 비밀번호를 두 곳에 적지 않는다.
#
# 이 파일에는 비밀을 적지 않는다. 비밀은 루트 .env 와 각 서버의 .env, 인증 서버의 키 파일에만 있다.
#
# 비밀은 그것을 쓰는 프로세스에만 준다(#274). env_file 은 서버 폴더의 .env 를 통째로 넘기므로,
# 그 프로세스가 쓰지 않는 비밀은 environment 에서 빈 값으로 덮는다(environment 가 env_file 보다 앞선다).
# 인증 서버의 서명 개인키(키 폴더)는 auth-server 에만 붙인다. 나머지는 JWT_PRIVATE_KEY_PATH 를 비워 키 없이 뜬다.
# 어느 프로세스가 무엇을 받는지는 .github/scripts/secret_scope.py 의 표에 있다. CI 가 이 파일과 표가 맞는지 본다.
# 새 비밀을 더하면 그 표에도 적는다
#
# 컨테이너의 로그(docker logs)는 서비스마다 크기에 상한을 둔다(x-logging, #358). 상한이 없으면 VM 의 디스크가 차서 DB 가 멈춘다.
# 새 서비스에도 logging: *logging 을 붙인다. 빠뜨리면 CI 가 실패한다(.github/scripts/logging_scope.py)

# 컨테이너 로그의 상한. 파일 하나가 10MB 가 되면 새 파일로 넘기고, 5개를 넘으면 가장 오래된 것을 지운다.
# 서비스마다 최대 50MB, 17개면 850MB 쯤이다. json-file 이라 docker logs 가 그대로 되고, 나중에 로그를 모을 때(#25) 수집기가 읽기 쉽다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-auth-image: &auth-image
  build: ./auth-server
  image: ai-trpg/auth-server:local

x-game-image: &game-image
  build:
    context: ./trpg-server
    # 공용 코드(shared/). Dockerfile 이 COPY --from=shared 로 가져온다(docs/architecture/shared-code.md 의 "정한 것").
    # 빌드 범위를 루트로 넓히지 않는다. 다른 서버의 .env 가 빌드에 섞이지 않게
    additional_contexts:
      shared: ./shared
  image: ai-trpg/trpg-server:local

x-board-image: &board-image
  build: ./board-server
  image: ai-trpg/board-server:local

x-billing-image: &billing-image
  build: ./billing-server
  image: ai-trpg/billing-server:local

x-notification-image: &notification-image
  build:
    context: ./notification-server
    # 공용 코드(shared/). Dockerfile 이 COPY --from=shared 로 가져온다(docs/architecture/shared-code.md 의 "정한 것").
    # 빌드 범위를 루트로 넓히지 않는다. 다른 서버의 .env 가 빌드에 섞이지 않게
    additional_contexts:
      shared: ./shared
  image: ai-trpg/notification-server:local

x-asset-image: &asset-image
  build:
    context: ./asset-server
    # 공용 코드(shared/). Dockerfile 이 COPY --from=shared 로 가져온다(docs/architecture/shared-code.md 의 "정한 것").
    # 빌드 범위를 루트로 넓히지 않는다. 다른 서버의 .env 가 빌드에 섞이지 않게
    additional_contexts:
      shared: ./shared
  image: ai-trpg/asset-server:local

x-chat-image: &chat-image
  build:
    context: ./chat-server
    # 공용 코드(shared/). Dockerfile 이 COPY --from=shared 로 가져온다(docs/architecture/shared-code.md 의 "정한 것")
    additional_contexts:
      shared: ./shared
  image: ai-trpg/chat-server:local

# 인증 서버의 JWT 개인키가 든 폴더. 읽기 전용으로 붙인다. 폴더가 없으면 만들지 않고 실패한다
# (없는 경로를 붙이면 Docker 가 빈 폴더를 만들어 버려서, 키가 없다는 것이 늦게 드러난다)
x-auth-keys: &auth-keys
  type: bind
  source: ./auth-server/keys
  target: /app/keys
  read_only: true
  bind:
    create_host_path: false

# 계속 도는 워커(메일, 환영 크레딧, 결제의 정리 작업)의 상태 확인(#258, docs/observability.md 의 "워커의 상태").
# 워커는 한 바퀴를 DB 에 닿아 끝낼 때마다 심장박동 파일(HEARTBEAT_FILE)의 시각을 바꾼다. 2분 안에 바뀌었으면 healthy 다.
# 그래서 워커의 healthy 는 "DB 에 닿으며 돈다"는 뜻이다. 파일이 없거나(아직 한 바퀴도 못 돌았다) 오래됐으면 unhealthy 다.
# 2분은 정리 작업의 간격(30초)과, 메일 서버나 결제 서버가 느린 한 묶음보다 넉넉한 길이다.
# 서버처럼 unhealthy 를 보고 재시작하지는 않는다. docker compose ps 와 CI 의 스택 확인이 본다
# 인증 서버의 프로세스가 함께 쓰는 설정. 비밀은 없다(비밀은 auth-server/.env 에서 온다)
x-auth-environment: &auth-environment
  DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  REDIS_URL: redis://redis:6379/0
  # 다른 서버가 공개키를 받으러 올 때 Host 머리말이 auth-server 다. 목록에 없으면 Django 가 400 으로 막는다
  ALLOWED_HOSTS: localhost,127.0.0.1,auth-server
  BILLING_URL: http://billing-server:8003
  # 앞에 프록시가 하나 있다. X-Forwarded-For 의 맨 뒤(프록시가 붙인 주소)를 클라이언트의 IP 로 믿는다.
  # 프록시를 거치지 않고 8000 으로 직접 오는 요청(관리자 화면)은 헤더가 없어 연결한 상대의 주소를 쓴다
  TRUSTED_PROXY_COUNT: "1"

# 서명하지 않는 인증 프로세스(마이그레이션, 워커, cron). 키 폴더를 붙이지 않고 키의 경로를 비운다.
# .env 에 경로를 적어 두었어도 여기서 덮는다. 경로가 비면 설정이 키를 읽지 않는다(config/jwt_keys.py)
x-auth-without-signing-key: &auth-without-signing-key
  JWT_PRIVATE_KEY_PATH: ""

# 게임 서버의 프로세스가 함께 쓰는 설정. 비밀은 없다(비밀은 trpg-server/.env 에서 온다)
x-game-environment: &game-environment
  DATABASE_URL: postgresql+asyncpg://game:${GAME_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  # 모든 서버를 함께 띄우므로 결제 서버에 붙인다. trpg-server/.env 에 BILLING_SECRET 이 있어야 뜬다.
  # 로컬에서 크레딧 없이 한 판을 돌려 보려면 루트 .env 에 GAME_BILLING_URL= (빈 값)을 적는다. 그러면 서술 값을 받지 않는다
  # (게임 서버의 결제 없는 모드). 적지 않으면 결제 서버다. ":-" 가 아니라 "-" 라서 빈 값을 적으면 빈 값 그대로 쓴다
  BILLING_URL: ${GAME_BILLING_URL-http://billing-server:8003}
  # 방장에게 보내는 알림도 알림 서버에 넣는다. trpg-server/.env 에 NOTIFICATION_SECRET 이 있어야 뜬다
  # (알림 서버의 GAME_SERVER_SECRET 과 같은 값)
  NOTIFICATION_URL: http://notification-server:8004
  # 언어 모델(Ollama)은 컨테이너 밖, 이 PC 에서 돈다. 컨테이너 안의 127.0.0.1 은 컨테이너 자신이다.
  # 다른 곳의 모델을 쓰면 루트 .env 의 GAME_LLM_BASE_URL 을 적는다. trpg-server/.env 의 LLM_BASE_URL 은 여기서 덮인다
  LLM_BASE_URL: ${GAME_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  # 로비의 비밀번호와 채팅의 시도 횟수를 Redis 로 센다(#56). 인증 서버와 같은 Redis 다. 키의 앞부분이 달라 섞이지 않는다
  REDIS_URL: redis://redis:6379/0

# 게시판 서버의 프로세스가 함께 쓰는 설정. 비밀은 없다(비밀은 board-server/.env 에서 온다)
x-board-environment: &board-environment
  DATABASE_URL: postgresql://board:${BOARD_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  HOST: 0.0.0.0
  PORT: "8002"

# 결제 서버의 프로세스가 함께 쓰는 설정. 비밀은 없다(비밀은 billing-server/.env 에서 온다)
x-billing-environment: &billing-environment
  DATABASE_URL: postgres://billing:${BILLING_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  HOST: 0.0.0.0
  PORT: "8003"

# 요청을 받지 않는 결제 프로세스(마이그레이션, 정리 작업, cron). 요청의 서명을 확인하는 비밀을 비운다.
# 작업 명령의 설정(LoadJobs, LoadSweeper, LoadDatabase)은 이 셋을 읽지 않는다
x-billing-without-request-secrets: &billing-without-request-secrets
  PG_WEBHOOK_SECRET: ""
  GAME_SERVER_SECRET: ""
  AUTH_SERVER_SECRET: ""
  CHAT_SERVER_SECRET: ""

# 알림 서버의 프로세스가 함께 쓰는 설정. 비밀은 없다(비밀은 notification-server/.env 에서 온다)
x-notification-environment: &notification-environment
  DATABASE_URL: postgresql+asyncpg://notification:${NOTIFICATION_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  # 연결 풀의 크기. 모든 서버의 합이 DB 의 max_connections 안에 들게 나눈 몫이다(docs/architecture/services.md 의 "DB 와 Redis 의 한도")
  DB_POOL_SIZE: "2"
  DB_MAX_OVERFLOW: "3"

# asset 서버의 프로세스가 함께 쓰는 설정(#564). 비밀은 DB 비밀번호뿐이고 루트 .env 에서 온다
x-asset-environment: &asset-environment
  DATABASE_URL: postgresql+asyncpg://asset:${ASSET_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  # 연결 풀의 크기. 모든 서버의 합이 DB 의 max_connections 안에 들게 나눈 몫이다(docs/architecture/services.md 의 "DB 와 Redis 의 한도")
  DB_POOL_SIZE: "2"
  DB_MAX_OVERFLOW: "3"

# chat 서버의 프로세스가 함께 쓰는 설정(#590). 비밀은 DB 비밀번호뿐이고 루트 .env 에서 온다
x-chat-environment: &chat-environment
  DATABASE_URL: postgresql+asyncpg://chat:${CHAT_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
  AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
  # 연결 풀의 크기. 모든 서버의 합이 DB 의 max_connections 안에 들게 나눈 몫이다(docs/architecture/services.md 의 "DB 와 Redis 의 한도")
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"

# asset-server 가 그림을 넣고 꺼내는 저장소(#566, docs/architecture/asset-server.md 의 "그림"). 마이그레이션에는 주지 않는다.
# 로컬은 object-store(SeaweedFS)다. staging 은 docker-compose.staging.yml 이 주소를 S3 로 바꾸고, 키와 버킷은 루트 .env 의 것(그 버킷만 쓰는 IAM 사용자)이다.
# 이 주소로 서명한 주소(60초)를 nginx 가 받아 간다. nginx 는 이 주소가 저장소의 것일 때만 받는다(docker/nginx/templates/http.inc.template)
x-asset-image-store: &asset-image-store
  IMAGE_STORE_ENDPOINT: http://object-store:8333
  IMAGE_STORE_REGION: ${IMAGE_STORE_REGION:-ap-northeast-2}
  IMAGE_STORE_BUCKET: ${IMAGE_STORE_BUCKET:-ai-trpg-images}
  IMAGE_STORE_ACCESS_KEY_ID: ${IMAGE_STORE_ACCESS_KEY_ID:-ai-trpg-local}
  IMAGE_STORE_SECRET_ACCESS_KEY: ${IMAGE_STORE_SECRET_ACCESS_KEY:?.env 에 IMAGE_STORE_SECRET_ACCESS_KEY 를 설정하세요(tools/fill_env.py)}

# 메트릭이나 추적을 OTLP 로 미는 프로세스가 함께 쓰는 설정(#25, docs/observability.md 의 "2. 메트릭", "3. 추적"). 비밀은 없다.
# 보낼 곳(Alloy)은 루트 .env 의 OTEL_EXPORTER_OTLP_ENDPOINT 로 받는다. 프로필 observability 를 켤 때만 적는다.
# 비어 있으면 서버는 메트릭을 내보내지 않는다(계측은 그대로). app 프로필만 켰을 때 없는 Alloy 로 보내며 오류를 남기지 않는다.
# 이것을 쓰는 서비스는 망 telemetry 에도 붙는다(networks 에 default 와 함께 적는다)
x-telemetry-environment: &telemetry-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-worker-heartbeat: &worker-heartbeat
  test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 120"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  db:
    # 죽으면 다시 띄운다. docker compose down 으로 끈 것은 다시 뜨지 않는다
    restart: unless-stopped
    # pgvector 가 포함된 이미지. 인증 서버는 벡터를 쓰지 않지만
    # 게임 서버가 같은 인스턴스를 쓰므로 처음부터 맞춰 둔다
    image: pgvector/pgvector:pg17
    logging: *logging
    environment:
      # 관리용 슈퍼유저. 서버는 이 계정으로 접속하지 않는다
      POSTGRES_USER: ${POSTGRES_USER:-trpg}
      # 기본값을 두지 않는다. .env 에 없으면 compose 가 기동을 거부한다
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-trpg}
      # 인증 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?.env 에 AUTH_DB_PASSWORD 를 설정하세요}
      # 게임 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?.env 에 GAME_DB_PASSWORD 를 설정하세요}
      # 결제 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?.env 에 BILLING_DB_PASSWORD 를 설정하세요}
      # 게시판 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      BOARD_DB_PASSWORD: ${BOARD_DB_PASSWORD:?.env 에 BOARD_DB_PASSWORD 를 설정하세요}
      # 알림 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?.env 에 NOTIFICATION_DB_PASSWORD 를 설정하세요}
      # asset 서버 전용 계정의 비밀번호. 초기화 스크립트(08-asset-role.sql)가 읽는다
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:?.env 에 ASSET_DB_PASSWORD 를 설정하세요(tools/fill_env.py)}
      # chat 서버 전용 계정의 비밀번호. 초기화 스크립트(09-chat-role.sql)가 읽는다
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?.env 에 CHAT_DB_PASSWORD 를 설정하세요(tools/fill_env.py)}
      # 인증 서버 계정에 테스트용 DB 를 만들 권한(CREATEDB)을 줄지. 개발에서만 true 로 둔다.
      # 운영에서는 적지 않는다(false). 볼륨이 비어 있는 첫 기동 때만 반영된다(#20)
      AUTH_DB_ALLOW_TEST_DB: ${AUTH_DB_ALLOW_TEST_DB:-false}
      # 메트릭을 읽는 계정(monitor)의 비밀번호. 초기화 스크립트(07-monitor-role.sql)가 읽는다.
      # 프로필 observability 를 쓸 때만 적는다. 비어 있으면 계정을 만들지 않는다. 그래서 기본값을 빈 값으로 둔다
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 서버별 계정과 스키마를 만드는 초기화 스크립트.
      # 볼륨이 비어 있는 첫 기동 때만 실행된다. 읽기 전용으로 붙인다
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # PC 에서 직접 띄운 서버가 붙도록 포트를 연다. 컨테이너로 띄운 서버는 이 포트가 아니라 db:5432 로 붙는다.
    # 127.0.0.1 로 묶어 같은 네트워크의 다른 기기에서는 접속할 수 없게 한다.
    # Windows 에서 Hyper-V 가 5432 를 예약한 경우 .env 의 POSTGRES_PORT 만 바꾼다
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # 컨테이너 시작 시점과 접속 가능 시점은 다르다. 접속을 받을 때 healthy 가 된다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trpg} -d ${POSTGRES_DB:-trpg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 서버들은 기본 망(default)으로 붙는다. 메트릭을 읽는 Alloy 는 datastore-metrics 로만 붙는다
    networks: [default, datastore-metrics]

  # DB 의 백업(#274). DB 하나를 통째로 한 파일로 뜬다. 지금 한 번, 그 뒤로 하루에 한 번이고 최근 14개를 남긴다.
  # DB 와 같은 이미지라 pg_dump 의 판이 서버와 같다. 스크립트는 docker/backup/db-backup.sh 에 있다.
  # 파일은 PC 의 폴더(루트 .env 의 BACKUP_DIR, 기본 ./backups)에 둔다. docker compose down -v 로 볼륨을 지워도 남는다.
  # 같은 디스크라 디스크가 망가지면 함께 사라진다. 다른 장비로 옮기는 법은 README 의 "백업과 복원"에 있다.
  #
  #   docker compose run --rm db-backup once     # 지금 한 번 뜬다
  #   docker compose run --rm db-backup check    # 가장 최근 백업을 빈 DB 에 풀어 원본과 줄 수가 같은지 본다
  db-backup:
    image: pgvector/pgvector:pg17
    logging: *logging
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/db-backup.sh"]
    command: ["loop"]
    # 관리 계정으로 뜬다. 서버들의 스키마를 모두 읽고, 복원을 확인할 DB 를 만들고 지운다
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-trpg}
      PGPASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      PGDATABASE: ${POSTGRES_DB:-trpg}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./docker/backup/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # 25시간 안에 뜬 백업이 있으면 healthy 다. 하루 간격에 한 시간의 여유를 둔다.
    # 처음 뜨는 데 걸리는 시간만큼 기다린다. 서버처럼 unhealthy 를 보고 재시작하지는 않는다
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'trpg-*.dump' -mmin -1500 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    logging: *logging
    # 죽으면 다시 띄운다. docker compose down 으로 끈 것은 다시 뜨지 않는다
    restart: unless-stopped
    # AOF 를 켠다. 로그인 시도 횟수와 IP 차단 기록이 들어갈 자리다.
    # 재시작으로 데이터가 사라지면 차단이 풀리고 시도 횟수가 처음부터 다시 세어진다.
    # (폐기한 refresh 토큰은 Redis 가 아니라 PostgreSQL 에 기록한다)
    # 메모리는 64MB 까지다. 차면 기한이 걸린 키 가운데 오래 안 쓴 것부터 내쫓는다(volatile-lru, #592).
    # 지금 넣는 것은 모두 기한이 있는 시도 횟수라, 내쫓기면 제한이 조금 느슨해질 뿐이다. noeviction 이면 쓰기가 실패해 게임의 로비와 채팅이 503 이다.
    # 버리면 안 되는 것은 Redis 에 두지 않는다(docs/architecture/services.md 의 "DB 와 Redis 의 한도")
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 서버들은 기본 망(default)으로 붙는다. 메트릭을 읽는 Alloy 는 datastore-metrics 로만 붙는다
    networks: [default, datastore-metrics]

  # 그림 파일(배경, 캐릭터, 일러스트)을 두는 저장소의 로컬 흉내(#540). S3 와 같은 API 다.
  # staging 은 진짜 S3(서울)를 쓰고 이것을 띄우지 않는다(docker-compose.staging.yml). 무엇을 왜 정했는지는
  # docs/architecture/deployment.md 의 "그림 저장소"에 있다.
  #
  # SeaweedFS 를 한 프로세스(mini: master, volume, filer, S3)로 띄운다. MinIO 는 2025년 10월부터 이미지를 내지 않아 쓰지 않는다.
  # 서명한 요청만 받는다(익명은 403). 진짜 S3 처럼 서명하는 코드를 로컬에서도 거치게 하려고다.
  # 버킷은 뜰 때 만든다(이미 있으면 그대로). 없는 버킷에 올리면 진짜 S3 처럼 404 다(autoCreateBucket=false).
  # 그림은 볼륨 objectdata 에 남는다. docker compose down -v 로 볼륨을 지우면 사라진다.
  # 이미지는 root 로 떠서 /data 의 주인을 맞춘 뒤 seaweed(1000)로 내려가 돈다(이미지의 entrypoint.sh)
  object-store:
    image: chrislusf/seaweedfs:4.48
    logging: *logging
    restart: unless-stopped
    command:
      - mini
      # 안의 구성 요소끼리 부르는 주소. 컨테이너의 IP 는 다시 뜰 때 바뀌어서 고정한 주소를 쓴다
      - -ip=127.0.0.1
      - -bucket=${IMAGE_STORE_BUCKET:-ai-trpg-images}
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      # S3 말고는 쓰지 않는다
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      # 10GiB 를 넘으면 사용 통계를 바깥(telemetry.seaweedfs.com)으로 보낸다. 끈다
      - -master.telemetry=false
    environment:
      # 이 키 하나만 모든 권한을 갖는다. 접근 키의 이름은 비밀이 아니다. 비밀 키는 루트 .env 에서 온다(tools/fill_env.py 가 만든다)
      AWS_ACCESS_KEY_ID: ${IMAGE_STORE_ACCESS_KEY_ID:-ai-trpg-local}
      AWS_SECRET_ACCESS_KEY: ${IMAGE_STORE_SECRET_ACCESS_KEY:?.env 에 IMAGE_STORE_SECRET_ACCESS_KEY 를 설정하세요(tools/fill_env.py)}
    volumes:
      - objectdata:/data
    # PC 에서 직접 띄운 서버(나중의 asset-server)가 붙도록 S3 의 포트만 연다. 127.0.0.1 로 묶는다
    ports:
      - "127.0.0.1:${IMAGE_STORE_PORT:-8333}:8333"
    # S3 가 요청을 받으면 healthy 다. 버킷은 그 뒤 1초 안에 만들어진다
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 서버들 (app 프로필)
  #
  # 마이그레이션은 서버마다 한 번 돌고 끝나는 컨테이너(*-migrate)가 한다. 서버는 그것이 성공해야(Exited 0) 뜬다.
  # 서버를 여럿 띄워도 마이그레이션은 한 번만 돈다. 실패하면 서버가 뜨지 않아서 바로 드러난다.
  #
  # 바깥에서 들어오는 길은 프록시(proxy) 하나다. 서버의 포트는 열지 않는다.
  # 인증 서버만 127.0.0.1:8000 을 연다. 관리자 화면(/admin/)은 프록시가 막으므로 이 포트로 직접 붙는다.
  # 서버(VM)에서는 SSH 터널로 붙는다: ssh -L 8000:127.0.0.1:8000 <서버>  그다음 http://127.0.0.1:8000/admin/
  #
  # 서버끼리는 컨테이너의 이름으로 부른다. 게임, 게시판, 결제 서버는 인증 서버의 공개키(JWKS)를 필요할 때 받아 온다.
  # 인증 서버가 늦게 떠도 뜨는 데는 지장이 없어서 서로 기다리게 하지 않는다.
  #
  # 서버들의 healthcheck 는 준비됐는지(/health/ready)를 부른다. healthy 는 "DB 에 닿는다"는 뜻이다(docs/observability.md).
  # DB 가 죽으면 서버들이 unhealthy 로 보이지만 재시작되지는 않는다. Docker 는 unhealthy 를 보고 재시작하지 않는다.
  # 서버의 healthy 를 기다리는 서비스도 없다. DB 가 돌아오면 다음 확인에서 healthy 로 돌아온다
  # ---------------------------------------------------------------------------

  auth-migrate:
    <<: *auth-image
    profiles: [app]
    logging: *logging
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: ./auth-server/.env
    environment:
      <<: [*auth-environment, *auth-without-signing-key]
      BILLING_SECRET: ""
      ASSET_SECRET: ""
      GAME_SECRET: ""
      NOTIFICATION_SECRET: ""
      BOARD_SECRET: ""
      CHAT_SECRET: ""
      SMTP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

  auth-server:
    <<: *auth-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./auth-server/.env
    environment:
      <<: [*auth-environment, *telemetry-environment]
      # 키 파일은 아래에서 붙인 폴더에 있다. .env 에 다른 경로를 적어 두었어도 컨테이너에서는 이 경로다
      JWT_PRIVATE_KEY_PATH: keys/jwt-private.pem
      # 서버는 결제 서버를 부르지 않는다(부르는 것은 환영 크레딧의 워커다). 다만 결제 서버가 보낸
      # 보호자 알림(/service/guardian-notices)의 서명을 이 비밀로 확인하므로 BILLING_SECRET 을 남긴다(#352)
      # 탈퇴를 알리는 것도 워커다. asset, 게임, 알림, 게시판, chat 서버에 알릴 때의 비밀을 비운다
      ASSET_SECRET: ""
      GAME_SECRET: ""
      NOTIFICATION_SECRET: ""
      BOARD_SECRET: ""
      CHAT_SECRET: ""
    # span 과 메트릭을 Alloy 에 민다(telemetry)
    networks: [default, telemetry]
    # 토큰에 서명하는 것은 이 서버뿐이다. 키 폴더는 여기에만 붙인다
    volumes:
      - *auth-keys
    # 관리자 화면용. 위의 설명을 본다
    ports:
      - "127.0.0.1:${AUTH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 워커. 발송함(DB)에 쌓인 메일을 보낸다. 계속 돈다.
  # 메일 서버 설정(SMTP_HOST)이 없으면 메일을 요청 자리에서 바로 출력하므로(inline) 이 워커는 할 일 없이 돈다
  auth-mail:
    <<: *auth-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    command: ["python", "manage.py", "send_outgoing_mail"]
    env_file: ./auth-server/.env
    # 메일을 보낸 바퀴의 span 과 모든 바퀴의 메트릭(남은 메일의 수)을 Alloy 에 민다(telemetry). 할 일이 없던 바퀴의 span 은 보내지 않는다
    environment:
      <<: [*auth-environment, *auth-without-signing-key, *telemetry-environment]
      HEARTBEAT_FILE: /tmp/heartbeat
      BILLING_SECRET: ""
      ASSET_SECRET: ""
      GAME_SECRET: ""
      NOTIFICATION_SECRET: ""
      BOARD_SECRET: ""
      CHAT_SECRET: ""
    networks: [default, telemetry]
    healthcheck: *worker-heartbeat
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 워커. 가입을 마친 사용자의 환영 크레딧을 결제 서버에 맡긴다. 계속 돈다.
  # auth-server/.env 에 BILLING_SECRET 이 없으면 바로 오류로 끝난다(다시 뜨기를 되풀이한다)
  auth-welcome-credits:
    <<: *auth-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    command: ["python", "manage.py", "send_welcome_credits"]
    env_file: ./auth-server/.env
    # 크레딧을 맡긴 바퀴의 span 과 모든 바퀴의 메트릭을 Alloy 에 민다(telemetry). 할 일이 없던 바퀴의 span 은 보내지 않는다
    environment:
      <<: [*auth-environment, *auth-without-signing-key, *telemetry-environment]
      HEARTBEAT_FILE: /tmp/heartbeat
      SMTP_PASSWORD: ""
      # 탈퇴를 알릴 서버의 주소(docs/architecture/withdrawal.md).
      # 비밀(ASSET_SECRET, GAME_SECRET, NOTIFICATION_SECRET, BOARD_SECRET, CHAT_SECRET)은 auth-server/.env 에 있다
      ASSET_URL: http://asset-server:8006
      GAME_URL: http://trpg-server:8001
      NOTIFICATION_URL: http://notification-server:8004
      BOARD_URL: http://board-server:8002
      CHAT_URL: http://chat-server:8005
    networks: [default, telemetry]
    healthcheck: *worker-heartbeat
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 주기 명령(보안 이벤트 요약, 미인증 계정 정리, 만료된 토큰 정리). 시각은 docker/cron/auth.crontab 에 있다.
  # supercronic 은 명령이 남기는 줄(JSON)을 그대로 내보낸다(-passthrough-logs). 제 줄은 실패만 남긴다(-quiet, -json)
  auth-cron:
    <<: *auth-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    command: ["supercronic", "-quiet", "-json", "-passthrough-logs", "/etc/supercronic/crontab"]
    env_file: ./auth-server/.env
    # 요약 메일을 발송함에 적지 않고 바로 보내는 설정(MAIL_DELIVERY=inline)도 있어 SMTP_PASSWORD 는 남긴다
    # 명령 한 번의 span 과 메트릭을 끝날 때 Alloy 에 민다(telemetry)
    environment:
      <<: [*auth-environment, *auth-without-signing-key, *telemetry-environment]
      BILLING_SECRET: ""
      ASSET_SECRET: ""
      GAME_SECRET: ""
      NOTIFICATION_SECRET: ""
      BOARD_SECRET: ""
      CHAT_SECRET: ""
    networks: [default, telemetry]
    volumes:
      - ./docker/cron/auth.crontab:/etc/supercronic/crontab:ro
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  trpg-migrate:
    <<: *game-image
    profiles: [app]
    logging: *logging
    command: ["alembic", "upgrade", "heads"]
    env_file: ./trpg-server/.env
    # 마이그레이션은 DB 만 쓴다. 모델의 키와 서버끼리의 비밀을 비운다.
    # 결제 서버와 알림 서버의 주소도 비운다. 주소가 있으면 설정이 그 비밀을 요구한다
    environment:
      <<: *game-environment
      BILLING_URL: ""
      BILLING_SECRET: ""
      NOTIFICATION_URL: ""
      NOTIFICATION_SECRET: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      ZAI_API_KEY: ""
      DEEPINFRA_API_KEY: ""
      SIGNAL_SECRET: ""
      AI_LOG_HMAC_KEY: ""
      AUTH_SERVER_SECRET: ""
    # host.docker.internal 이 이 PC 를 가리키게 한다. Docker Desktop 에는 원래 있고, 리눅스에는 이 줄이 있어야 한다
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  trpg-server:
    <<: *game-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./trpg-server/.env
    environment:
      <<: [*game-environment, *telemetry-environment]
    # span 과 메트릭을 Alloy 에 민다(telemetry). 다른 서버와 AI 모델의 창구에는 default 로 닿는다
    networks: [default, telemetry]
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      trpg-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  board-migrate:
    <<: *board-image
    profiles: [app]
    logging: *logging
    command: ["node_modules/.bin/typeorm", "-d", "dist/database/data-source.js", "migration:run"]
    env_file: ./board-server/.env
    # 마이그레이션은 DB 만 읽는다(readDatabaseSettings). 알림 서버의 비밀과 탈퇴를 알리는 인증 서버의 비밀을 비운다
    environment:
      <<: *board-environment
      NOTIFICATION_SECRET: ""
      AUTH_SERVER_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

  board-server:
    <<: *board-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./board-server/.env
    # 댓글과 답글의 알림을 알림 서버에 넣는다(#385). board-server/.env 에 NOTIFICATION_SECRET 이 있어야 뜬다
    # (알림 서버의 BOARD_SERVER_SECRET 과 같은 값)
    environment:
      <<: [*board-environment, *telemetry-environment]
      NOTIFICATION_URL: http://notification-server:8004
    # span 과 메트릭을 Alloy 에 민다(telemetry). 인증 서버와 알림 서버에는 default 로 닿는다
    networks: [default, telemetry]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      board-migrate:
        condition: service_completed_successfully

  billing-migrate:
    <<: *billing-image
    profiles: [app]
    logging: *logging
    command: ["/app/migrate", "up"]
    env_file: ./billing-server/.env
    # 마이그레이션은 DB 만 읽는다(config.LoadDatabase). 서명의 비밀과 결제 대행사의 키를 비운다
    environment:
      <<: [*billing-environment, *billing-without-request-secrets]
      TOSS_SECRET_KEY: ""
      NOTIFICATION_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

  billing-server:
    <<: *billing-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./billing-server/.env
    # 사용자의 알림은 정리 작업이 넣는다. 서버는 알림 서버를 부르지 않는다
    environment:
      <<: [*billing-environment, *telemetry-environment]
      NOTIFICATION_SECRET: ""
    # 메트릭을 Alloy 에 민다(telemetry). 다른 서버와는 default 로 닿는다
    networks: [default, telemetry]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  # 결제 서버의 정리 작업. 만료된 홀드를 돌려주고, 사라진 무료 크레딧을 적고, 만료된 주문을 끝내고,
  # 보호자에게 알릴 결제를 인증 서버에, 사용자에게 알릴 일을 알림 서버에 보낸다. 30초마다 돈다
  billing-sweeper:
    <<: *billing-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    command: ["/app/sweeper"]
    env_file: ./billing-server/.env
    # 결제 대행사를 부르지 않는다. 설정(config.LoadSweeper)이 결제 대행사의 설정을 읽지 않아 TOSS_SECRET_KEY 도 비운다.
    # 요청을 받지 않으니 받는 쪽의 비밀(PG_WEBHOOK_SECRET, GAME_SERVER_SECRET, CHAT_SERVER_SECRET)도 비운다.
    # AUTH_SERVER_SECRET 은 남긴다. 미성년자의 결제를 보호자에게 알리라고 인증 서버에 서명해 보낸다(#352).
    # NOTIFICATION_SECRET 도 남긴다. 사용자에게 알릴 일을 알림 서버에 서명해 넣는다(#385)
    environment:
      <<: [*billing-environment, *telemetry-environment]
      PG_WEBHOOK_SECRET: ""
      GAME_SERVER_SECRET: ""
      CHAT_SERVER_SECRET: ""
      TOSS_SECRET_KEY: ""
      HEARTBEAT_FILE: /tmp/heartbeat
      NOTIFICATION_URL: http://notification-server:8004
    networks: [default, telemetry]
    healthcheck: *worker-heartbeat
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  # 결제 서버의 주기 명령(대사). 시각은 docker/cron/billing.crontab 에 있다
  billing-cron:
    <<: *billing-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    command: ["supercronic", "-quiet", "-json", "-passthrough-logs", "/etc/supercronic/crontab"]
    env_file: ./billing-server/.env
    # 대사는 결제 대행사에 결과를 묻는다. TOSS_SECRET_KEY 는 남긴다
    # 대사 한 번의 작업 메트릭을 끝날 때 Alloy 에 민다(telemetry)
    environment:
      <<: [*billing-environment, *billing-without-request-secrets, *telemetry-environment]
      NOTIFICATION_SECRET: ""
    networks: [default, telemetry]
    volumes:
      - ./docker/cron/billing.crontab:/etc/supercronic/crontab:ro
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  notification-migrate:
    <<: *notification-image
    profiles: [app]
    logging: *logging
    command: ["alembic", "upgrade", "heads"]
    env_file: ./notification-server/.env
    # 마이그레이션은 DB 만 쓴다. 알림을 넣는 서버마다의 서명 비밀과 탈퇴를 알리는 인증 서버의 비밀을 비운다
    environment:
      <<: *notification-environment
      GAME_SERVER_SECRET: ""
      BILLING_SERVER_SECRET: ""
      BOARD_SERVER_SECRET: ""
      ASSET_SERVER_SECRET: ""
      CHAT_SERVER_SECRET: ""
      AUTH_SERVER_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

  # 알림 서버. 보관 기간이 지난 알림 지우기와 끊긴 세션 목록 받기는 이 프로세스 안에서 돈다(워커가 따로 없다)
  notification-server:
    <<: *notification-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./notification-server/.env
    environment:
      <<: [*notification-environment, *telemetry-environment]
    # span 과 메트릭을 Alloy 에 민다(telemetry). 다른 서버와는 default 로 닿는다
    networks: [default, telemetry]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notification-migrate:
        condition: service_completed_successfully

  asset-migrate:
    <<: *asset-image
    profiles: [app]
    logging: *logging
    command: ["alembic", "upgrade", "heads"]
    env_file: ./asset-server/.env
    # 마이그레이션은 DB 만 쓴다. 페르소나와 판을 가져가는 서버마다의 서명 비밀과 탈퇴를 알리는 인증 서버의 비밀을 비운다
    environment:
      <<: *asset-environment
      CHAT_SERVER_SECRET: ""
      AUTH_SERVER_SECRET: ""
      NOTIFICATION_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

  # asset 서버(#564). 계정 페르소나, 캐릭터, 그림의 원본. 끊긴 세션 목록 받기는 이 프로세스 안에서 돈다(워커가 따로 없다)
  asset-server:
    <<: *asset-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./asset-server/.env
    environment:
      <<: [*asset-environment, *asset-image-store, *telemetry-environment]
      # 운영자의 숨김과 신고 처리를 알림 서버에 넣는다(#678). asset-server/.env 에 NOTIFICATION_SECRET 이 있어야 뜬다
      # (알림 서버의 ASSET_SERVER_SECRET 과 같은 값). 마이그레이션(asset-migrate)에는 넘기지 않는다
      NOTIFICATION_URL: http://notification-server:8004
    # span 과 메트릭을 Alloy 에 민다(telemetry). 다른 서버와는 default 로 닿는다
    networks: [default, telemetry]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      asset-migrate:
        condition: service_completed_successfully

  chat-migrate:
    <<: *chat-image
    profiles: [app]
    logging: *logging
    command: ["alembic", "upgrade", "heads"]
    env_file: ./chat-server/.env
    # 마이그레이션은 DB 만 쓴다. asset 서버와 결제 서버의 주소와 서명 비밀, 모델의 키를 함께 비운다.
    # 주소만 남으면(.env.example 의 ASSET_URL) 설정의 검사가 "주소는 있고 비밀이 없다"로 막는다(로컬 VM 리허설, 2026-10-22).
    # 탈퇴 알림을 받는 비밀(AUTH_SERVER_SECRET)도 비운다. 받지 않고, 설정이 길이를 본다(#670)
    environment:
      <<: *chat-environment
      ASSET_URL: ""
      ASSET_SECRET: ""
      BILLING_URL: ""
      BILLING_SECRET: ""
      AUTH_SERVER_SECRET: ""
      NOTIFICATION_SECRET: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      ZAI_API_KEY: ""
      DEEPINFRA_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  # chat 서버(#590). 캐릭터 하나와 1:1 대화. 끊긴 세션 목록 받기는 이 프로세스 안에서 돈다(워커가 따로 없다).
  # 요약과 임베딩도 나중에 이 프로세스 안의 바퀴로 돈다(docs/architecture/chat-server.md 의 "뒤의 일")
  chat-server:
    <<: *chat-image
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    env_file: ./chat-server/.env
    environment:
      <<: [*chat-environment, *telemetry-environment]
      # 대화를 시작할 때 캐릭터의 판과 페르소나를 가져온다(chat-server/README.md 의 "대화").
      # chat-server/.env 에 ASSET_SECRET 이 있어야 뜬다(asset 서버의 CHAT_SERVER_SECRET 과 같은 값)
      ASSET_URL: http://asset-server:8006
      # 말 한 번의 값을 결제 서버에서 받고 모델의 값을 가격 목록에서 읽는다(chat-server/README.md 의 "모델 목록").
      # chat-server/.env 에 BILLING_SECRET 이 있어야 뜬다(결제 서버의 CHAT_SERVER_SECRET 과 같은 값)
      BILLING_URL: http://billing-server:8003
      # 신고의 처리를 알림 서버에 넣는다(#678). chat-server/.env 에 NOTIFICATION_SECRET 이 있어야 뜬다
      # (알림 서버의 CHAT_SERVER_SECRET 과 같은 값). 마이그레이션(chat-migrate)에는 넘기지 않는다
      NOTIFICATION_URL: http://notification-server:8004
      # 요청 수 제한(#671)을 센다. DB 번호 2 는 chat 의 몫이다(docs/architecture/services.md 의 "DB 와 Redis 의 한도")
      REDIS_URL: redis://redis:6379/2
    # span 과 메트릭을 Alloy 에 민다(telemetry). 다른 서버와는 default 로 닿는다
    networks: [default, telemetry]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      chat-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 화면(web/)을 빌드해 담은 nginx 의 이미지다(web/Dockerfile, #290). /api/ 는 서버로, 그 밖은 화면이다
  proxy:
    build:
      context: ./web
    image: ai-trpg/proxy:local
    profiles: [app]
    logging: *logging
    restart: unless-stopped
    # 설정의 틀. 이미지가 뜰 때 ${APP_ENVIRONMENT} 같은 자리를 아래의 environment 로 채워 conf.d 에 쓴다
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-dev}
      # 이미지의 시작 스크립트가 찍는 안내 글을 끈다. 로그는 JSON 줄만 남긴다
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    # 컨테이너 안에서만 열리는 상태 확인 포트(8081)를 부른다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # 서버를 기다리지 않는다. 서버의 주소는 요청마다 찾으므로 늦게 뜬 서버도 따라간다.
    # 아직 없는 서버로 가는 요청은 502 다

  # ---------------------------------------------------------------------------
  # 로그와 메트릭 모으기 (observability 프로필, #25)
  #
  # 이 compose 의 컨테이너 로그와 메트릭, 추적을 모아(Alloy) 저장하고(Loki, Prometheus, Tempo) 본다(Grafana). 규칙에 걸리면 경보를 보낸다(Alertmanager). 기본으로 꺼져 있다. staging 에서 켠다.
  # 서버 코드와 서버의 설정은 그대로다. 서버는 stderr 에 쓰기만 하고, 이 넷이 멈춰도 요청은 영향을 받지 않는다.
  #
  #   docker compose --profile app --profile observability up -d --build
  #   그다음 http://127.0.0.1:3000 (VM 에서는 사설망: http://<VM 의 Tailscale 이름>:3000, docs/operations/staging-vm.md 의 4번)
  #
  # 망을 셋으로 나눈다. 서버들은 기본 망(default)에 있어서 Loki, Prometheus, Alertmanager, Tempo, Grafana, 소켓 프록시에 닿지 않는다.
  #   docker-api     소켓 프록시와 Alloy 만. 바깥으로 나가지 못한다(internal)
  #   observability  Alloy, Loki, Prometheus, Alertmanager, Tempo, Grafana. Grafana 의 포트를 열고 Alertmanager 가 바깥으로 보내려고 internal 로 두지 않는다
  #   telemetry      Alloy 와, 메트릭이나 span 을 OTLP 로 미는 서버의 프로세스(다섯 서버). 서버는 여기서 Alloy 의 4318 에만 닿는다(internal).
  #                  서버의 프로세스는 메트릭이나 span 을 붙이는 PR 에서 이 망에 더한다(networks 에 default 도 함께 적고, x-telemetry-environment 를 붙인다)
  # 무엇을 왜 이렇게 정했는지는 docs/observability.md 의 "수집기(Grafana Alloy)를 붙일 자리"에 있다
  # ---------------------------------------------------------------------------

  # Docker 의 API 앞에 서는 프록시. 컨테이너와 네트워크의 목록, 로그를 읽는 GET 만 넘긴다.
  # 만들기, 지우기, exec 같은 쓰기(POST, DELETE)와 이미지, 볼륨, 비밀 등 그 밖의 API 는 403 이다.
  # 소켓을 Alloy 에 직접 붙이면 Alloy 가 뚫릴 때 VM 의 관리자 권한이 넘어간다.
  # 넘기는 것에 컨테이너의 inspect 가 들어 있어 컨테이너의 환경 변수(비밀)도 읽힌다. 그래서 Alloy 만 닿는 망에 둔다
  docker-socket-proxy:
    # 이 이미지의 태그는 앞에 v 가 붙는다(v0.5.0). 0.5.0 은 없다
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      # 기본으로 꺼져 있지만 적어 둔다. 쓰기는 하나도 넘기지 않는다
      POST: "0"
      # 요청마다 남기는 줄을 끈다. 15초마다 컨테이너 목록을 묻고 그 줄을 다시 모으게 된다
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  # 수집기. 이 compose 의 컨테이너를 찾아 로그를 읽고, 서버의 JSON 줄을 풀어 Loki 로 보낸다(docker/alloy/config.alloy).
  # 서버가 OTLP 로 민 메트릭과 수집 쪽 자신의 메트릭을 Prometheus 로 보낸다(docker/alloy/metrics.alloy).
  # 읽은 자리와 아직 보내지 못한 메트릭(WAL)을 볼륨(alloydata)에 남겨서 다시 떠도 이어 간다
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    # 설정 파일이 아니라 폴더를 준다. 그 안의 *.alloy(로그, 메트릭)를 함께 읽는다
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy"]
    # 이미지는 root 로 뜬다. 로그는 파일이 아니라 Docker 의 API 로 읽으므로 root 가 필요 없다.
    # 이미지가 만들어 둔 사용자(alloy, 473)로 띄운다. 읽은 자리를 남기는 폴더는 이미지에서 그 사용자의 것이다
    user: "473:473"
    environment:
      # 이 프로젝트의 컨테이너만 모으려고 프로젝트의 이름을 넘긴다
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      # DB 의 메트릭을 읽는 계정(monitor)의 비밀번호와 DB 의 이름(docker/alloy/metrics.alloy)
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
      MONITOR_DB_NAME: ${POSTGRES_DB:-trpg}
    volumes:
      - ./docker/alloy:/etc/alloy:ro
      - alloydata:/var/lib/alloy/data
    # 서버들의 망(default)에는 넣지 않는다. 서버의 API 에 닿지 않고, DB 와 Redis 에는 datastore-metrics 로만 닿는다
    networks: [docker-api, observability, telemetry, datastore-metrics]
    depends_on:
      - docker-socket-proxy
      - loki
      - prometheus
      - tempo

  # 로그의 저장소. 14일 뒤에 지운다(docker/loki/config.yaml). 볼륨(lokidata)에 파일로 쌓는다.
  # 포트를 열지 않는다. Grafana 와 Alloy 만 내부망으로 닿는다
  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    networks: [observability]

  # 메트릭의 저장소. 받기만 한다(remote write 수신). 긁는 설정을 두지 않는다(docker/prometheus/prometheus.yml).
  # 쓰는 것은 Alloy 하나, 읽는 것은 Grafana 하나다. 저장소를 Mimir 로 바꿀 때 그 둘의 주소만 바뀐다(docs/observability.md).
  # 14일 뒤에 지운다. 볼륨(prometheusdata)에 쌓는다. 포트를 열지 않는다
  prometheus:
    # 태그 끝의 -busybox 는 셸과 wget 이 든 이미지다(healthcheck 가 쓴다). -distroless 에는 없다
    image: prom/prometheus:v3.15.0-busybox
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 경보 규칙과 그 시험(tests/). 시험은 stack-smoke.sh 가 이 컨테이너의 promtool 로 돌린다
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 추적(span)의 저장소. 서버가 OTLP 로 Alloy 에 민 추적을 Alloy 가 넘긴다(docker/alloy/traces.alloy).
  # 한 프로세스로 띄운다(docker/tempo/config.yaml). 14일 뒤에 지운다. 볼륨(tempodata)에 쌓는다.
  # 포트를 열지 않는다. 쓰는 것은 Alloy, 읽는 것은 Grafana 하나다
  tempo:
    image: grafana/tempo:3.1.0
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    # 이미지는 사용자 10001 로 돈다. /var/tempo 는 이미지에서 그 사용자의 것이다
    command: ["-config.file=/etc/tempo/config.yaml", "-target=all"]
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
    networks: [observability]
    # 셸이 없는 이미지(distroless)다. Tempo 의 상태 확인(/tempo -health)이 /ready 를 묻는다
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # 경보를 보내는 곳. Prometheus 가 규칙(docker/prometheus/rules)으로 울린 경보를 묶어 Discord, Slack, Telegram, 메일로 보낸다.
  # 받는 곳은 루트 .env 의 ALERT_* 에 적은 것만 켠다. 설정 파일은 시작 명령(docker/alertmanager/entrypoint.sh)이 그 값으로 만든다.
  # 포트를 열지 않는다. 지금 울리는 경보와 잠시 끄기(silence)는 Grafana 의 Alerting 화면(데이터 소스 alertmanager)에서 본다.
  # 끈 것과 보낸 기록은 볼륨(alertmanagerdata)에 남겨 다시 떠도 같은 알림을 또 보내지 않는다
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    # 이미지의 사용자(nobody)로 돈다. 이미지의 시작 명령은 /bin/alertmanager 다
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
      # 하나만 띄운다. 여럿을 묶는 길(gossip, 9094)을 열지 않는다
      - --cluster.listen-address=
    environment:
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # Telegram 의 API 주소. 비우면 https://api.telegram.org 다. CI 가 흉내(alert-sink)로 바꾼다
      ALERT_TELEGRAM_API_URL: ${ALERT_TELEGRAM_API_URL:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      # 바깥 감시의 주소. 늘 울리는 Watchdog 을 1~2분마다 그리로만 보낸다
      ALERT_HEARTBEAT_WEBHOOK_URL: ${ALERT_HEARTBEAT_WEBHOOK_URL:-}
    volumes:
      - ./docker/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanagerdata:/alertmanager
    # observability 망은 internal 이 아니라 바깥(Discord 등)으로 나간다. 서버들의 망(default)에는 없다
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 로그와 메트릭을 보는 화면. Loki 와 Prometheus 는 뜰 때 데이터 소스로, 서버마다의 대시보드는 파일로 붙는다(docker/grafana).
  # 이 PC(127.0.0.1)에만 연다. VM 에서는 관리 서버가 생기기 전까지 Tailscale 이 사설망에 넘긴다(tailscale serve, #539).
  # 관리자 비밀번호는 루트 .env 의 GRAFANA_ADMIN_PASSWORD 다. 볼륨(grafanadata)이 비어 있는 첫 기동 때만 반영된다
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    logging: *logging
    restart: unless-stopped
    # 관리자 비밀번호가 없으면 뜨지 않는다. 비어 있으면 Grafana 는 admin/admin 으로 뜬다.
    # ${GRAFANA_ADMIN_PASSWORD:?} 로 막지 않는다. compose 는 켜지 않은 프로필의 서비스까지 채우므로
    # 이 프로필을 쓰지 않는 사람의 docker compose up 까지 멈춘다. 이미지의 시작 명령은 /run.sh 다
    entrypoint:
      - sh
      - -c
      - test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo '루트 .env 에 GRAFANA_ADMIN_PASSWORD 를 설정하세요' >&2; exit 1; }; exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana Labs 에 사용 통계를 보내지 않고, 새 판과 플러그인의 갱신을 묻지 않는다
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 자신의 로그. 경고 이상만, JSON 으로 남긴다
      GF_LOG_LEVEL: warn
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # 대시보드는 저장소의 파일이 원본이다(docker/grafana/dashboards). 화면에서 고치지 못한다
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [observability]
    # Grafana 가 제 DB 를 열고 요청을 받으면 healthy 다. Loki 와 Prometheus 에 닿는지는 보지 않는다(stack-smoke.sh 가 본다).
    # Loki 와 Alloy 의 이미지에는 상태를 물을 도구가 없어 healthcheck 를 두지 않는다
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      - loki
      - prometheus
      - alertmanager
      - tempo

networks:
  # 소켓 프록시와 Alloy 만 있는 망. 바깥으로 나가지 못한다
  docker-api:
    internal: true
  # Alloy, Loki, Prometheus, Alertmanager, Tempo, Grafana 의 망
  observability:
  # Alloy 와, 메트릭을 OTLP 로 미는 서버의 프로세스. 바깥으로 나가지 못한다
  telemetry:
    internal: true
  # DB, Redis 와 그 메트릭을 읽는 Alloy. 바깥으로 나가지 못한다
  datastore-metrics:
    internal: true

volumes:
  pgdata:
  redisdata:
  objectdata:
  alloydata:
  lokidata:
  prometheusdata:
  alertmanagerdata:
  tempodata:
  grafanadata:

# docker-compose.yml
# 공용 인프라(PostgreSQL, Redis)와 서버 넷. 서버마다 폴더가 따로라 어느 서버 폴더에도 두지 않고 루트에 둔다.
#
# 개발 중에는 인프라만 띄우고 서버는 PC 에서 직접 실행한다. 서버 넷은 app 프로필에 묶여 있어서 이 명령으로는 뜨지 않는다.
#
#   docker compose up -d          # DB 와 Redis 만 시작
#   docker compose ps             # healthy 가 될 때까지 확인
#   docker compose down           # 정지 (-v 를 붙이면 볼륨까지 지워져 데이터가 날아간다)
#
# 서버 넷까지 컨테이너로 띄울 때는 프로필을 붙인다. 이미지를 만들고, 마이그레이션을 한 번씩 돌린 뒤 서버를 띄운다.
# 바깥에서는 프록시(nginx) 하나로 들어온다: http://127.0.0.1:8080/api/v1/<서버>/...
# 인증 서버만 관리자 화면 때문에 127.0.0.1:8000 을 함께 연다. PC 에서 직접 띄운 인증 서버와 포트가 겹치므로 그것을 먼저 끈다.
#
#   docker compose --profile app up -d --build
#   docker compose --profile app ps -a      # 마이그레이션은 Exited (0), 서버와 프록시는 healthy, 워커와 cron 은 Up 이면 된다
#   docker compose --profile app down
#
# 서버의 설정은 각 서버 폴더의 .env 를 그대로 넘긴다(env_file). 그 안의 주소는 PC 에서 직접 띄울 때의 것(127.0.0.1)이라
# 컨테이너에서는 닿지 않는다. 주소만 아래의 environment 가 컨테이너의 이름(db, redis, auth-server 등)으로 덮어쓴다.
# DB 주소는 이 파일이 읽는 루트 .env 의 비밀번호로 만든다. 비밀번호를 두 곳에 적지 않는다.
#
# 이 파일에는 비밀을 적지 않는다. 비밀은 루트 .env 와 각 서버의 .env, 인증 서버의 키 파일에만 있다.

x-auth-image: &auth-image
  build: ./auth-server
  image: ai-trpg/auth-server:local

x-game-image: &game-image
  build: ./game-server
  image: ai-trpg/game-server:local

x-board-image: &board-image
  build: ./board-server
  image: ai-trpg/board-server:local

x-billing-image: &billing-image
  build: ./billing-server
  image: ai-trpg/billing-server:local

# 인증 서버의 JWT 개인키가 든 폴더. 읽기 전용으로 붙인다. 폴더가 없으면 만들지 않고 실패한다
# (없는 경로를 붙이면 Docker 가 빈 폴더를 만들어 버려서, 키가 없다는 것이 늦게 드러난다)
x-auth-keys: &auth-keys
  type: bind
  source: ./auth-server/keys
  target: /app/keys
  read_only: true
  bind:
    create_host_path: false

services:
  db:
    # 죽으면 다시 띄운다. docker compose down 으로 끈 것은 다시 뜨지 않는다
    restart: unless-stopped
    # pgvector 가 포함된 이미지. 인증 서버는 벡터를 쓰지 않지만
    # 게임 서버가 같은 인스턴스를 쓰므로 처음부터 맞춰 둔다
    image: pgvector/pgvector:pg17
    environment:
      # 관리용 슈퍼유저. 서버는 이 계정으로 접속하지 않는다
      POSTGRES_USER: ${POSTGRES_USER:-trpg}
      # 기본값을 두지 않는다. .env 에 없으면 compose 가 기동을 거부한다
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-trpg}
      # 인증 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?.env 에 AUTH_DB_PASSWORD 를 설정하세요}
      # 게임 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?.env 에 GAME_DB_PASSWORD 를 설정하세요}
      # 결제 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?.env 에 BILLING_DB_PASSWORD 를 설정하세요}
      # 게시판 서버 전용 계정의 비밀번호. 초기화 스크립트가 읽는다
      BOARD_DB_PASSWORD: ${BOARD_DB_PASSWORD:?.env 에 BOARD_DB_PASSWORD 를 설정하세요}
      # 인증 서버 계정에 테스트용 DB 를 만들 권한(CREATEDB)을 줄지. 개발에서만 true 로 둔다.
      # 운영에서는 적지 않는다(false). 볼륨이 비어 있는 첫 기동 때만 반영된다(#20)
      AUTH_DB_ALLOW_TEST_DB: ${AUTH_DB_ALLOW_TEST_DB:-false}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 서버별 계정과 스키마를 만드는 초기화 스크립트.
      # 볼륨이 비어 있는 첫 기동 때만 실행된다. 읽기 전용으로 붙인다
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # PC 에서 직접 띄운 서버가 붙도록 포트를 연다. 컨테이너로 띄운 서버는 이 포트가 아니라 db:5432 로 붙는다.
    # 127.0.0.1 로 묶어 같은 네트워크의 다른 기기에서는 접속할 수 없게 한다.
    # Windows 에서 Hyper-V 가 5432 를 예약한 경우 .env 의 POSTGRES_PORT 만 바꾼다
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # 컨테이너 시작 시점과 접속 가능 시점은 다르다. 접속을 받을 때 healthy 가 된다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trpg} -d ${POSTGRES_DB:-trpg}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 죽으면 다시 띄운다. docker compose down 으로 끈 것은 다시 뜨지 않는다
    restart: unless-stopped
    # AOF 를 켠다. 로그인 시도 횟수와 IP 차단 기록이 들어갈 자리다.
    # 재시작으로 데이터가 사라지면 차단이 풀리고 시도 횟수가 처음부터 다시 세어진다.
    # (폐기한 refresh 토큰은 Redis 가 아니라 PostgreSQL 에 기록한다)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # 서버 넷 (app 프로필)
  #
  # 마이그레이션은 서버마다 한 번 돌고 끝나는 컨테이너(*-migrate)가 한다. 서버는 그것이 성공해야(Exited 0) 뜬다.
  # 서버를 여럿 띄워도 마이그레이션은 한 번만 돈다. 실패하면 서버가 뜨지 않아서 바로 드러난다.
  #
  # 바깥에서 들어오는 길은 프록시(proxy) 하나다. 서버의 포트는 열지 않는다.
  # 인증 서버만 127.0.0.1:8000 을 연다. 관리자 화면(/admin/)은 프록시가 막으므로 이 포트로 직접 붙는다.
  # 서버(VM)에서는 SSH 터널로 붙는다: ssh -L 8000:127.0.0.1:8000 <서버>  그다음 http://127.0.0.1:8000/admin/
  #
  # 서버끼리는 컨테이너의 이름으로 부른다. 게임, 게시판, 결제 서버는 인증 서버의 공개키(JWKS)를 필요할 때 받아 온다.
  # 인증 서버가 늦게 떠도 뜨는 데는 지장이 없어서 서로 기다리게 하지 않는다.
  # ---------------------------------------------------------------------------

  auth-migrate:
    <<: *auth-image
    profiles: [app]
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: ./auth-server/.env
    environment: &auth-environment
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
      REDIS_URL: redis://redis:6379/0
      # 키 파일은 아래에서 붙인 폴더에 있다. .env 에 다른 경로를 적어 두었어도 컨테이너에서는 이 경로다
      JWT_PRIVATE_KEY_PATH: keys/jwt-private.pem
      # 다른 서버가 공개키를 받으러 올 때 Host 머리말이 auth-server 다. 목록에 없으면 Django 가 400 으로 막는다
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-server
      BILLING_URL: http://billing-server:8003
      # 앞에 프록시가 하나 있다. X-Forwarded-For 의 맨 뒤(프록시가 붙인 주소)를 클라이언트의 IP 로 믿는다.
      # 프록시를 거치지 않고 8000 으로 직접 오는 요청(관리자 화면)은 헤더가 없어 연결한 상대의 주소를 쓴다
      TRUSTED_PROXY_COUNT: "1"
    # 설정 파일이 읽힐 때 개인키를 읽는다. 마이그레이션에도 키가 있어야 한다
    volumes:
      - *auth-keys
    depends_on:
      db:
        condition: service_healthy

  auth-server:
    <<: *auth-image
    profiles: [app]
    restart: unless-stopped
    env_file: ./auth-server/.env
    environment: *auth-environment
    volumes:
      - *auth-keys
    # 관리자 화면용. 위의 설명을 본다
    ports:
      - "127.0.0.1:${AUTH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 워커. 발송함(DB)에 쌓인 메일을 보낸다. 계속 돈다.
  # 메일 서버 설정(SMTP_HOST)이 없으면 메일을 요청 자리에서 바로 출력하므로(inline) 이 워커는 할 일 없이 돈다
  auth-mail:
    <<: *auth-image
    profiles: [app]
    restart: unless-stopped
    command: ["python", "manage.py", "send_outgoing_mail"]
    env_file: ./auth-server/.env
    environment: *auth-environment
    volumes:
      - *auth-keys
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 워커. 가입을 마친 사용자의 환영 크레딧을 결제 서버에 맡긴다. 계속 돈다.
  # auth-server/.env 에 BILLING_SECRET 이 없으면 바로 오류로 끝난다(다시 뜨기를 되풀이한다)
  auth-welcome-credits:
    <<: *auth-image
    profiles: [app]
    restart: unless-stopped
    command: ["python", "manage.py", "send_welcome_credits"]
    env_file: ./auth-server/.env
    environment: *auth-environment
    volumes:
      - *auth-keys
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # 인증 서버의 주기 명령(보안 이벤트 요약, 미인증 계정 정리, 만료된 토큰 정리). 시각은 docker/cron/auth.crontab 에 있다.
  # supercronic 은 명령이 남기는 줄(JSON)을 그대로 내보낸다(-passthrough-logs). 제 줄은 실패만 남긴다(-quiet, -json)
  auth-cron:
    <<: *auth-image
    profiles: [app]
    restart: unless-stopped
    command: ["supercronic", "-quiet", "-json", "-passthrough-logs", "/etc/supercronic/crontab"]
    env_file: ./auth-server/.env
    environment: *auth-environment
    volumes:
      - *auth-keys
      - ./docker/cron/auth.crontab:/etc/supercronic/crontab:ro
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  game-migrate:
    <<: *game-image
    profiles: [app]
    command: ["alembic", "upgrade", "head"]
    env_file: ./game-server/.env
    environment: &game-environment
      DATABASE_URL: postgresql+asyncpg://game:${GAME_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
      AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
      # 모든 서버를 함께 띄우므로 결제 서버에 붙인다. game-server/.env 에 BILLING_SECRET 이 있어야 뜬다
      BILLING_URL: http://billing-server:8003
      # 언어 모델(Ollama)은 컨테이너 밖, 이 PC 에서 돈다. 컨테이너 안의 127.0.0.1 은 컨테이너 자신이다.
      # 다른 곳의 모델을 쓰면 루트 .env 의 GAME_LLM_BASE_URL 을 적는다. game-server/.env 의 LLM_BASE_URL 은 여기서 덮인다
      LLM_BASE_URL: ${GAME_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    # host.docker.internal 이 이 PC 를 가리키게 한다. Docker Desktop 에는 원래 있고, 리눅스에는 이 줄이 있어야 한다
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  game-server:
    <<: *game-image
    profiles: [app]
    restart: unless-stopped
    env_file: ./game-server/.env
    environment: *game-environment
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      game-migrate:
        condition: service_completed_successfully

  board-migrate:
    <<: *board-image
    profiles: [app]
    command: ["node_modules/.bin/typeorm", "-d", "dist/database/data-source.js", "migration:run"]
    env_file: ./board-server/.env
    environment: &board-environment
      DATABASE_URL: postgresql://board:${BOARD_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
      AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
      HOST: 0.0.0.0
      PORT: "8002"
    depends_on:
      db:
        condition: service_healthy

  board-server:
    <<: *board-image
    profiles: [app]
    restart: unless-stopped
    env_file: ./board-server/.env
    environment: *board-environment
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      board-migrate:
        condition: service_completed_successfully

  billing-migrate:
    <<: *billing-image
    profiles: [app]
    command: ["/app/migrate", "up"]
    env_file: ./billing-server/.env
    environment: &billing-environment
      DATABASE_URL: postgres://billing:${BILLING_DB_PASSWORD}@db:5432/${POSTGRES_DB:-trpg}
      AUTH_JWKS_URL: http://auth-server:8000/api/v1/auth/jwks
      HOST: 0.0.0.0
      PORT: "8003"
    depends_on:
      db:
        condition: service_healthy

  billing-server:
    <<: *billing-image
    profiles: [app]
    restart: unless-stopped
    env_file: ./billing-server/.env
    environment: *billing-environment
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  # 결제 서버의 정리 작업. 만료된 홀드를 돌려주고, 사라진 무료 크레딧을 적고, 만료된 주문을 끝낸다. 30초마다 돈다
  billing-sweeper:
    <<: *billing-image
    profiles: [app]
    restart: unless-stopped
    command: ["/app/sweeper"]
    env_file: ./billing-server/.env
    environment: *billing-environment
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  # 결제 서버의 주기 명령(대사). 시각은 docker/cron/billing.crontab 에 있다
  billing-cron:
    <<: *billing-image
    profiles: [app]
    restart: unless-stopped
    command: ["supercronic", "-quiet", "-json", "-passthrough-logs", "/etc/supercronic/crontab"]
    env_file: ./billing-server/.env
    environment: *billing-environment
    volumes:
      - ./docker/cron/billing.crontab:/etc/supercronic/crontab:ro
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine3.24
    profiles: [app]
    restart: unless-stopped
    # 설정의 틀. 이미지가 뜰 때 ${APP_ENVIRONMENT} 같은 자리를 아래의 environment 로 채워 conf.d 에 쓴다
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-dev}
      # 이미지의 시작 스크립트가 찍는 안내 글을 끈다. 로그는 JSON 줄만 남긴다
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    # 컨테이너 안에서만 열리는 상태 확인 포트(8081)를 부른다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # 서버를 기다리지 않는다. 서버의 주소는 요청마다 찾으므로 늦게 뜬 서버도 따라간다.
    # 아직 없는 서버로 가는 요청은 502 다

volumes:
  pgdata:
  redisdata:

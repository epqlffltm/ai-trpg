[project]
name = "board-server"
version = "0.1.0"
description = "Board service (notices, community posts, comments, reports) for an AI-driven TRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "server-core",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

# FastAPI 서버들의 공통부(토큰 검증, 관측, DB 연결). 저장소 안의 경로에서 받는다(docs/architecture/shared-code.md 의 "정한 것").
# 고친 것이 바로 보이게 editable 로 깐다. 이미지에는 설치된 모양으로 담는다(Dockerfile 의 uv sync --no-editable).
# CI 는 이 줄을 읽어 shared/server-core 가 바뀐 PR 에서 이 서버를 검사한다(.github/scripts/changed-servers.sh)
[tool.uv.sources]
server-core = { path = "../shared/server-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
# 테스트 전체가 이벤트 루프 하나에서 돈다. DB 연결은 만든 루프에 묶이므로,
# 연결 풀(엔진)을 테스트끼리 함께 쓰려면 루프도 하나여야 한다. 테스트마다 새 연결을 맺지 않는다
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 실패한 테스트의 기록을 짧게 찍는다. 기본(long)은 실패한 함수가 받은 인자의 값까지 찍는다.
# DB 에 연결하다 실패하면 그 인자가 비밀번호가 든 접속 주소다
addopts = "--tb=short"

[tool.coverage.run]
# 서버의 코드만 잰다. 테스트는 뺀다
source = ["app"]
# SQLAlchemy 의 비동기는 안에서 greenlet 으로 갈아탄다. 알려 주지 않으면 DB 를 기다린 뒤의 줄이 지나가지 않은 것으로 잡힌다
concurrency = ["greenlet", "thread"]
# 계약 시험(contract/)은 서버를 프로세스로 띄워 부른다. 그 프로세스가 센 것을 따로 남겨 합친다(README 의 "테스트")
parallel = true
sigterm = true

[tool.coverage.report]
# 한 줄도 없는 파일(__init__.py)은 표에서 뺀다
skip_empty = true

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 다른 서버들과 같다.
# 계약 시험(contract/)은 따로 된 묶음이라 그 폴더의 설정으로 본다
extend = "../ruff.toml"
extend-exclude = ["contract"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[project]
name = "server-core"
version = "0.1.0"
description = "Common parts of the FastAPI servers: token verification, observability, service signatures, database"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

# 선택 의존. 요청 수를 Redis 로 세는 서버(게임, chat, story)만 server-core[redis] 로 받는다.
# 가져오는 곳은 server_core/limits/redis_counter.py 하나다(tests/test_boundary.py)
[project.optional-dependencies]
redis = ["redis>=8.1.0"]

# 쓰는 서버가 uv 의 경로 의존으로 받는다(docs/architecture/shared-code.md 의 "정한 것").
# 서버의 이미지에는 설치된 모양으로 들어간다(Dockerfile 의 uv sync --no-editable)
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_core"]

[dependency-groups]
dev = [
    # 타입 검사(점검 P2-2). 받을 때 Node 를 함께 받아(nodejs 꾸러미) 돌릴 때 따로 내려받지 않는다
    "pyright[nodejs]==1.1.408",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # 선택 의존(redis)을 쓰는 곳을 테스트도 본다
    "redis>=8.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=short"

[tool.coverage.run]
# 공용 코드만 잰다. 테스트는 뺀다
source = ["server_core"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 서버들과 같다
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["server_core"]

[tool.pyright]
# 소스와 테스트를 본다. 테스트는 결과가 있다고 단언한 뒤 읽는 일이 많아 None 의 검사 셋만 끈다
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportOptionalMemberAccess = false, reportOptionalSubscript = false, reportOptionalOperand = false },
    { root = "src" },
]

# shared/ai-core/src/ai_core/model_catalog.toml
#
# 모델 목록의 원본(#499). 서비스마다 자기 표에 들여온다(게임 서버: uv run python -m scripts.models sync).
# 읽는 것과 칸의 뜻은 ai_core/catalog_file.py 에 있다. 들여온 모델은 꺼진 채다. 켜고 끄기는 서비스의 표에서 한다.
#
# 고치는 법
#   - 모델을 넣는다: [[models]] 를 더한다. 이름표(slug)는 API 이름에서 날짜를 빼고 점을 붙임표로 바꾼 상품 이름이다.
#     이름표는 결제 서버의 가격 코드(narration.<이름표>.i0.o0)가 그대로 쓴다. 이름표와 창구(provider)는 바꾸지 않는다.
#   - 날짜판이 바뀐다: api_model_id 만 바꾼다. 들여오면 기록이 남고 모델이 꺼진다. 평가 장면을 다시 통과한 뒤 켠다.
#   - 값이 바뀐다: 앞의 [[models.costs]] 를 지우지 않고 effective_from 이 그날인 줄을 더한다. 미리 알린 인상도 미리 적는다.
#   - 공급자가 내리는 날이 정해진다: retires_on 을 적는다. "이 날보다 늦다"는 날짜가 아니라 적지 않는다(주석에 둔다).
#   - 서버 곁의 모델(local)은 여기 두지 않는다. 환경마다 이름이 달라 그 환경의 파일로 들여온다(sync --file).
#
# 단가는 USD, 백만 토큰당. 기본 등급(일괄 처리가 아니고, 긴 입력의 웃돈이 붙기 전)의 값이다.
# cached_input 은 캐시 읽기, cache_write 는 캐시 쓰기(Anthropic 의 5분 캐시)다. 따로 값을 매기지 않으면 적지 않는다.
# 모든 값과 이름은 2026-10-21 에 각 회사의 공식 문서에서 확인했다(checked_on). 그 전의 값은 알지 못해 그날부터 적는다.
# 출처: platform.claude.com/docs(pricing, model-deprecations, models/overview), developers.openai.com/api/docs(pricing, models),
#       ai.google.dev/gemini-api/docs(pricing, models, deprecations), docs.z.ai(guides/overview/pricing, guides/llm),
#       deepinfra.com/deepseek-ai/DeepSeek-V4-Pro-0813, docs.deepinfra.com/chat/reasoning
# 아직 넣지 않은 것: Kimi(창구가 없다), DeepSeek 의 Flash(DeepInfra 의 판에서 생각을 끄는 법을 확인하지 못했다).

format = 1


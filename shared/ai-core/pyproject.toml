[project]
name = "ai-core"
version = "0.1.0"
description = "Calling language models: provider shapes, OpenAI-compatible, Claude and Gemini clients, streaming, costs, retry budget, embeddings"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

# 쓰는 서버가 uv 의 경로 의존으로 받는다(docs/architecture/shared-code.md 의 "정한 것").
# 서버의 이미지에는 설치된 모양으로 들어간다(Dockerfile 의 uv sync --no-editable)
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=short"

[tool.coverage.run]
# 공용 코드만 잰다. 테스트는 뺀다
source = ["ai_core"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 서버들과 같다
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["ai_core"]

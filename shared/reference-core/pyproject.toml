[project]
name = "reference-core"
version = "0.1.0"
description = "Pre-loaded reference material (SRD 5.1, Wikipedia) shared by trpg, chat and story: records, loading, indexing, selection"
requires-python = ">=3.13"
# 임베더의 계약(ai_core), 데이터 파일의 모양(pydantic), SQL(sqlalchemy), 표의 벡터 칸(pgvector).
# 바꾸면 쓰는 서버의 uv.lock 을 함께 다시 잠근다
dependencies = [
    "ai-core",
    "pgvector>=0.5.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.1.5",
]

# 쓰는 서버가 uv 의 경로 의존으로 받는다(docs/architecture/shared-code.md 의 "정한 것").
# 서버의 이미지에는 설치된 모양으로 들어간다(Dockerfile 의 uv sync --no-editable). 데이터 파일(data/)도 함께 실린다
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_core"]

# 공용 코드끼리의 의존. ai-core 도 저장소 안의 경로에서 받는다
[tool.uv.sources]
ai-core = { path = "../ai-core", editable = true }

[dependency-groups]
dev = [
    # 쿼리의 테스트가 실제 PostgreSQL(pgvector)에서 돈다. 접속 주소는 REFERENCE_CORE_TEST_DATABASE_URL 이다
    "asyncpg>=0.32.0",
    # 타입 검사(점검 P2-2). 받을 때 Node 를 함께 받아(nodejs 꾸러미) 돌릴 때 따로 내려받지 않는다
    "pyright[nodejs]==1.1.408",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=short"

[tool.coverage.run]
# 공용 코드만 잰다. 테스트는 뺀다
source = ["reference_core"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 서버들과 같다
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["reference_core"]

[tool.pyright]
# 소스와 테스트를 본다. 테스트는 결과가 있다고 단언한 뒤 읽는 일이 많아 None 의 검사 셋만 끈다
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportOptionalMemberAccess = false, reportOptionalSubscript = false, reportOptionalOperand = false },
    { root = "src" },
]

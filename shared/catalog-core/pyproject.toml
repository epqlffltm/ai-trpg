[project]
name = "catalog-core"
version = "0.1.0"
description = "Model catalog tables shared by chat, story and trpg: queries, lookup, importing the catalog file"
requires-python = ">=3.13"
# 모델 목록의 계약과 원본 파일(ai_core)과 SQL(sqlalchemy). 바꾸면 쓰는 서버의 uv.lock 을 함께 다시 잠근다
dependencies = [
    "ai-core",
    "sqlalchemy[asyncio]>=2.1.5",
]

# 쓰는 서버가 uv 의 경로 의존으로 받는다(docs/architecture/shared-code.md 의 "정한 것").
# 서버의 이미지에는 설치된 모양으로 들어간다(Dockerfile 의 uv sync --no-editable)
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_core"]

# 공용 코드끼리의 의존. ai-core 도 저장소 안의 경로에서 받는다
[tool.uv.sources]
ai-core = { path = "../ai-core", editable = true }

[dependency-groups]
dev = [
    # 테스트가 들여오기를 메모리의 SQLite 로 돌린다. PostgreSQL 에만 있는 것(DISTINCT ON, 줄 잠금)은 쓰는 서버의 테스트가 본다
    "aiosqlite>=0.22.1",
    # 타입 검사(점검 P2-2). 받을 때 Node 를 함께 받아(nodejs 꾸러미) 돌릴 때 따로 내려받지 않는다
    "pyright[nodejs]==1.1.408",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async def 로 쓴 테스트를 표시 없이 그대로 실행한다
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=short"
# 메모리의 SQLite 가 소수(Numeric)를 제 모양으로 담지 못한다는 경고. 단가는 소수 여섯째 자리까지라 맞게 돌아온다
filterwarnings = ["ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively"]

[tool.coverage.run]
# 공용 코드만 잰다. 테스트는 뺀다
source = ["catalog_core"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# 규칙과 모양은 저장소 루트의 ruff.toml 을 따른다. 서버들과 같다
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["catalog_core"]

[tool.pyright]
# 공용 코드의 소스만 본다. 테스트는 가짜 객체가 많아 따로 넓힌다
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# docker/prometheus/rules/ai-trpg.yml
# 경보 규칙(#25). Prometheus 가 15초마다 평가하고, 울린 경보를 Alertmanager 로 넘긴다(docker/prometheus/prometheus.yml).
# Alertmanager 가 Discord, Slack, Telegram, 메일로 보낸다(docker/alertmanager).
#
# Prometheus 의 규칙 파일 모양이다. 저장소를 Mimir 로 바꾸면 Mimir 의 ruler 가 이 파일을 그대로 읽는다.
# 규칙마다의 시험은 tests/ai-trpg.test.yml 에 있다(promtool test rules). 규칙을 고치면 시험도 고친다.
#
# label severity:
#   critical  지금 사용자가 못 쓰거나 데이터를 잃을 수 있다. 바로 본다
#   warning   곧 문제가 되거나 사람이 확인할 일이 있다. 그날 안에 본다
#   none      사람에게 보내지 않는다. Watchdog 하나다(바깥 감시에만 간다)
# annotation summary 는 한 줄, description 은 무엇을 볼지다. 둘 다 받는 곳(Discord 등)에 그대로 실린다.
# 서버의 경보는 service, 인프라의 경보는 job 으로 거른다(대시보드와 같은 규칙. docs/observability.md 의 "대시보드").

groups:
  # 경보를 내는 쪽 자신. Watchdog 은 늘 울린다. Alertmanager 가 바깥 감시(ALERT_HEARTBEAT_WEBHOOK_URL)에만 1분마다 보낸다.
  # 신호가 끊기면 바깥 감시가 알린다(Prometheus, Alertmanager, PC 나 VM, 인터넷 가운데 하나가 멈췄다). 운영자의 받는 곳에는 가지 않는다
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 경보를 내는 길이 살아 있다(늘 울린다)
          description: 바깥 감시에만 간다. 이 경보가 Grafana 에 없으면 Prometheus 가 규칙을 돌리지 못한다

      - alert: AlertDeliveryFailing
        # 받는 곳 가운데 하나로 보내지 못했다(웹후크를 지웠다, 메일의 비밀번호가 틀렸다). 나머지 받는 곳으로 이 경보가 간다.
        # webhook 은 바깥 감시다. 끊기면 바깥 감시가 따로 알린다
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{job="alertmanager", integration!="webhook"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '경보를 {{ $labels.integration }} 로 보내지 못하고 있다'
          description: docker compose --profile observability logs alertmanager 에서 그 받는 곳의 오류를 본다. 루트 .env 의 ALERT_* 를 고친 뒤 alertmanager 를 다시 만든다

  # 메트릭을 모으는 길 자체. 이것이 멈추면 다른 경보도 울리지 못한다
  - name: collectors
    rules:
      - alert: MetricsCollectorDown
        # Alloy 는 제 메트릭을 긁어 보낸다. 받기만 하는 Prometheus 는 마지막 값을 5분 동안 살아 있는 것으로 본다.
        # 그래서 Alloy 가 멈추고 10분쯤 뒤에 울린다
        expr: absent(up{job="alloy"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 수집기(Alloy)의 메트릭이 들어오지 않는다
          description: 서버, DB, Redis 의 메트릭이 모두 끊겼을 수 있다. docker compose ps alloy 와 Alloy 의 로그를 본다

      - alert: ObservabilityComponentDown
        expr: up{job=~"loki|tempo|grafana|alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 에 5분 동안 닿지 않는다'
          description: 로그 모으기(loki), 추적 모으기(tempo), 화면(grafana), 경보 보내기(alertmanager) 가운데 하나다. 그 컨테이너의 로그를 본다

  # DB(PostgreSQL)와 Redis. Alloy 안의 exporter 가 읽는다(docker/alloy/metrics.alloy)
  - name: datastores
    rules:
      - alert: PostgresDown
        # exporter 가 붙지 못한다. DB 가 죽었거나 monitor 계정, 비밀번호, 망이 틀렸다
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DB(PostgreSQL)에 붙지 못한다
          description: 서버들이 함께 DB 를 잃었을 수 있다. docker compose ps db 를 본다. DB 가 살아 있으면 MONITOR_DB_PASSWORD 와 monitor 계정을 본다

      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count{job="postgres"}) / max(pg_settings_max_connections{job="postgres"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'DB 연결이 max_connections 의 {{ $value | humanizePercentage }} 다'
          description: 서버들의 연결 풀의 합이 한도에 가깝다. 닿으면 새 연결이 거절된다. 대시보드 postgres 의 "상태마다의 연결"을 본다

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgres", datname="trpg"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 지난 10분 동안 DB 에 교착이 있었다
          description: PostgreSQL 이 트랜잭션 하나를 되돌려 풀었다. 같은 시각의 서버 로그에서 오류(error_code)를 찾는다

      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis 에 붙지 못한다
          description: 시도 횟수를 셀 수 없다. 인증 서버는 세지 않고 통과시킨다(AuthRateLimitsUnavailable). 게임 서버는 로비 비밀번호를 받지 않고(503) 채팅은 세지 않고 통과시키며, 준비 상태 확인(/health/ready)이 503 이다. docker compose ps redis 를 본다

      - alert: RedisAOFWriteFailing
        expr: redis_aof_last_write_status{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis 가 AOF 파일에 쓰지 못한다
          description: 다시 뜨면 시도 횟수와 IP 차단의 기록을 잃는다. 디스크가 찼는지 본다

      - alert: RedisEvictingKeys
        # 메모리(maxmemory 64MB)가 차서 키를 내쫓았다. 내쫓긴 것은 시도 횟수라 그만큼 제한이 느슨해진다
        expr: increase(redis_evicted_keys_total{job="redis"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Redis 가 메모리가 모자라 키를 내쫓았다
          description: 시도 횟수의 기록을 잃어 제한이 느슨해졌다. 대시보드 redis 의 "메모리"와 "사라진 키"를 보고, 키가 갑자기 늘었는지(대입 공격) 한도가 작은지 가린다

  # 디스크(#539). Alloy 안의 node_exporter 가 디스크마다 잰다(disk: system, db, observability. docker/alloy/metrics.alloy).
  # node_exporter 의 경보 묶음(node-mixin)을 따른다. 남은 비율만 보면 천천히 차는 디스크에는 일찍, 갑자기 차는 디스크에는
  # 늦게 울린다. 그래서 "지금 속도면 곧 찬다"(predict_linear, 지난 6시간의 기울기)를 함께 둔다. 읽기만 하는 디스크는 보지 않는다
  - name: disks
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{job="disks"} / node_filesystem_size_bytes{job="disks"} < 0.15
          and node_filesystem_readonly{job="disks"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.disk }} 디스크에 남은 공간이 {{ $value | humanizePercentage }} 다'
          description: 대시보드 disks 에서 언제부터 늘었는지 본다. 디스크를 키우는 법은 docs/operations/staging-vm.md 의 "그 뒤로"에 있다

      - alert: DiskSpaceCritical
        # 다 차면 그 디스크의 DB 나 저장소가 쓰기를 멈춘다
        expr: |
          node_filesystem_avail_bytes{job="disks"} / node_filesystem_size_bytes{job="disks"} < 0.05
          and node_filesystem_readonly{job="disks"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.disk }} 디스크에 남은 공간이 {{ $value | humanizePercentage }} 뿐이다'
          description: 곧 쓰기가 멈춘다. 바로 지울 것을 찾거나 디스크를 키운다(docs/operations/staging-vm.md 의 "그 뒤로")

      - alert: DiskFillingUp
        # 남은 공간이 40% 밑이고, 지난 6시간의 속도라면 24시간 안에 찬다
        expr: |
          node_filesystem_avail_bytes{job="disks"} / node_filesystem_size_bytes{job="disks"} < 0.40
          and predict_linear(node_filesystem_avail_bytes{job="disks"}[6h], 24 * 3600) < 0
          and node_filesystem_readonly{job="disks"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.disk }} 디스크가 지금 속도라면 하루 안에 찬다'
          description: 대시보드 disks 의 "하루에 느는 양"을 본다. 로그나 추적이 갑자기 늘었는지, 백업이 쌓이는지 본다

      - alert: DiskFillingUpFast
        # 남은 공간이 20% 밑이고, 지난 6시간의 속도라면 4시간 안에 찬다
        expr: |
          node_filesystem_avail_bytes{job="disks"} / node_filesystem_size_bytes{job="disks"} < 0.20
          and predict_linear(node_filesystem_avail_bytes{job="disks"}[6h], 4 * 3600) < 0
          and node_filesystem_readonly{job="disks"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.disk }} 디스크가 지금 속도라면 4시간 안에 찬다'
          description: 무엇이 쓰고 있는지 바로 본다(docker compose logs, 대시보드 disks). 멈추지 않으면 그 디스크의 서비스가 멈춘다

      - alert: DiskMetricsMissing
        # 디스크를 재지 못하면 위의 경보도 울리지 못한다. Alloy 가 멈춘 것은 MetricsCollectorDown 이 따로 알린다
        expr: absent(node_filesystem_size_bytes{job="disks", disk="system"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 디스크의 크기가 15분 동안 들어오지 않는다
          description: Alloy 의 로그에서 prometheus.exporter.unix.disks 를 본다. staging 이면 디스크의 빈 폴더(/mnt/*/probe)가 붙었는지도 본다

  # 결제 서버. 메트릭의 이름과 뜻은 docs/observability.md 의 "결제 (billing)" 표에 있다
  - name: billing-server
    rules:
      - alert: BillingDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="billing-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 결제 서버가 DB 에 닿지 못한다
          description: 결제, 홀드, 크레딧이 모두 멈춘다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: BillingServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="billing-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="billing-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="billing-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '결제 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 billing-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: BillingPaymentOutcomeUnknown
        # 결제 대행사에 묻고 답을 받지 못했다. 돈이 나갔을 수 있다. 대사(reconcile)가 끝내지만 사람이 알아야 한다
        expr: sum(increase(payment_provider_calls_total{service="billing-server", outcome="unknown"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 결제 대행사가 답하지 않은 결제가 있다
          description: 주문이 confirming 에 남아 있을 수 있다. 하루 한 번의 대사가 끝낸다. 계속되면 결제 대행사의 상태를 본다

      - alert: BillingPaymentProviderUnavailable
        expr: sum(increase(payment_provider_calls_total{service="billing-server", outcome="unavailable"}[15m])) > 3
        labels:
          severity: warning
        annotations:
          summary: 결제 대행사를 부르지 못하는 일이 지난 15분에 세 번을 넘었다
          description: 설정(PAYMENT_PROVIDER, TOSS_SECRET_KEY)이 틀렸거나 결제 대행사에 닿지 않는다. 결제 서버의 로그를 본다

      - alert: BillingLedgerRollbacks
        # expire 는 거절된 쓰기와 함께 되돌려진 것이라 뺀다(docs/observability.md 의 billing_ledger_operations_total)
        expr: sum by (reason) (increase(billing_ledger_operations_total{service="billing-server", result="failure", reason!="expire"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '원장에 적었다가 되돌린 {{ $labels.reason }} 이 있다'
          description: 크레딧은 바뀌지 않았다(되돌렸다). 같은 시각의 결제 서버 로그에서 오류를 찾는다

      - alert: BillingSweepStalled
        # 정리 작업은 30초마다 돈다. 결제 서버가 떠 있는데 10분 동안 성공이 없으면 멈췄다
        expr: |
          (sum(increase(background_jobs_finished_total{service="billing-server", operation="sweep.run", result="success"}[10m])) or vector(0)) == 0
          and on() count(db_up{service="billing-server"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 결제 서버의 정리 작업이 10분 넘게 성공하지 않았다
          description: 만료된 홀드와 주문이 돌아가지 않는다. docker compose ps billing-sweeper 와 그 로그를 본다

      - alert: BillingReconcileMissed
        # 대사는 하루 한 번 돌고 끝날 때 한 번 민다. 지난 이레 안에 돈 적이 있는데 지난 26시간에는 없으면 빠졌다.
        # 처음 띄운 PC 처럼 한 번도 돈 적이 없으면 울리지 않는다
        expr: |
          sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run"}[7d])) > 0
          unless sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run"}[26h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 하루 한 번의 대사가 26시간 동안 돌지 않았다
          description: billing-cron 의 crontab 과 로그를 본다. 결과를 모르는 주문이 끝나지 않고 쌓인다

      - alert: BillingReconcileFailed
        expr: sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run", result!="success"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: 지난 하루의 대사가 성공하지 못했다
          description: 장부의 검사가 어긋났거나 DB 에 닿지 못했다. billing-cron 의 로그(operation=reconcile.run)를 본다

  - name: notification-server
    rules:
      - alert: NotificationDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="notification-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 알림 서버가 DB 에 닿지 못한다
          description: 알림을 넣지도 읽지도 못한다. 넣는 서버들은 발송함에 쌓아 두고 다시 보낸다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: NotificationServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="notification-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="notification-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="notification-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '알림 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 notification-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: NotificationsRejected
        # 표에 없는 종류(refused)이거나 같은 열쇠의 다른 알림(conflict)이다. 넣은 서버의 버그라 다시 보내도 받지 않는다
        expr: sum by (source, outcome) (increase(notifications_received_total{service="notification-server", outcome=~"refused|conflict"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.source }} 서버가 넣은 알림을 받지 않았다({{ $labels.outcome }})'
          description: 넣은 서버의 로그(notification.rejected)와 알림 서버의 로그(notification.kind_refused)를 본다. 그 알림은 넣은 서버의 발송함에 failed 로 남는다

      - alert: NotificationPruneFailing
        # 정리 작업은 한 시간마다 돈다. 지난 세 시간의 바퀴가 실패했으면 오래된 알림이 쌓인다
        expr: sum(increase(background_jobs_finished_total{service="notification-server", operation="notification.prune", result="server_error"}[3h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 알림 서버의 정리 작업이 실패했다
          description: 보관 기간이 지난 알림이 지워지지 않는다. 알림 서버의 로그(operation=notification.prune)를 본다

  - name: trpg-server
    rules:
      - alert: TrpgDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. Redis 만 닿지 않을 때는 울리지 않는다
        expr: db_up{service="trpg-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: TRPG 서버가 DB 에 닿지 못한다
          description: 게임을 할 수 없다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: TrpgServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="trpg-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="trpg-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="trpg-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'TRPG 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 trpg-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: TrpgNarrationsFailing
        # 지난 30분의 서술이 셋 이상이고 그 가운데 20% 넘게 실패했다. 테이블이 닫는 중에 멈춰 방장이 다시 맡겨야 한다
        expr: |
          sum(increase(round_narrations_total{service="trpg-server", result="failure"}[30m]))
            / sum(increase(round_narrations_total{service="trpg-server"}[30m])) > 0.2
          and sum(increase(round_narrations_total{service="trpg-server"}[30m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '서술의 {{ $value | humanizePercentage }} 가 실패한다'
          description: 대시보드 trpg-server 의 "AI 호출"에서 실패하는 모델을 찾는다. 로그의 round.narrate 와 AI 호출 기록(ai_invocations)의 error 를 본다

      - alert: TrpgChargesNotCaptured
        # 서술한 라운드의 값을 30분 넘게 확정하지 못했다. 청구 정리가 5초마다 다시 부른다. 서버들이 같은 수를 내므로 큰 값을 본다
        expr: max(narration_charges{service="trpg-server", status="capture_due"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '확정하지 못한 서술 값이 {{ $value }} 건 있다'
          description: 결제 서버가 죽어 있거나 서명이 거절된다. BillingDatabaseUnreachable 과 대시보드 trpg-server 의 "결제 서버를 부른 것"을 본다

      - alert: TrpgBillingRejected
        # 결제 서버가 받아들이지 않았다. 그 청구는 failed 가 되어 다시 부르지 않는다. 사람이 봐야 한다
        expr: sum by (operation) (increase(billing_calls_total{service="trpg-server", outcome="rejected"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '결제 서버가 {{ $labels.operation }} 를 받아들이지 않았다'
          description: TRPG 서버의 로그(operation=billing.{{ $labels.operation }}, error_code)와 narration_charges 의 failed 청구를 본다

  - name: auth-server
    rules:
      - alert: AuthDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. 워커(gunicorn 의 프로세스)마다 하나다
        expr: db_up{service="auth-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 인증 서버가 DB 에 닿지 못한다
          description: 로그인, 가입, 토큰 갱신이 모두 멈춘다. 이미 받은 access 토큰은 다른 서버에서 만료까지 쓰인다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: AuthServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="auth-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="auth-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="auth-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '인증 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 auth-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: AuthMailWorkerStalled
        # 메일 워커는 1초마다 한 바퀴 돈다(보낼 것이 없어도 센다). 인증 서버가 떠 있는데 10분 동안 성공이 없으면 멈췄다
        expr: |
          (sum(increase(background_jobs_finished_total{service="auth-server", operation="mail.deliver_outgoing", result="success"}[10m])) or vector(0)) == 0
          and on() count(db_up{service="auth-server"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 인증 서버의 메일 워커가 10분 넘게 돌지 않았다
          description: 인증 코드와 재설정 메일이 발송함에 쌓인다. docker compose ps auth-mail 과 그 로그를 본다

      - alert: AuthMailBacklog
        # 보낼 메일은 1초 안에 나간다. 15분 동안 늘 남아 있으면 메일 서버가 받지 않아 다시 보내고 있다
        expr: max(background_jobs_queued{service="auth-server", operation="mail.deliver_outgoing"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '발송함에 메일이 15분 넘게 {{ $value }} 통 남아 있다'
          description: 관리 화면의 발송함(마지막 오류)과 auth-mail 의 로그(operation=mail.deliver_outgoing), 메일 서버(SMTP_HOST)를 본다

      - alert: AuthMailDiscarded
        # 다시 보내다 버렸거나 본문을 읽을 수 없어 버렸다. 받는 사람은 그 메일을 받지 못했다
        expr: sum by (kind) (increase(emails_sent_total{service="auth-server", result="discarded"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.kind }} 메일을 버렸다'
          description: 관리 화면의 발송함(버림)과 auth-mail 의 로그(operation=mail.deliver_outgoing, error)를 본다

      - alert: AuthRateLimitsUnavailable
        # Redis 에 묻지 못해 시도 횟수를 세지 않고 통과시켰다. 그동안 비밀번호 대입을 막지 못한다
        expr: sum by (limit) (increase(auth_rate_limits_unavailable_total{service="auth-server"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '시도 횟수 제한 {{ $labels.limit }} 을 세지 못하고 통과시켰다'
          description: RedisDown 이 함께 울렸으면 Redis 쪽부터 본다. 아니면 인증 서버의 로그("시도 횟수를 셀 수 없어")를 본다

  - name: board-server
    rules:
      - alert: BoardDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="board-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 게시판 서버가 DB 에 닿지 못한다
          description: 글을 읽지도 쓰지도 못한다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: BoardServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="board-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="board-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="board-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '게시판 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 board-server 의 "상태 코드"와 로그의 error_code 를 본다. 멈춘 검색(503)도 여기에 든다

      - alert: BoardSearchTimeouts
        # 검색이 정해 둔 시간(3초)을 넘겨 멈췄다. 한두 번은 엉뚱한 검색어다. 15분에 셋을 넘으면 글이 많아 훑기가 느리다
        expr: sum(increase(board_searches_total{service="board-server", result="timeout"}[15m])) > 3
        labels:
          severity: warning
        annotations:
          summary: '지난 15분에 검색이 {{ $value }} 번 멈췄다'
          description: 대시보드 board-server 의 "검색이 걸린 시간"을 본다. 늘면 색인이나 검색 엔진이 필요하다(board-server/README.md 의 설계 메모)

      - alert: BoardNotificationRoundsFailing
        # 발송함의 알림을 보내는 바퀴(5초마다)가 통째로 실패했다. 알림 서버가 죽은 것은 바퀴 안에서 다시 보낼 것으로 남아 여기에 들지 않는다
        expr: sum(increase(background_jobs_finished_total{service="board-server", operation="notification.send", result="server_error"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 게시판 서버의 알림 보내기가 실패하고 있다
          description: 댓글과 답글의 알림이 발송함에 쌓인다. 게시판 서버의 로그(operation=notification.send, error_code=job.failed)를 본다

  # asset 서버. 업무의 메트릭이 붙으면 그 경보를 이 묶음에 더한다
  - name: asset-server
    rules:
      - alert: AssetDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="asset-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: asset 서버가 DB 에 닿지 못한다
          description: 페르소나, 캐릭터, 그림을 읽지도 쓰지도 못한다. 다른 서버가 테이블이나 대화를 새로 만들 때 자산을 가져오지 못한다(이미 가져온 것으로 도는 것은 그대로다). PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: AssetServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="asset-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="asset-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="asset-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'asset 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 asset-server 의 "상태 코드"와 로그의 error_code 를 본다

  # chat 서버. 업무의 메트릭이 붙으면 그 경보를 이 묶음에 더한다
  - name: chat-server
    rules:
      - alert: ChatDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="chat-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: chat 서버가 DB 에 닿지 못한다
          description: 대화를 읽지도 쓰지도 못한다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: ChatServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="chat-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="chat-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="chat-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'chat 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 chat-server 의 "상태 코드"와 로그의 error_code 를 본다

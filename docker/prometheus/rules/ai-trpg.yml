# docker/prometheus/rules/ai-trpg.yml
# 경보 규칙(#25). Prometheus 가 15초마다 평가하고, 울린 경보를 Alertmanager 로 넘긴다(docker/prometheus/prometheus.yml).
# Alertmanager 가 Discord, Slack, Telegram, 메일로 보낸다(docker/alertmanager).
#
# Prometheus 의 규칙 파일 모양이다. 저장소를 Mimir 로 바꾸면 Mimir 의 ruler 가 이 파일을 그대로 읽는다.
# 규칙마다의 시험은 tests/ai-trpg.test.yml 에 있다(promtool test rules). 규칙을 고치면 시험도 고친다.
#
# label severity:
#   critical  지금 사용자가 못 쓰거나 데이터를 잃을 수 있다. 바로 본다
#   warning   곧 문제가 되거나 사람이 확인할 일이 있다. 그날 안에 본다
#   none      사람에게 보내지 않는다. Watchdog 하나다(바깥 감시에만 간다)
# annotation summary 는 한 줄, description 은 무엇을 볼지다. 둘 다 받는 곳(Discord 등)에 그대로 실린다.
# 서버의 경보는 service, 인프라의 경보는 job 으로 거른다(대시보드와 같은 규칙. docs/observability.md 의 "대시보드").

groups:
  # 경보를 내는 쪽 자신. Watchdog 은 늘 울린다. Alertmanager 가 바깥 감시(ALERT_HEARTBEAT_WEBHOOK_URL)에만 1분마다 보낸다.
  # 신호가 끊기면 바깥 감시가 알린다(Prometheus, Alertmanager, PC 나 VM, 인터넷 가운데 하나가 멈췄다). 운영자의 받는 곳에는 가지 않는다
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 경보를 내는 길이 살아 있다(늘 울린다)
          description: 바깥 감시에만 간다. 이 경보가 Grafana 에 없으면 Prometheus 가 규칙을 돌리지 못한다

      - alert: AlertDeliveryFailing
        # 받는 곳 가운데 하나로 보내지 못했다(웹후크를 지웠다, 메일의 비밀번호가 틀렸다). 나머지 받는 곳으로 이 경보가 간다.
        # webhook 은 바깥 감시다. 끊기면 바깥 감시가 따로 알린다
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{job="alertmanager", integration!="webhook"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '경보를 {{ $labels.integration }} 로 보내지 못하고 있다'
          description: docker compose --profile observability logs alertmanager 에서 그 받는 곳의 오류를 본다. 루트 .env 의 ALERT_* 를 고친 뒤 alertmanager 를 다시 만든다

  # 메트릭을 모으는 길 자체. 이것이 멈추면 다른 경보도 울리지 못한다
  - name: collectors
    rules:
      - alert: MetricsCollectorDown
        # Alloy 는 제 메트릭을 긁어 보낸다. 받기만 하는 Prometheus 는 마지막 값을 5분 동안 살아 있는 것으로 본다.
        # 그래서 Alloy 가 멈추고 10분쯤 뒤에 울린다
        expr: absent(up{job="alloy"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 수집기(Alloy)의 메트릭이 들어오지 않는다
          description: 서버, DB, Redis 의 메트릭이 모두 끊겼을 수 있다. docker compose ps alloy 와 Alloy 의 로그를 본다

      - alert: ObservabilityComponentDown
        expr: up{job=~"loki|tempo|grafana|alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 에 5분 동안 닿지 않는다'
          description: 로그 모으기(loki), 추적 모으기(tempo), 화면(grafana), 경보 보내기(alertmanager) 가운데 하나다. 그 컨테이너의 로그를 본다

  # DB(PostgreSQL)와 Redis. Alloy 안의 exporter 가 읽는다(docker/alloy/metrics.alloy)
  - name: datastores
    rules:
      - alert: PostgresDown
        # exporter 가 붙지 못한다. DB 가 죽었거나 monitor 계정, 비밀번호, 망이 틀렸다
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DB(PostgreSQL)에 붙지 못한다
          description: 서버들이 함께 DB 를 잃었을 수 있다. docker compose ps db 를 본다. DB 가 살아 있으면 MONITOR_DB_PASSWORD 와 monitor 계정을 본다

      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count{job="postgres"}) / max(pg_settings_max_connections{job="postgres"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'DB 연결이 max_connections 의 {{ $value | humanizePercentage }} 다'
          description: 서버들의 연결 풀의 합이 한도에 가깝다. 닿으면 새 연결이 거절된다. 대시보드 postgres 의 "상태마다의 연결"을 본다

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgres", datname="trpg"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 지난 10분 동안 DB 에 교착이 있었다
          description: PostgreSQL 이 트랜잭션 하나를 되돌려 풀었다. 같은 시각의 서버 로그에서 오류(error_code)를 찾는다

      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis 에 붙지 못한다
          description: 시도 횟수 제한이 서버의 메모리로 넘어가거나(게임) 꺼진다(인증). docker compose ps redis 를 본다

      - alert: RedisAOFWriteFailing
        expr: redis_aof_last_write_status{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis 가 AOF 파일에 쓰지 못한다
          description: 다시 뜨면 시도 횟수와 IP 차단의 기록을 잃는다. 디스크가 찼는지 본다

  # 결제 서버. 메트릭의 이름과 뜻은 docs/observability.md 의 "결제 (billing)" 표에 있다
  - name: billing-server
    rules:
      - alert: BillingDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="billing-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 결제 서버가 DB 에 닿지 못한다
          description: 결제, 홀드, 크레딧이 모두 멈춘다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: BillingServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="billing-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="billing-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="billing-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '결제 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 billing-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: BillingPaymentOutcomeUnknown
        # 결제 대행사에 묻고 답을 받지 못했다. 돈이 나갔을 수 있다. 대사(reconcile)가 끝내지만 사람이 알아야 한다
        expr: sum(increase(payment_provider_calls_total{service="billing-server", outcome="unknown"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 결제 대행사가 답하지 않은 결제가 있다
          description: 주문이 confirming 에 남아 있을 수 있다. 하루 한 번의 대사가 끝낸다. 계속되면 결제 대행사의 상태를 본다

      - alert: BillingPaymentProviderUnavailable
        expr: sum(increase(payment_provider_calls_total{service="billing-server", outcome="unavailable"}[15m])) > 3
        labels:
          severity: warning
        annotations:
          summary: 결제 대행사를 부르지 못하는 일이 지난 15분에 세 번을 넘었다
          description: 설정(PAYMENT_PROVIDER, TOSS_SECRET_KEY)이 틀렸거나 결제 대행사에 닿지 않는다. 결제 서버의 로그를 본다

      - alert: BillingLedgerRollbacks
        # expire 는 거절된 쓰기와 함께 되돌려진 것이라 뺀다(docs/observability.md 의 billing_ledger_operations_total)
        expr: sum by (reason) (increase(billing_ledger_operations_total{service="billing-server", result="failure", reason!="expire"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '원장에 적었다가 되돌린 {{ $labels.reason }} 이 있다'
          description: 크레딧은 바뀌지 않았다(되돌렸다). 같은 시각의 결제 서버 로그에서 오류를 찾는다

      - alert: BillingSweepStalled
        # 정리 작업은 30초마다 돈다. 결제 서버가 떠 있는데 10분 동안 성공이 없으면 멈췄다
        expr: |
          (sum(increase(background_jobs_finished_total{service="billing-server", operation="sweep.run", result="success"}[10m])) or vector(0)) == 0
          and on() count(db_up{service="billing-server"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 결제 서버의 정리 작업이 10분 넘게 성공하지 않았다
          description: 만료된 홀드와 주문이 돌아가지 않는다. docker compose ps billing-sweeper 와 그 로그를 본다

      - alert: BillingReconcileMissed
        # 대사는 하루 한 번 돌고 끝날 때 한 번 민다. 지난 이레 안에 돈 적이 있는데 지난 26시간에는 없으면 빠졌다.
        # 처음 띄운 PC 처럼 한 번도 돈 적이 없으면 울리지 않는다
        expr: |
          sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run"}[7d])) > 0
          unless sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run"}[26h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 하루 한 번의 대사가 26시간 동안 돌지 않았다
          description: billing-cron 의 crontab 과 로그를 본다. 결과를 모르는 주문이 끝나지 않고 쌓인다

      - alert: BillingReconcileFailed
        expr: sum(last_over_time(background_jobs_finished_total{service="billing-server", operation="reconcile.run", result!="success"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: 지난 하루의 대사가 성공하지 못했다
          description: 장부의 검사가 어긋났거나 DB 에 닿지 못했다. billing-cron 의 로그(operation=reconcile.run)를 본다

  - name: notification-server
    rules:
      - alert: NotificationDatabaseUnreachable
        # 준비 상태 확인(/health/ready)이 마지막으로 본 DB. compose 의 healthcheck 가 10초마다 부른다
        expr: db_up{service="notification-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 알림 서버가 DB 에 닿지 못한다
          description: 알림을 넣지도 읽지도 못한다. 넣는 서버들은 발송함에 쌓아 두고 다시 보낸다. PostgresDown 이 함께 울렸으면 DB 쪽부터 본다

      - alert: NotificationServerErrors
        # 요청이 아주 적을 때(분당 3번 미만)의 한두 번은 세지 않는다
        expr: |
          sum(rate(http_server_requests_total{service="notification-server", status_code=~"5.."}[5m]))
            / sum(rate(http_server_requests_total{service="notification-server"}[5m])) > 0.05
          and sum(rate(http_server_requests_total{service="notification-server"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '알림 서버의 5xx 가 {{ $value | humanizePercentage }} 다'
          description: 대시보드 notification-server 의 "상태 코드"와 로그의 error_code 를 본다

      - alert: NotificationsRejected
        # 표에 없는 종류(refused)이거나 같은 열쇠의 다른 알림(conflict)이다. 넣은 서버의 버그라 다시 보내도 받지 않는다
        expr: sum by (source, outcome) (increase(notifications_received_total{service="notification-server", outcome=~"refused|conflict"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.source }} 서버가 넣은 알림을 받지 않았다({{ $labels.outcome }})'
          description: 넣은 서버의 로그(notification.rejected)와 알림 서버의 로그(notification.kind_refused)를 본다. 그 알림은 넣은 서버의 발송함에 failed 로 남는다

      - alert: NotificationPruneFailing
        # 정리 작업은 한 시간마다 돈다. 지난 세 시간의 바퀴가 실패했으면 오래된 알림이 쌓인다
        expr: sum(increase(background_jobs_finished_total{service="notification-server", operation="notification.prune", result="server_error"}[3h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 알림 서버의 정리 작업이 실패했다
          description: 보관 기간이 지난 알림이 지워지지 않는다. 알림 서버의 로그(operation=notification.prune)를 본다

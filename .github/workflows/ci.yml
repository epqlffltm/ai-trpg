# .github/workflows/ci.yml
# PR 의 관문. 바뀐 파일을 보고 그 서버의 CI 만 부른 뒤, 결과를 ci-ok 하나로 모은다.
#
# main 의 보호 규칙은 필수 검사로 ci-ok 하나만 건다.
# 서버의 CI 넷을 따로 필수로 걸 수 없다. 서버마다 자기 폴더가 바뀔 때만 도는데, 돌지 않은 검사를
# GitHub 은 "기다리는 중"으로 두고 머지를 막는다. 게시판만 고친 PR 이 게임 CI 를 영영 기다리게 된다.
# 관문은 PR 마다 늘 돌고, 부르지 않은 서버는 "건너뜀"이다. ci-ok 는 건너뜀을 통과로 친다.
#
# 서버의 CI 는 각자의 파일(auth-server.yml 등)에 그대로 있다. 관문은 고르고 모을 뿐이다.
# 서버를 더하면 이 파일에 작업 하나와 ci-ok 의 needs 하나, 고르는 스크립트에 이름 하나를 더한다. 화면(web/)도 같다.
#
# 서버가 하나라도 바뀌면 stack 이 모든 서버를 컨테이너로 함께 띄워 본다(이미지, 마이그레이션, 서로 닿는가).

name: ci

on:
  pull_request:

# 이 워크플로는 저장소를 읽기만 한다. 필요한 권한만 준다
permissions:
  contents: read

# 같은 PR 에 새로 푸시하면 앞의 검사는 멈춘다. 결과를 볼 일이 없다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      auth: ${{ steps.pick.outputs.auth }}
      trpg: ${{ steps.pick.outputs.trpg }}
      board: ${{ steps.pick.outputs.board }}
      billing: ${{ steps.pick.outputs.billing }}
      notification: ${{ steps.pick.outputs.notification }}
      asset: ${{ steps.pick.outputs.asset }}
      chat: ${{ steps.pick.outputs.chat }}
      story: ${{ steps.pick.outputs.story }}
      shared: ${{ steps.pick.outputs.shared }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      # PR 이 갈라져 나온 곳을 찾으려면 기록이 있어야 한다
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 고르는 규칙이 틀리면 깨진 서버를 건너뛰고 초록이 된다. 고르기 전에 규칙부터 검사한다
      - name: 고르는 규칙 검사
        run: bash .github/scripts/changed-servers.test.sh

      - name: 바뀐 서버 고르기
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/scripts/changed-servers.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  auth-server:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    uses: ./.github/workflows/auth-server.yml

  trpg-server:
    needs: changes
    if: needs.changes.outputs.trpg == 'true'
    uses: ./.github/workflows/trpg-server.yml

  board-server:
    needs: changes
    if: needs.changes.outputs.board == 'true'
    uses: ./.github/workflows/board-server.yml

  billing-server:
    needs: changes
    if: needs.changes.outputs.billing == 'true'
    uses: ./.github/workflows/billing-server.yml

  notification-server:
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    uses: ./.github/workflows/notification-server.yml

  asset-server:
    needs: changes
    if: needs.changes.outputs.asset == 'true'
    uses: ./.github/workflows/asset-server.yml

  chat-server:
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    uses: ./.github/workflows/chat-server.yml

  story-server:
    needs: changes
    if: needs.changes.outputs.story == 'true'
    uses: ./.github/workflows/story-server.yml

  # 공용 코드(shared/). 쓰는 서버의 CI 는 위에서 따로 불린다(changed-servers.sh 가 경로 의존을 읽어 고른다)
  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    uses: ./.github/workflows/shared.yml

  # 화면(web/, #290). 타입 검사, 린트, 단위 시험, 빌드, API 목록에서 만든 타입이 지금의 목록과 같은가
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  # 서버 폴더 밖의 파이썬(tools/, .github/scripts/, docker/ 의 검사 스크립트)을 ruff 로 본다. 규칙은 저장소 루트의 ruff.toml 이다.
  # 서버의 CI 는 제 폴더만 보므로 이 파일들은 여기서만 본다. 몇 초면 끝나서 PR 마다 늘 돈다(도구만 고친 PR 은 서버를 고르지 않는다).
  # 고를 파일은 git 이 아는 *.py 에서 서버 폴더(*-server/)를 뺀 것이다. 새 폴더(shared/ 등)는 저절로 들어온다.
  # 파일이 없을 때 ruff 가 인자 없이 돌면 저장소 전체(서버 포함)를 보므로 --no-run-if-empty 로 막는다
  repo-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 서버들의 uv.lock 에 든 ruff 와 같은 판. 서버가 판을 올리면 여기도 올린다(CONTRIBUTING.md 의 명령도)
      RUFF_VERSION: 0.17.1
    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      # 쓰지 않는 import, 정의되지 않은 이름, 줄 길이 같은 문제를 실행하지 않고 찾는다
      - name: 린트
        run: git ls-files -z '*.py' ':(exclude)*-server/*' | xargs -0 --no-run-if-empty uvx "ruff@$RUFF_VERSION" check

      # 모양을 고치지 않고 검사만 한다. 어긋나면 실패한다
      - name: 모양 검사
        run: git ls-files -z '*.py' ':(exclude)*-server/*' | xargs -0 --no-run-if-empty uvx "ruff@$RUFF_VERSION" format --check

      # 서버 폴더 밖의 도구(tools/)와 설정 검사(.github/scripts/)의 시험. 표준 라이브러리만 써서 몇 초면 끝난다.
      # 도구만 고친 PR 은 서버를 고르지 않아 stack 이 돌지 않으므로 여기서 늘 돌린다
      - name: 도구와 설정 검사의 시험
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # 서버마다의 API 목록(docs/api/<서버>.openapi.json, #557)이 지금의 서버와 같은지 본다.
  # 화면의 타입과 디자인 도구에 넘길 목록이라, 서버의 API 를 바꾸고 목록을 새로 뽑지 않으면 실패한다.
  # 목록을 내는 서버(tools/export_openapi.py 의 SOURCES) 가운데 하나라도 고르면 돈다. 서버마다 uv 의 환경을 만들어 앱을 불러온다.
  # 결제 서버는 Go 로 손으로 쓴 목록(billing-server/api/openapi.yaml)을 읽는다. 목록이 코드와 맞는지는 결제 서버의 테스트가 본다.
  # 인증 서버는 manage.py spectacular 로 뷰에 적은 모양에서 만든다. 응답이 그 모양과 맞는지는 인증 서버의 테스트가 본다
  api-docs:
    needs: changes
    if: >-
      needs.changes.outputs.trpg == 'true' || needs.changes.outputs.notification == 'true' ||
      needs.changes.outputs.billing == 'true' || needs.changes.outputs.asset == 'true' ||
      needs.changes.outputs.auth == 'true' || needs.changes.outputs.board == 'true' ||
      needs.changes.outputs.chat == 'true' || needs.changes.outputs.story == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      # 결제 서버의 목록을 읽는 명령을 돌린다. 결제 서버의 CI 와 같은 버전이다
      - name: Go 설치
        uses: actions/setup-go@v7
        with:
          go-version-file: billing-server/go.mod
          cache-dependency-path: billing-server/go.sum

      # 게시판 서버의 목록은 빌드한 코드에서 뽑는다(npm run openapi). 게시판 서버의 CI 와 같은 Node 다
      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: board-server/.nvmrc
          cache: npm
          cache-dependency-path: board-server/package-lock.json

      - name: 게시판 서버의 의존성 설치
        working-directory: board-server
        run: npm ci

      - name: API 목록이 서버와 같은가
        run: uv run --no-project python tools/export_openapi.py --check

  # 모든 서버의 이미지를 만들어 compose 로 함께 띄워 본다. 서버의 기능은 위의 작업들이 보고, 이것은
  # "이미지가 만들어지고, 마이그레이션이 돌고, 서버가 뜨고, 서로 닿고, 프록시가 주소를 나누고 막는가"만 본다.
  # 한 서버만 바뀌어도 모두 띄운다. 한 서버만 띄워서는 서로 닿는지 볼 수 없다.
  # 화면만 바뀌어도 띄운다. 프록시의 이미지가 화면을 담고, 프록시가 화면과 API 를 나누는지 본다.
  # 설정과 키는 이 실행에서만 쓰고 버리는 값으로 만든다(.github/scripts/stack-smoke.sh).
  # story 서버는 아직 compose 에 없다(#591). compose 에 붙일 때 아래 조건과 stack-smoke.sh 에 더한다
  stack:
    needs: changes
    if: >-
      needs.changes.outputs.auth == 'true' || needs.changes.outputs.trpg == 'true' ||
      needs.changes.outputs.board == 'true' || needs.changes.outputs.billing == 'true' ||
      needs.changes.outputs.notification == 'true' || needs.changes.outputs.asset == 'true' ||
      needs.changes.outputs.chat == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 설정 파일과 키 만들기
        run: bash .github/scripts/stack-smoke.sh prepare

      - name: 이미지를 만들고 띄우기
        run: bash .github/scripts/stack-smoke.sh up

      - name: 확인
        run: bash .github/scripts/stack-smoke.sh check

      # 요청 수 제한을 채우므로 확인의 맨 마지막에 둔다
      - name: 프록시를 거쳐 확인
        run: bash .github/scripts/stack-smoke.sh check-proxy

      # staging(VM)의 설정(docker-compose.staging.yml, #451). staging 의 프록시를 하나 더 띄워 HTTPS 로 본다
      - name: staging 의 설정 확인
        run: bash .github/scripts/stack-smoke.sh check-staging

      - name: 실패했을 때 로그
        if: failure()
        run: bash .github/scripts/stack-smoke.sh logs

      - name: 정리
        if: always()
        run: bash .github/scripts/stack-smoke.sh down

  # 필수 검사는 이것 하나다. 앞의 작업이 하나라도 실패하거나 멈췄으면 실패한다. 건너뛴 것은 통과다.
  # always(): 앞의 작업이 실패해도 이 작업은 돈다. 돌지 않으면 GitHub 이 "기다리는 중"으로 둔다
  ci-ok:
    if: always()
    needs:
      - changes
      - repo-python
      - api-docs
      - auth-server
      - trpg-server
      - board-server
      - billing-server
      - notification-server
      - asset-server
      - chat-server
      - story-server
      - shared
      - web
      - stack
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 결과 모으기
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "통과하지 못한 검사가 있다: $result"; exit 1 ;;
            esac
          done

# .github/workflows/billing-server.yml
# 결제 서버의 CI. PR 과 main 푸시마다 의존성, 모양, 정적 검사, 만들어진 코드, 빌드, 마이그레이션, 테스트를 검사한다.
#
# 서버마다 워크플로 파일을 따로 둔다. 서버별로 의존성과 검사 항목이 다르고,
# 한 서버만 고친 PR 에서 다른 서버의 검사까지 돌릴 이유가 없다.

name: billing-server

on:
  pull_request:
    paths:
      - "billing-server/**"
      - "docker/postgres/init/**"
      - ".github/workflows/billing-server.yml"
  push:
    branches: [main]
    paths:
      - "billing-server/**"
      - "docker/postgres/init/**"
      - ".github/workflows/billing-server.yml"

# 이 워크플로는 저장소를 읽기만 한다. 필요한 권한만 준다
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # docker-compose.yml 과 같은 이미지를 쓴다
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: ci-root-password
          POSTGRES_DB: trpg
        ports:
          - 5432:5432
        # 접속을 받을 때까지 기다린 뒤 다음 단계로 넘어간다
        options: >-
          --health-cmd "pg_isready -U trpg -d trpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # CI 전용 값. 이 실행이 끝나면 사라지는 DB 에만 쓰이므로 비밀값이 아니다.
    # .env 파일 없이 환경 변수만으로 설정을 읽는다
    env:
      AUTH_DB_PASSWORD: ci-auth-password
      GAME_DB_PASSWORD: ci-game-password
      BILLING_DB_PASSWORD: ci-billing-password
      DATABASE_URL: postgres://billing:ci-billing-password@127.0.0.1:5432/trpg
      # 필수 설정이라 적는다. CI 에는 인증 서버가 없고, 테스트는 가짜 인증 서버를 쓴다.
      # 이 주소로는 요청이 가지 않는다
      AUTH_JWKS_URL: http://127.0.0.1:8000/api/v1/auth/jwks

    defaults:
      run:
        working-directory: billing-server

    steps:
      - uses: actions/checkout@v7

      # 로컬과 같은 초기화 스크립트로 계정과 스키마를 만든다.
      # 슈퍼유저로 테스트하면 로컬에서 권한 때문에 실패할 코드가 CI 를 통과한다.
      # auth 와 game 스키마도 만든다. 결제 계정이 그 스키마에 들어가지 못하는지 테스트가 확인한다.
      # 04 가 개발용(billing)과 테스트용(billing_test) 스키마를 함께 만든다
      - name: DB 계정과 스키마 만들기
        working-directory: .
        env:
          PGPASSWORD: ci-root-password
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/01-auth-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/02-game-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/04-billing-role.sql

      # go.mod 에 적힌 버전의 Go 를 깐다. 받은 의존성은 go.sum 을 열쇠로 캐시한다
      - name: Go 설치
        uses: actions/setup-go@v7
        with:
          go-version-file: billing-server/go.mod
          cache-dependency-path: billing-server/go.sum

      # go.mod 와 go.sum 이 코드와 어긋나면 실패한다. 고치지 않고 차이만 본다
      - name: 의존성 목록 검사
        run: go mod tidy -diff

      # 모양을 고치지 않고 검사만 한다. 어긋난 파일이 있으면 이름을 찍고 실패한다
      - name: 모양 검사
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      # 흔한 실수(잘못된 형식 문자열, 닿지 않는 코드, 복사된 잠금 등)를 실행하지 않고 찾는다
      - name: 정적 검사
        run: go vet ./...

      # SQL 에서 Go 코드를 만드는 도구. 로컬에서 쓰는 것과 같은 버전을 받는다
      - name: sqlc 설치
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      # 커밋된 코드(walletdb, orderdb, holddb, reconciledb, pricingdb)가 SQL 과 어긋나면 실패한다. 고치지 않고 차이만 본다.
      # SQL 만 고치고 코드를 다시 만들지 않은 채 올리는 일을 막는다
      - name: 만들어진 코드 검사
        run: sqlc diff

      - name: 빌드
        run: go build ./...

      # 개발용 스키마(billing)에 적용하고, 마지막 것을 되돌리고, 다시 적용한다.
      # 되돌리는 SQL 이 틀렸으면 여기서 드러난다. 테스트는 테스트용 스키마를 쓰므로 서로 부딪치지 않는다
      - name: 마이그레이션 적용과 되돌리기
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up
          go run ./cmd/migrate status

      # 정리 작업과 대사가 실제 DB 에서 뜨고 끝까지 도는지 본다. 서버의 비밀이 없어도 돌아야 한다.
      # 막 만든 스키마라 대사는 맞지 않는 줄이 없어야 한다(끝 코드 0)
      - name: 정리 작업과 대사
        run: |
          go run ./cmd/sweeper -once
          go run ./cmd/reconcile

      # -count=1 은 캐시된 결과를 쓰지 않고 매번 실제로 돌린다. DB 를 쓰는 테스트가 있다.
      # -race 는 두 흐름이 같은 값을 동시에 건드리면 실패하게 한다. 공개키 캐시를 여러 요청이 함께 쓴다.
      # 테이블을 쓰는 테스트는 테스트용 스키마(billing_test)에 마이그레이션을 스스로 적용하고 돈다.
      # -timeout 은 멈춘 테스트를 기본값(10분)까지 기다리지 않고 끊는다
      - name: 테스트
        run: go test -count=1 -race -timeout 120s ./...

# .github/workflows/game-server.yml
# 게임 서버의 CI. PR 과 main 푸시마다 린트, 모양, 마이그레이션, 테스트를 검사한다.
#
# 서버마다 워크플로 파일을 따로 둔다. 서버별로 의존성과 검사 항목이 다르고,
# 한 서버만 고친 PR 에서 다른 서버의 검사까지 돌릴 이유가 없다.
#
# PR 에서는 관문(.github/workflows/ci.yml)이 바뀐 파일을 보고 이 워크플로를 부른다.
# 고르는 규칙은 .github/scripts/changed-servers.sh 에 있다. 검사할 것을 바꾸면 이 파일만 고친다.
#
# 테스트가 3000 개를 넘어 한 작업으로 돌리면 오래 걸린다. 관련 있는 테스트끼리 묶어(scripts/ci_groups.py)
# 묶음마다 작업 하나로 동시에 돌린다. 작업마다 자기 PostgreSQL 과 Redis 를 띄우므로 서로의 데이터가 섞이지 않는다.
#
#   checks      린트, 모양, 의존성 취약점, 마이그레이션(한 번만)
#   groups      묶음의 이름을 읽는다
#   test        묶음마다 하나. 테스트를 돌리고 지나간 줄을 센 파일을 남긴다
#   coverage    묶음들의 파일을 합쳐 커버리지를 요약하고 기준을 본다

name: game-server

on:
  # PR 에서는 관문(ci.yml)이 바뀐 서버를 골라 이 워크플로를 부른다. 필수 검사는 관문의 ci-ok 하나다
  workflow_call:
  # main 에 들어간 뒤에는 이 서버가 바뀐 경우에만 스스로 돈다. README 의 배지가 이 결과를 보여 준다
  push:
    branches: [main]
    paths:
      - "game-server/**"
      - "docker/postgres/init/**"
      - ".github/workflows/game-server.yml"

# 이 워크플로는 저장소를 읽기만 한다. 필요한 권한만 준다
permissions:
  contents: read

# CI 전용 값. 이 실행이 끝나면 사라지는 DB 에만 쓰이므로 비밀값이 아니다.
# .env 파일 없이 환경 변수만으로 설정을 읽는다
env:
  AUTH_DB_PASSWORD: ci-auth-password
  GAME_DB_PASSWORD: ci-game-password
  BILLING_DB_PASSWORD: ci-billing-password
  BOARD_DB_PASSWORD: ci-board-password
  DATABASE_URL: postgresql+asyncpg://game:ci-game-password@127.0.0.1:5432/trpg
  # 필수 설정이라 적는다. CI 에는 인증 서버가 없고, 테스트는 가짜 인증 서버를 쓴다.
  # 이 주소로는 요청이 가지 않는다
  AUTH_JWKS_URL: http://127.0.0.1:8000/api/v1/auth/jwks

jobs:
  # 테스트와 상관없는 검사. 묶음마다 되풀이하지 않고 한 번만 한다. 테스트와 동시에 돈다
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # docker-compose.yml 과 같은 이미지를 쓴다
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: ci-root-password
          POSTGRES_DB: trpg
        ports:
          - 5432:5432
        # 접속을 받을 때까지 기다린 뒤 다음 단계로 넘어간다
        options: >-
          --health-cmd "pg_isready -U trpg -d trpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: game-server

    steps:
      - uses: actions/checkout@v7

      # 로컬과 같은 초기화 스크립트로 계정과 스키마를 만들고 pgvector 를 켠다.
      # 슈퍼유저로 테스트하면 로컬에서 권한 때문에 실패할 코드가 CI 를 통과한다.
      # 다른 서버의 계정과 스키마(auth, billing, board)도 만든다. 게임 계정이 그 스키마에 닿지 못하는지 테스트가 확인한다
      - name: DB 계정과 스키마 만들기
        working-directory: .
        env:
          PGPASSWORD: ci-root-password
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/01-auth-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/02-game-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/03-extensions.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/04-billing-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/05-board-role.sql

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # uv.lock 과 pyproject.toml 이 어긋나면 실패한다
      - name: 의존성 설치
        run: uv sync --locked

      # 쓰지 않는 import, 정의되지 않은 이름 같은 문제를 실행하지 않고 찾는다
      - name: 린트
        run: uv run ruff check .

      # 모양을 고치지 않고 검사만 한다. 어긋나면 실패한다
      - name: 모양 검사
        run: uv run ruff format --check .

      # 운영 이미지에 들어가는 의존성(dev 제외)에 알려진 취약점이 있으면 실패한다.
      # uv.lock 에 잠긴 그대로를 해시와 함께 넘긴다. 받아들이기로 한 것은 --ignore-vuln 에 까닭과 함께 적는다
      - name: 의존성 취약점 검사
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off

      # 마이그레이션의 끝(head)을 찍기만 한다. 끝이 여럿이어도 실패하지 않는다.
      # 여러 PR 이 같은 부모 위에 따로 마이그레이션을 얹는 일이 잦아 끝을 하나로 강제하지 않는다. 적용은 upgrade heads 로 모두 한다
      - name: 마이그레이션 끝
        run: uv run alembic heads

      # 빈 DB 에 마이그레이션을 처음부터 모든 끝까지 적용할 수 있는지 본다
      - name: 마이그레이션 적용
        run: uv run alembic upgrade heads

      # 모델을 바꾸고 마이그레이션을 만들지 않았으면 실패한다
      - name: 마이그레이션 누락 검사
        run: uv run alembic check

  # 테스트의 묶음을 읽는다. 묶음은 scripts/ci_groups.py 한 곳에만 적는다. 이 파일에 이름을 다시 적지 않는다
  groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.read.outputs.names }}

    defaults:
      run:
        working-directory: game-server

    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      # 표준 라이브러리만 쓰는 스크립트라 의존성을 설치하지 않는다
      - name: 묶음 읽기
        id: read
        run: |
          echo "names=$(uv run --no-project python -m scripts.ci_groups json)" >> "$GITHUB_OUTPUT"
          uv run --no-project python -m scripts.ci_groups summary >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: groups
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    # 한 묶음은 PC 에서 2~3 분이다. 멈춘 테스트를 하염없이 기다리지 않게 하려는 상한이다
    timeout-minutes: 15

    strategy:
      # 한 묶음이 실패해도 나머지는 끝까지 돌린다. 어느 묶음에서 무엇이 깨졌는지 한 번에 본다
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.names) }}

    services:
      # docker-compose.yml 과 같은 이미지를 쓴다
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: ci-root-password
          POSTGRES_DB: trpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trpg -d trpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # 시도 횟수 제한의 테스트가 실제 Redis 에서 돈다(tests/test_attempt_limits.py, 15 번 DB)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: game-server

    steps:
      - uses: actions/checkout@v7

      - name: DB 계정과 스키마 만들기
        working-directory: .
        env:
          PGPASSWORD: ci-root-password
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/01-auth-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/02-game-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/03-extensions.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/04-billing-role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trpg -d trpg -f docker/postgres/init/05-board-role.sql

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked

      # 테스트는 game_test 스키마에서 돈다. 그 스키마에 테이블을 만든다
      - name: 테스트용 스키마에 마이그레이션 적용
        env:
          DB_SCHEMA: game_test
        run: uv run alembic upgrade heads

      # 이 묶음의 파일만 돌리며 지나간 줄을 센다. 재는 대상은 pyproject.toml 의 [tool.coverage.run] 이다.
      # 센 파일은 묶음의 이름을 붙여 남긴다. 합치는 것은 coverage 작업이다
      - name: 테스트
        env:
          GROUP: ${{ matrix.group }}
        run: |
          read -ra files <<< "$(uv run --no-project python -m scripts.ci_groups files "$GROUP")"
          uv run pytest --cov --cov-report= "${files[@]}"
          mv .coverage "coverage-$GROUP.data"

      - name: 지나간 줄을 센 파일 남기기
        uses: actions/upload-artifact@v4
        with:
          name: game-coverage-${{ matrix.group }}
          path: game-server/coverage-${{ matrix.group }}.data
          retention-days: 1
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: game-server

    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked

      - name: 묶음들의 파일 받기
        uses: actions/download-artifact@v4
        with:
          pattern: game-coverage-*
          path: game-server/coverage-parts
          merge-multiple: true

      # 묶음들이 센 것을 하나로 합친다. 모든 작업이 같은 경로에 체크아웃하므로 파일의 경로가 맞는다
      - name: 합치기
        run: uv run coverage combine coverage-parts/*.data

      # 테스트가 지나간 줄의 비율을 작업 요약(Summary)에 적는다. 기준은 다음 단계에서 본다.
      # 표에는 다 지나간 파일을 빼고, 덜 지나간 파일부터 적는다
      - name: 커버리지 요약
        run: |
          total="$(uv run coverage report --format=total)"
          echo "게임 서버 커버리지 ${total}%"
          {
            echo "### 게임 서버 커버리지 ${total}%"
            echo
            echo "<details><summary>덜 지나간 파일</summary>"
            echo
            uv run coverage report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # 합계가 기준 아래로 떨어지면 실패한다. 요약을 먼저 적은 뒤에 보므로, 실패해도 어느 파일이 덜 지나갔는지 요약에 남는다.
      # 기준은 #27 에서 처음 잰 값(95%)보다 조금 낮다. 커버리지가 오르면 기준도 올린다. 내릴 때는 PR 에 까닭을 적는다
      - name: 커버리지 기준
        env:
          COVERAGE_MIN: "93"
        run: uv run coverage report --format=total --fail-under="$COVERAGE_MIN"

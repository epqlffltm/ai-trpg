# .github/workflows/web.yml
# 화면(web/, #290)의 CI. 서버의 API 목록에서 만든 타입이 지금의 목록과 같은지, 타입 검사, 린트, 단위 시험, 빌드를 본다.
#
# PR 에서는 관문(.github/workflows/ci.yml)이 바뀐 파일을 보고 이 워크플로를 부른다(changed-servers.sh 의 web).
# 화면이 프록시에 실려 실제로 뜨는지(index.html 로 돌리기, 캐시, CSP)는 관문의 stack 이 본다.
# 끝에서 끝까지(Playwright)는 한 판이 화면으로 이어질 때 붙인다(docs/product/screens.md 의 "시작할 때 정한 것").

name: web

on:
  workflow_call:
  # main 에 들어간 뒤에는 화면이나 API 목록이 바뀐 경우에만 스스로 돈다
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/api/*.openapi.json"
      - ".github/workflows/web.yml"

# 이 워크플로는 저장소를 읽기만 한다. 필요한 권한만 준다
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # Node.js 의 버전은 web/.nvmrc 에 적힌 것을 쓴다(게시판 서버와 같은 24)
      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json 에 적힌 버전 그대로 설치한다. package.json 과 어긋나면 실패한다
      - name: 의존성 설치
        run: npm ci

      # 서버의 API 를 바꾸고 화면의 타입을 다시 만들지 않았으면 실패한다(npm run gen:api 를 돌려 함께 올린다)
      - name: API 목록에서 만든 타입이 지금의 목록과 같은가
        run: |
          npm run gen:api
          git diff --exit-code -- apps/web/src/api/generated

      # 타입이 맞지 않으면 실패한다. 빌드(Vite)는 타입을 보지 않으므로 따로 돌린다
      - name: 타입 검사
        run: npm run typecheck

      # 훅의 규칙, 쓰지 않는 값 같은 문제를 실행하지 않고 찾는다
      - name: 린트
        run: npm run lint

      # 브라우저에 나가는 의존성(devDependencies 제외)에 높음 이상의 알려진 취약점이 있으면 실패한다
      - name: 의존성 취약점 검사
        run: npm audit --omit=dev --audit-level=high

      # 서버를 부르지 않는다. fetch 를 가짜로 바꿔 갱신이 하나만 가는지(#30), 로그인 두 단계, 첫 화면의 줄을 본다
      - name: 단위 시험
        run: npm test

      # 정적 파일을 만든다. 빌드한 index.html 에 인라인 스크립트가 없어야 화면의 CSP(script 는 같은 출처만)에서 뜬다
      - name: 빌드
        run: |
          npm run build
          if grep -q '<script>' apps/web/dist/index.html; then
            echo "index.html 에 인라인 스크립트가 있다. 화면의 CSP 에서 막힌다" >&2
            exit 1
          fi

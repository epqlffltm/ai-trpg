name: 버그 신고
description: 다시 만들 수 있는 오류나, 되던 것이 안 되는 문제를 알립니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점(인증 우회, 비밀의 노출 등)은 여기에 쓰지 말고 [SECURITY.md](https://github.com/epqlffltm/ai-trpg/blob/main/SECURITY.md)의 비공개 신고로 알려 주세요.
        로그와 화면에서 토큰, 이메일 주소, 개인키, 결제의 비밀을 지워 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 영향받는 곳
      description: 해당하는 곳을 모두 고르세요.
      multiple: true
      options:
        - 인증 서버 (auth-server)
        - 게임 서버 (game-server)
        - 게시판 서버 (board-server)
        - 결제 서버 (billing-server)
        - 프록시와 공용 인프라 (docker)
        - 여러 곳 또는 모름
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 무엇이 문제인가요
      placeholder: "예: 라운드가 끝난 뒤 크레딧 홀드가 반환되지 않습니다."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 다시 만드는 방법
      description: 테스트 데이터와 조건을 포함해 단계를 적어 주세요. 다시 만들기 어려우면 본 조건을 적어 주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브랜치나 커밋, OS, 로컬인지 컨테이너인지.
      placeholder: "main / 커밋 / Docker Compose"
  - type: textarea
    id: logs
    attributes:
      label: 로그와 덧붙일 것
      description: 민감정보를 지운 로그, 또는 request_id 와 trace_id.
  - type: checkboxes
    id: safety
    attributes:
      label: 올리기 전에
      options:
        - label: 취약점의 자세한 재현 방법, 인증 정보, 개인정보, 비밀을 넣지 않았습니다.
          required: true
